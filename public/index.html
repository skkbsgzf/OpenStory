.fl-line { margin: 0 0 5px; font-size: var(--ui-fs-md); line-height: 1.85; color: var(--ink-2); }
.fl-line.is-missing, .is-missing { color: var(--meta); font-style: italic; }
.fl-line b { color: var(--ink); }
.fl-scene { font-family: var(--serif); font-size: var(--ui-fs-base); color: var(--ink); }
.fl-arch { margin-left: 6px; font-size: var(--ui-fs-xs); color: var(--meta); }
.fl-goal { display: block; margin-top: 3px; color: var(--ink); }
.fl-goal::before { content: '你要 '; color: var(--meta); font-size: var(--ui-fs-xs); }
.fl-chips-row { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0; }
.fl-chip { display: inline-block; background: color-mix(in srgb, var(--accent) 10%, transparent);
  color: var(--accent); padding: calc(1px * var(--ui-scale)) var(--ui-gap-xs); border-radius: var(--pill); }
.fl-recap-toggle { font-size: var(--ui-fs-xs); color: var(--accent); background: none; border: 0;
  padding: var(--ui-gap-3xs) 0; cursor: pointer; margin-top: var(--ui-gap-3xs); }
.fl-recap-toggle:hover { text-decoration: underline; }
.fl-recap-body { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--hair); }
.fl-sofar-row, .fl-recent-row { font-size: var(--ui-fs-sm); color: var(--muted); padding: 3px 0; line-height: 1.7; }
.fl-sofar-row { display: flex; flex-direction: column; gap: 1px; border-top: 1px dashed var(--hair); }
.fl-sofar-row b { font-size: var(--ui-fs-xs); color: var(--ink); }
.fl-rn-inline { color: var(--accent); font-size: var(--ui-fs-xs); margin-right: 5px; }
.fl-missing-note { font-size: var(--ui-fs-xs); font-style: italic; color: var(--meta);
background: transparent; border-left: 2px dashed color-mix(in srgb, var(--warn) 55%, transparent);
padding: var(--ui-gap-3xs) var(--ui-gap-sm); margin-top: var(--ui-gap-xs); }
/* 你说的话＝右气泡（OS-91 酒馆式）：你选的行动/你自己写的，就是气泡里那句话——零元标签 */
.fl-you { align-self: flex-end; max-width: 76%; padding: 10px 15px 11px;
  background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 78%, var(--ink)) 100%);
  color: var(--on-accent); border-radius: 16px 4px 16px 16px;
  font-family: var(--serif); font-size: var(--doc-font-size); line-height: var(--doc-line-height);
  box-shadow: 0 2px 14px rgba(var(--shadow-base), .3); }
.ded-flow[data-paper="1"] .fl-you { background: var(--accent); }
.fl-you-text { font-weight: 500; }
/* 待决区提示（OS-89/91）：轮到你拍板——选项环节不再靠猜 */
.fl-prompt { margin: 8px 0 10px; font-size: var(--ui-fs-sm); color: var(--ink-2);
background: color-mix(in srgb, var(--accent) 9%, transparent);
border-left: 2px solid var(--accent); padding: var(--ui-gap-xs) var(--ui-gap-md); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
/* 最新拍动作行（下一拍/重写/编辑） */
.fl-actions { display: flex; align-items: center; gap: 6px; margin-top: 10px;
  padding-top: var(--ui-gap-sm); border-top: 1px dashed var(--hair); }
.fl-actions-note { margin-right: auto; font-size: var(--ui-fs-xs); color: var(--meta); }
.fl-actions .fl-btn { color: var(--muted); background: var(--soft); backdrop-filter: none; }
.fl-actions .fl-btn:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink-2); }
.fl-actions .fl-btn.on { background: var(--accent-soft); color: var(--accent); }
.fl-actions .fl-btn.is-primary { color: var(--on-accent); background: var(--accent); font-weight: 600; }
.fl-actions .fl-btn.is-primary:hover { background: var(--accent-hover); color: var(--on-accent); }
.fl-actions .fl-btn[disabled] { opacity: .55; }
.fl-draft-input { width: 100%; min-height: 180px; max-height: 40vh; resize: vertical; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: var(--ui-gap-md) var(--ui-gap-md); outline: none; background: var(--bg);
  font-family: var(--serif); font-size: var(--ui-fs-base); line-height: 1.9; box-sizing: border-box; }
.fl-draft-input:focus { border-color: var(--ink); }
/* 待决回合：场景行＋候选宽按钮（情境分支就挂在流末） */
.fl-pending { display: flex; flex-direction: column; gap: 8px; align-self: flex-start;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-radius: 4px 16px 16px 16px; padding: var(--ui-gap-lg) var(--ui-gap-lg) calc(15px * var(--ui-scale)); }
.fl-pending-scene { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: var(--ui-fs-sm); color: rgba(255,255,255,.82); }
.ded-flow[data-paper="1"] .fl-pending-scene { color: var(--muted); }
.fl-pending-rn { font-weight: 700; font-size: var(--ui-fs-sm); }
.fl-pending-where { opacity: .85; }
.fl-who { display: inline-flex; align-items: center; gap: 4px; font-size: var(--ui-fs-xs); color: rgba(255,255,255,.88);
  background: rgba(20,18,30,.44); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm) calc(1px * var(--ui-scale)) var(--ui-gap-3xs); border-radius: var(--pill); backdrop-filter: blur(4px); }
.ded-flow[data-paper="1"] .fl-who { color: var(--ink-2); background: var(--soft); backdrop-filter: none; }
.fl-who img, .fl-who i { width: 18px; height: 18px; border-radius: 50%; object-fit: cover;
  display: grid; place-items: center; font-size: var(--ui-fs-2xs); font-weight: 700; font-style: normal; }
.fl-who-none { font-size: var(--ui-fs-xs); font-style: italic; opacity: .7; }
.fl-typing { font-size: var(--ui-fs-sm); color: rgba(255,255,255,.66); font-style: italic; }
.ded-flow[data-paper="1"] .fl-typing { color: var(--meta); }
.fl-no-cand { margin: 0; font-size: var(--ui-fs-sm); color: rgba(255,255,255,.72); }
.ded-flow[data-paper="1"] .fl-no-cand { color: var(--muted); }
.ded-opt-row { display: flex; gap: var(--ui-gap-xs); align-items: stretch; }
.ded-opt { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: var(--ui-gap-3xs);

/* 右上设置弹层（POV/种子/推进/重新开局） */

.fv-slot-v { color: var(--ink-2); line-height: 1.6; overflow-wrap: anywhere; }
.fv-causal-nodes { display: flex; flex-wrap: wrap; gap: var(--ui-gap-xs); margin-bottom: var(--ui-gap-sm); }

/* ── 故事源（S2）：Fact 链的三形态工作台 ─────────────────────

@media (max-width: 1280px) {
  .ss-grid { grid-template-columns: 216px minmax(0, 1fr); }
  .ss-right { grid-column: 1 / -1; }
}
@media (max-width: 980px) {
  .ss-grid { grid-template-columns: minmax(0, 1fr); }

}
.ss-col { min-width: 0; display: flex; flex-direction: column; gap: var(--ui-gap-md); }

.ss-card-head { display: flex; align-items: center; gap: var(--ui-gap-xs); margin-bottom: var(--ui-gap-sm); flex-wrap: wrap; }
.ss-card-head h3 { margin: 0; font-size: var(--ui-fs-md); color: var(--ink); }
.ss-card-head .sub { font-size: var(--ui-fs-xs); color: var(--meta); }
.ss-card-body { font-size: var(--ui-fs-sm); color: var(--muted); }
.ss-card .rm-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--ui-fs-sm); font-weight: 600; color: var(--ink-2); }
.ss-card .rm-badge { font-size: var(--ui-fs-2xs); font-weight: 400; color: var(--meta); font-variant-numeric: tabular-nums; }

.ss-layer-tabs .ss-tab { flex: 0 0 auto; }

.ss-tab:hover { color: var(--ink); }
.ss-tab.on { background: var(--bg); color: var(--ink); box-shadow: var(--shadow-card); }
.ss-align { font-size: var(--ui-fs-2xs); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm); background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--muted); white-space: nowrap; }
.ss-align.approximate { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn-ink); }
.ss-tree { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); }

/* ── 同源版本状态条（世界书页 / 故事源页）──────────────────────────
   一行紧凑条：圆点 + 主文案 + 可展开明细 + 元信息，换行不抢正文空间。
   三档只用语义令牌上色（dot 由 .ok/.warn/.bad 决定），不写死色值。 */
/* 进场同步提示（OS-115）：发现不同步时一条带动作的横幅，不做模态 */
.sync-prompt { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; padding: 9px 13px;
  background: color-mix(in srgb, var(--warn) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: var(--radius); }
.sync-prompt-ic { color: var(--warn); font-size: 14px; flex-shrink: 0; }
.sync-prompt-body { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sync-prompt-body b { font-size: 12.5px; color: var(--ink); }
.sync-prompt-why { font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.sync-prompt-ops { display: flex; gap: 6px; flex-shrink: 0; }
/* 设置·同步（OS-116 压成一块）：一行策略＋一行状态，不放说明段与重复按钮 */
.sync-set { display: flex; flex-direction: column; gap: 8px; margin: 2px 0 6px; }
.sync-set-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sync-set-label { font-size: 11.5px; color: var(--meta); }
.sync-set-row .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: var(--pill); overflow: hidden; }
.sync-set-row .seg-btn { padding: 2px 11px; font-size: 11.5px; color: var(--muted); background: transparent; cursor: pointer; }
.sync-set-row .seg-btn + .seg-btn { border-left: 1px solid var(--hair); }
.sync-set-row .seg-btn.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sync-set-status-row { display: flex; align-items: center; gap: 7px; }
.sync-set-status-text { flex: 1; min-width: 0; font-size: 11.5px; color: var(--ink-2);
  overflow-wrap: anywhere; }
.sync-mini { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--hair);
  background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; line-height: 1; }
.sync-mini:hover { color: var(--accent); border-color: var(--accent); }

.sync-bar { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--ui-gap-xs) var(--ui-gap-sm); padding: var(--ui-gap-2xs) var(--ui-gap-md); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: var(--radius); font-size: var(--ui-fs-xs); line-height: var(--ui-lh-normal); color: var(--muted); }
.sync-bar.ok { border-left-color: var(--ok); }
.sync-bar.warn { border-left-color: var(--warn); }
.sync-bar.bad { border-left-color: var(--danger); }
.sync-dot { flex: 0 0 auto; align-self: center; width: 6px; height: 6px; border-radius: 50%; background: var(--meta); }
.sync-bar.ok .sync-dot { background: var(--ok); }
.sync-bar.warn .sync-dot { background: var(--warn); }
.sync-bar.bad .sync-dot { background: var(--danger); }
.sync-main { color: var(--ink-2); }
.sync-main b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.sync-sep { color: var(--hair); }
.sync-meta { color: var(--meta); }
.sync-notice { color: var(--warn-ink); }
.sync-btn { flex: 0 0 auto; padding: var(--ui-gap-3xs) var(--ui-gap-sm); border: 1px solid var(--line); border-radius: var(--pill); font-size: var(--ui-fs-2xs); color: var(--muted); }
.sync-btn:hover { border-color: var(--ink); color: var(--ink); }
.sync-btn:disabled { opacity: .55; cursor: default; border-color: var(--hair); color: var(--meta); }
.sync-list { flex: 1 1 100%; margin: var(--ui-gap-2xs) 0 0; padding: 0 0 0 var(--ui-gap-lg); max-height: 180px; overflow-y: auto; list-style: none; }
.sync-list li { display: flex; flex-wrap: wrap; gap: var(--ui-gap-xs); padding: var(--ui-gap-3xs) 0; border-top: 1px dashed var(--hair); }
.sync-list li:first-child { border-top: 0; }
.sync-path { font-family: var(--mono); font-size: var(--ui-fs-2xs); color: var(--ink-2); overflow-wrap: anywhere; }

/* ── 色板（左下角浮层）──────────────────────────────────── */
/* OS-162：导入导出弹层（令牌化，零硬编码色） */
.modal-mask { position: fixed; inset: 0; background: var(--shadow); display: grid; place-items: center; z-index: 120; }
.modal-card { width: min(760px, 92vw); max-height: 86vh; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--ui-gap-lg); }
.modal-card .row { margin: var(--ui-gap-sm) 0; display: flex; gap: var(--ui-gap-sm); align-items: flex-start; flex-wrap: wrap; }
.modal-card .row label { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); flex: 1; min-width: 220px; font-size: var(--ui-fs-sm); color: var(--muted); }
.modal-card textarea, .modal-card input, .modal-card select { background: var(--surface-card); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-sm); font: inherit; }
.modal-card textarea { width: 100%; font-family: var(--mono); }
.ex-result { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: var(--ui-fs-xs); color: var(--ink); background: var(--soft); border-radius: var(--radius); padding: var(--ui-gap-sm); max-height: 30vh; overflow: auto; }

/* ══ OS-225/227 中性 wiki 与独立知识库（复用世界书视觉，独立语义）════════
   公共层只产出 wiki-* 类；世界书与知识库各自注入动作属性。窄屏必须像世界书
   一样降为单列（左栏抽屉／上方折叠），不允许把主区压成一字一行。 */

.wiki-node-card { position: absolute; top: 10px; right: 10px; width: 244px; max-width: 60%; background: var(--bg); border-radius: var(--radius-md); box-shadow: var(--shadow-float); padding: var(--ui-gap-md); z-index: 5; display: flex; flex-direction: column; gap: var(--ui-gap-sm); }

.degraded-note { font-size: var(--ui-fs-sm); color: var(--warn-ink); background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); }
.kb-workspace .topic-main { display: flex; flex-direction: column; gap: var(--ui-gap-md); }
.kb-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--ui-gap-sm) var(--ui-gap-md); }
.kb-toolbar h1 { margin: 0; font-size: var(--ui-fs-2xl); }
.kb-toolbar .sp { flex: 1; }
.kb-library-picker { display: flex; align-items: center; flex-wrap: wrap; gap: var(--ui-gap-sm) var(--ui-gap-md); }
.kb-library-picker label { display: flex; align-items: center; gap: var(--ui-gap-xs); font-size: var(--ui-fs-sm); color: var(--muted); }
.kb-search { display: flex; gap: var(--ui-gap-xs); flex-wrap: wrap; }
.kb-search input { flex: 1; min-width: 160px; }
.kb-index { display: flex; align-items: center; flex-wrap: wrap; gap: var(--ui-gap-xs) var(--ui-gap-sm); }
.kb-index h3 { margin: 0; font-size: var(--ui-fs-sm); color: var(--muted); font-weight: 600; }
.kb-status { font-size: var(--ui-fs-xs); border-radius: var(--pill); padding: 1px var(--ui-gap-sm); background: var(--soft); color: var(--muted); }
.kb-status.fresh { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.kb-status.stale, .kb-status.failed { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn-ink); }
.kb-status.building { background: var(--accent-soft); color: var(--accent); }
.kb-form, .kb-customization { border: 1px solid var(--hair); border-radius: var(--radius-md); padding: var(--ui-gap-md); display: flex; flex-direction: column; gap: var(--ui-gap-sm); background: var(--surface-card); }
.kb-form h3, .kb-customization h3 { margin: 0; font-size: var(--ui-fs-md); }
/* 定制默认收起：summary 一行显示当前参数，点开才编辑。 */
.kb-customization > summary { cursor: pointer; display: flex; align-items: baseline; gap: var(--ui-gap-sm); flex-wrap: wrap; list-style: none; }
.kb-customization > summary::-webkit-details-marker { display: none; }
.kb-customization > summary::after { content: '▸'; color: var(--meta); font-size: var(--ui-fs-xs); }
.kb-customization[open] > summary::after { content: '▾'; }
.kb-custom-hint { font-size: var(--ui-fs-xs); color: var(--meta); }
.kb-custom-body { display: flex; flex-direction: column; gap: var(--ui-gap-sm); }
.kb-index-why { font-size: var(--ui-fs-xs); color: var(--muted); }
.kb-form label, .kb-customization label { display: flex; align-items: center; gap: var(--ui-gap-sm); font-size: var(--ui-fs-sm); color: var(--muted); flex-wrap: wrap; }
.kb-form input, .kb-customization input { flex: 1; min-width: 160px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-2xs) var(--ui-gap-sm); font: inherit; }
.kb-actions { display: flex; gap: var(--ui-gap-xs); flex-wrap: wrap; }
.kb-preview { display: flex; flex-direction: column; gap: 2px; font-size: var(--ui-fs-sm); color: var(--muted); background: var(--soft); border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); }
.kb-hit { border: 1px solid var(--hair); border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); display: flex; flex-direction: column; gap: 2px; }
.kb-hit b { font-size: var(--ui-fs-md); }
.kb-hit span { font-size: var(--ui-fs-2xs); color: var(--meta); }
.kb-hit p { margin: 0; font-size: var(--ui-fs-sm); color: var(--ink-2); }
.kb-document-text { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--serif); font-size: var(--doc-font-size, 16px); line-height: var(--doc-line-height, 1.9); margin: 0; }
.wiki-path { font-size: var(--ui-fs-xs); color: var(--meta); }
@media (max-width: 900px) {
  .wiki-flow { flex-direction: column; }
  .wiki-side { flex: 1 1 auto; width: 100%; flex-direction: row; flex-wrap: wrap; }
  .wiki-side > * { flex: 1 1 240px; min-width: 0; }
  .wiki-node-card { position: static; width: 100%; max-width: 100%; }
}
@media (max-width: 720px) {
  .kb-toolbar h1 { font-size: var(--ui-fs-xl); }
  .kb-form label, .kb-customization label { align-items: stretch; flex-direction: column; gap: 2px; }
}
/* 窄屏：世界书/知识库共用同一套降级——两栏改单栏，导航折到主区上方，
   正文不再被固定 236px 侧栏挤成一字一行。 */
@media (max-width: 900px) {
  .ref-grid { grid-template-columns: minmax(0, 1fr); }
  .ref-sidenav { max-height: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">O</span><span class="brand-name">OpenStory</span></div>
    <!-- 库切换器：logo 右侧，默认显示当前库，点击下方弹库面板 -->
    <div class="lib-switch" id="lib-switch">
      <button class="lib-switch-btn" id="lib-switch-btn" data-action="toggle-lib-switch" title="切换库">
        <span class="mark">库</span><span id="lib-switch-name">选择库</span><span class="caret">▾</span>
      </button>
      <div class="lib-switch-panel" id="lib-switch-panel"></div>
    </div>
    <span class="sp"></span>
    <!-- 设置：右上角总入口（Agent 运行时/套件/外观/数据目录） -->
    <button class="top-settings" data-go="settings" title="设置（运行时/套件/外观/数据目录）">
      <span class="gear-glyph">⚙</span>设置
    </button>
  </header>

  <div class="main">
    <!-- Agent 列（一等公民，OS-45 归位最左）：会话 JSONL 在 daemon 侧，凭据只存本机配置。
         小说/世界书这些题材是右侧工作台里的模块，不占 Agent 的位置。 -->
    <aside class="agent-col" id="agent-col">
      <div class="agent-head">
        <span class="agent-avatar">A</span><span class="agent-name">Agent 栏</span>
        <span class="agent-model" id="agent-model-chip" hidden></span>
        <span class="agent-head-sp"></span>
        <!-- 会话列表（OS-31）：从横条药丸改成右上角下拉，标题栏只留一个带计数的按钮 -->
        <div class="agent-sess-dd" id="agent-sess-dd">
          <button class="agent-sess-btn" id="agent-sess-btn" data-action="toggle-agent-sessions" title="会话列表">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 3.5h11M2.5 8h11M2.5 12.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
            <span id="agent-sess-count">0</span>
          </button>
          <div class="agent-sess-panel" id="agent-sess-panel"></div>
        </div>
        <button class="agent-collapse" data-action="agent-collapse" title="收起/展开 Agent 栏" aria-label="收起/展开 Agent 栏">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <rect x="2.2" y="3" width="11.6" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M6.2 3v10" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
      </div>
      <div class="agent-current" id="agent-current"></div>
      <div id="agent-knowledge-chain"></div>
      <div class="agent-body" id="agent-thread">
        <div class="agent-empty">
          <strong>问剧情、要一段正文、改设定…</strong>
          回答可以转成「待确认卡」，采纳后才真正写进正文文件。
        </div>
      </div>
      <div class="agent-context" id="agent-context"></div>
      <div class="composer">
        <textarea id="agent-input" placeholder="先选一个库，再和 Agent 聊…" disabled></textarea>
        <!-- 工具行（OS-51）：风格/＋ 与发送键平级，靠左小按钮，不再占显眼位置 -->
        <div class="row">
          <div class="composer-tools">
            <button class="c-tool" id="agent-style-btn" data-action="toggle-style-menu" title="题材风格">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2.6c-3 0-5.4 2.3-5.4 5.2 0 1.7.9 2.6 2 3.4.6.4.9 1 .9 1.7v.5c0 .4.3.7.7.7h3.6c.4 0 .7-.3.7-.7v-.5c0-.7.3-1.3.9-1.7 1.1-.8 2-1.7 2-3.4C13.4 4.9 11 2.6 8 2.6z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.2 15h3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button class="c-tool" id="agent-plus-btn" data-action="toggle-plus-menu" title="引用文件 / 指令 / 技能">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </div>
          <span class="mode" id="agent-mode-chip" hidden>对话</span>
          <span class="mode" id="agent-lib-chip" hidden></span>
          <span class="sp"></span>
          <button class="send" id="agent-send" title="发送" data-action="agent-send" disabled>↑</button>
          <button class="send stop" id="agent-stop" title="停止" data-action="agent-stop" hidden>■</button>
        </div>
        <div class="composer-pop" id="agent-style-menu" hidden></div>
        <div class="composer-pop" id="agent-plus-menu" hidden></div>
      </div>
    </aside>

    <!-- 中栏：题材工作台（正文/世界书/产物…都放这里） -->
    <main class="center" id="center">
      <div class="tabs" id="tabs"></div>
      <div class="content" id="view"><div class="loading">正在读取库清单…</div></div>
    </main>
  </div>
</div>

<!-- 弹层：Agent 设置 / 转待确认卡（内容由 app.js 注入） -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<!-- 单段分析结果（OS-37：右键一段 → 分析这一段） -->
<aside class="para-result" id="para-result"></aside>

<!-- OS-98：?v= 让浏览器在代码更新后必然拿到新版本（此前强缓存导致改动不生效） -->
<script src="./app.js?v=98" defer></script>
</body>
</html>
