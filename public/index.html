<!doctype html>
<html lang="zh-CN" data-skin="coral" data-build="os119">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenStory · OS-119</title>
<!-- OS-113 嵌入模式：被 DSH 右侧栏以 iframe 嵌入（或显式 ?embed=1）时，
     宿主左侧已经有真正的 DSH 会话，本页收掉自带的 Agent 左列。
     在 <head> 里先加类，避免首帧闪一下 Agent 栏再消失。 -->
<script>
  (function () {
    try {
      var embed = new URLSearchParams(location.search).get('embed') === '1' || window.self !== window.top
      if (embed) document.documentElement.classList.add('os-embed')
    } catch (_) { /* 极端环境下不拦页面 */ }
  })()
</script>
<style>
/* ── 风格包（OS-5：目录加载，本块只是无 JS 兜底的珊瑚默认）──────────
   真皮是 openstory/styles 目录下的 json（内置）＋本机 OpenStory/openstory/styles 目录，
   工作台运行时注入 skin-style 样式块后置覆盖。 */
:root {
  --bg: #ffffff; --soft: #faf9f7; --warm: #fff6ef;
  --ink: #222222; --ink-2: #3d3a36; --muted: #6f6a63; --meta: #a39d94;
  --line: #e7e3dd; --hair: #f0ede8;
  --accent: #ff385c; --accent-hover: #e31c5f; --accent-active: #e00b41; --accent-soft: #fff1f3;
  --ok: #008a05; --danger: #c13515;
  --warn: #c48a00; --warn-ink: #a06a00; --warn-on-dark: #ffd7a8;
  /* OS-201：治理台三类着色；浅底卡面用 color-mix(in srgb, var(--cat-*) 10%, var(--bg)) 派生 */
  --cat-kernel: #8a63d2; --cat-workbench: #4f8fd0; --cat-host: #b08968;
  --on-accent: #ffffff;
  --scene-deep: #2b2a4a; --scene-mid: #4a3d6b; --scene-far: #6b4f6b; --scene-overlay: rgba(20,18,30,.55);
  --radius-sm: 6px; --radius: 10px; --radius-md: 14px; --radius-lg: 20px; --pill: 999px;
  --shadow: 0 8px 30px rgba(34,34,34,.08);
  /* 卡片与浮层的语义色/影（OS-49，照 OpenDesign 逆出的口径）：
     · --surface-card 是「比画布深一档的中性面」，从 ink 混进 bg 派生（不用偏暖的 --soft，
       否则珊瑚皮/墨皮会显脏）；同一 token 在夜间皮里自动变浅一档
     · 阴影基色用暖墨 1c1b1a（OD 口径），不用纯黑
     · 静息卡片只留 1px 级微影，浮起才加散影；容器（左右栏）本身不投影——影属于卡片 */
  --surface-card: color-mix(in srgb, var(--ink) 3%, var(--bg));
  --shadow-base: 28, 27, 26;
  --shadow-card: 0 1px 2px rgba(var(--shadow-base), .05), 0 1px 3px rgba(var(--shadow-base), .04);
  --shadow-card-hover: 0 2px 6px rgba(var(--shadow-base), .07), 0 1px 2px rgba(var(--shadow-base), .05);
  --shadow-float: 0 1px 2px rgba(var(--shadow-base), .04), 0 10px 28px -10px rgba(var(--shadow-base), .18);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --serif: "Noto Serif SC", "Songti SC", Georgia, serif;
  --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  --content-max: 1180px; --content-px: 40px;
}
* { box-sizing: border-box; }
/* 夜间皮阴影加深（浅色阴影在深底上不可见） */
html[data-skin="night"] {
  --shadow-base: 0, 0, 0;
  /* 夜皮：类别色提亮一档，色点/浅底在深底上仍看得清 */
  --cat-kernel: #b79cf0; --cat-workbench: #8fc0f0; --cat-host: #d9b394;
  --shadow-card: 0 1px 2px rgba(var(--shadow-base), .38), 0 1px 3px rgba(var(--shadow-base), .3);
  --shadow-card-hover: 0 2px 8px rgba(var(--shadow-base), .46), 0 1px 3px rgba(var(--shadow-base), .32);
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: var(--ui-fs-base); line-height: var(--ui-lh-normal); font-family: var(--sans); -webkit-font-smoothing: antialiased; transition: background .2s cubic-bezier(.2,0,0,1); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
::selection { background: var(--accent-soft); }
/* ══ OS-102 滚动条统一（作者实测：页签栏下面那条跟别处不一致）══════
   症状：全局只有一条 8px 的 webkit 规则，但
     · Firefox 走 scrollbar-width: thin（≈6px 且颜色跟主题无关）
     · Chrome 走 webkit 规则，但没设轨道/悬停色
     · 9 个 overflow-x 容器各自表现不同（有的撑出横向条、有的挤占内容）
   统一策略：
     纵向 8px / 横向 6px（横向条更细，不抢页签栏的高度）
     滑块用 --meta 而非 --line（--line 太浅，夜皮里几乎看不见）
     悬停变 --muted；轨道透明（不留白条）
     .tabs 这类「只该横向滚但不想看见条」的容器用 .scrollbar-overlay 隐藏 */
::-webkit-scrollbar { width: 8px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--meta) 55%, transparent);
  border-radius: 999px;
  border: 1px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }
/* Firefox：thin 太细、auto 太粗，统一用 thin 并配主题色 */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--meta) 55%, transparent) transparent; }

/* 隐藏横向滚动条但保留滚动能力（页签栏、缩略图条这类） */
.scrollbar-overlay { scrollbar-width: none; -ms-overflow-style: none; }
.scrollbar-overlay::-webkit-scrollbar { height: 0; width: 0; }

.app { height: 100vh; display: flex; flex-direction: column; }

/* ── 顶栏 ─────────────────────────────────────────────── */
.topbar { height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: var(--ui-gap-md); padding: 0 14px 0 12px; border-bottom: 1px solid var(--hair); }
.brand { display: flex; align-items: center; gap: var(--ui-gap-sm); min-width: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: var(--ui-fs-md); }
.brand-name { font-weight: 700; font-size: var(--ui-fs-base); letter-spacing: .2px; }
.crumb { display: flex; align-items: center; gap: var(--ui-gap-sm); min-width: 0; }
/* 库切换器（OS-12）：顶栏右上，与 Agent 设置平级 */
.lib-switch { position: relative; }
.lib-switch-btn { display: flex; align-items: center; gap: var(--ui-gap-sm); border: 1px solid var(--line); border-radius: var(--pill); padding: var(--ui-gap-2xs) var(--ui-gap-md); background: var(--bg); }
.lib-switch-btn:hover { border-color: var(--ink); }
.lib-switch-btn .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: var(--ui-fs-2xs); font-weight: 700; }
.lib-switch-btn #lib-switch-name { font-weight: 600; font-size: var(--ui-fs-md); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-switch-btn .caret { color: var(--meta); font-size: var(--ui-fs-2xs); }
.lib-switch-panel { position: absolute; left: 0; top: calc(100% + 6px); width: 340px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: var(--ui-gap-sm); display: none; z-index: 80; }
.lib-switch-panel.open { display: block; }
.lib-switch-panel .sw-lib { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); width: 100%; padding: var(--ui-gap-sm) var(--ui-gap-md); border-radius: var(--radius); text-align: left; }
.lib-switch-panel .sw-lib:hover { background: var(--soft); }
.lib-switch-panel .sw-lib.on { background: var(--accent-soft); }
.lib-switch-panel .sw-lib b { font-size: var(--ui-fs-md); }
.lib-switch-panel .sw-lib .path { font-family: var(--mono); font-size: var(--ui-fs-xs); color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-switch-panel .divider { border-top: 1px solid var(--hair); margin: var(--ui-gap-xs) var(--ui-gap-2xs); }
.lib-switch-panel .ops { display: flex; gap: var(--ui-gap-xs); padding: var(--ui-gap-2xs); flex-wrap: wrap; }
.lib-switch-panel .ops button { flex: 1; border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-xs) var(--ui-gap-sm); font-size: var(--ui-fs-sm); }
.lib-switch-panel .ops button:hover { border-color: var(--ink); }
.lib-switch-panel .empty { padding: var(--ui-gap-lg) var(--ui-gap-md); color: var(--muted); font-size: var(--ui-fs-sm); line-height: 1.7; text-align: center; }
.top-settings { display: flex; align-items: center; gap: var(--ui-gap-xs); border: 1px solid var(--line); border-radius: var(--pill); padding: var(--ui-gap-2xs) var(--ui-gap-lg); color: var(--muted); }
.top-settings:hover { border-color: var(--ink); color: var(--ink); }
.top-settings .gear-glyph { font-size: var(--ui-fs-md); }
.pill { padding: var(--ui-gap-3xs) var(--ui-gap-md); border: 1px solid var(--line); border-radius: var(--pill); font-size: var(--ui-fs-sm); color: var(--muted); }
.topbar .sp { flex: 1; }
.icon-btn {
  width: var(--ui-ctl-h); height: var(--ui-ctl-h); border-radius: 50%;
  display: grid; place-items: center; color: var(--muted);
  font-size: var(--ui-fs-base); line-height: 1;
  transition: background .12s ease, color .12s ease;
}
.icon-btn:hover { background: var(--soft); color: var(--ink); }
.gear { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.gear:hover { color: var(--ink); border-color: var(--ink); }

/* ── 主体：Agent 左列 ＋ 中栏 ───────────────────────────── */
.main { flex: 1; display: flex; min-height: 0; }

/* Agent 左列（OS-4：会话 JSONL＋流式对话＋待确认卡） */
/* ══ OS-103 Agent 栏折叠（作者指定：开关在面板与内容区交界处）══════
   展开 320px / 收起 44px 窄轨道。收起后只留一个竖排的展开按钮，
   Agent 内容整体隐藏（不是缩成一团），内容区拿到全部剩余宽度。
   状态存库内 ui-state（agentCollapsed），换机器也记得。 */
.agent-col {
  width: 320px; flex: 0 0 320px;
  border-right: 1px solid var(--hair);
  display: flex; flex-direction: column; min-width: 0; background: var(--bg);
  transition: width .18s ease, flex-basis .18s ease;
}
.agent-col.is-collapsed { width: 44px; flex: 0 0 44px; }
/* 收起时：除折叠按钮外的所有内容都隐藏 */
.agent-col.is-collapsed > *:not(.agent-head) { display: none; }
.agent-col.is-collapsed .agent-head {
  flex-direction: column; padding: var(--ui-gap-sm) 0; gap: var(--ui-gap-sm);
  height: 100%; justify-content: flex-start; align-items: center;
}
.agent-col.is-collapsed .agent-head > *:not(.agent-collapse) { display: none; }

/* 折叠开关：与 VS Code 侧栏同构——一个方框带竖分割线的图标 */
.agent-collapse {
  flex: 0 0 auto; width: calc(24px * var(--ui-scale)); height: calc(24px * var(--ui-scale));
  display: grid; place-items: center; border-radius: var(--radius-sm);
  color: var(--meta); transition: background .12s ease, color .12s ease;
}
.agent-collapse:hover { background: var(--soft); color: var(--ink-2); }
.agent-collapse:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* 收起态下图标转 90°（提示「点一下展开」） */
.agent-col.is-collapsed .agent-collapse { transform: rotate(90deg); }

/* ══ OS-113 嵌入模式（DSH 右侧栏 iframe / ?embed=1）════════════════
   宿主左侧本来就是真正的 DSH 会话：这里把 OpenStory 自带的 Agent 栏左列
   整体收掉（display:none，不是折叠轨道），工作台拿回全部宽度，
   避免「两条 Agent 栏」；独立打开时行为不变。纯渲染分支，不落任何状态。 */
html.os-embed .agent-col { display: none; }
/* 题材工作面内部左栏（OS-45）：章节树 / 世界书图谱 / 世界书摘要。
   它属于「小说/世界书」这类题材页自己的布局，属于二等公民的内部结构；
   Agent 始终在最外层最左，不参与题材页的布局。 */
/* 类纸（OS-47）：左右侧模块＝无边框软卡片，堆叠留缝，不画框线
   OS-48：左栏是**浮层附庸**，绝对定位脱离正文流——正文纸面永远按窗口居中，
   开/关左栏都不动正文一个像素。 */
/* 类纸左右侧模块（OS-47/49）：栏是透明容器，不投影；每张卡自己带极轻底影 */
.ref-col { position: absolute; left: 0; top: 0; bottom: 0; z-index: 42; width: 248px; display: flex; flex-direction: column; gap: var(--ui-gap-sm); min-width: 0; background: transparent; overflow-y: auto; padding: var(--ui-gap-md) var(--ui-gap-md) var(--ui-gap-md); }
.ref-col:empty { display: none; }
.ref-col.collapsed-all { display: none; }
.ref-mod { flex: 0 0 auto; background: var(--surface-card); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); transition: box-shadow .16s ease; }

/* ── OS-89：模块修改日志卡（左栏「本模块修改」）────────────────────
   作者立宪：每个模块加载时自己检索自己的 log，并如实呈现。
   一行一次修改：时间 / 动作 / 文件 / 字数变化；数据源 .openstory/log/<模块>/*.jsonl */
.modlog { display: flex; flex-direction: column; }
.modlog-head { display: flex; align-items: center; gap: var(--ui-gap-xs); padding: var(--ui-gap-xs) var(--ui-gap-md) var(--ui-gap-2xs); font-size: var(--ui-fs-sm); font-weight: 600; color: var(--ink-2); }
.modlog-head .count { margin-left: auto; font-size: var(--ui-fs-2xs); font-weight: 400; color: var(--meta); }
.modlog-row { display: grid; grid-template-columns: 62px 34px minmax(0, 1fr) auto; gap: var(--ui-gap-xs); align-items: baseline;
  padding: var(--ui-gap-3xs) var(--ui-gap-md); font-size: var(--ui-fs-xs); color: var(--muted); border-top: 1px dashed var(--hair); }
.modlog-row:hover { background: var(--soft); }
.modlog-at { font-variant-numeric: tabular-nums; color: var(--meta); font-size: var(--ui-fs-xs); }
.modlog-op { font-size: var(--ui-fs-2xs); border-radius: var(--pill); padding: 0 6px; text-align: center;
  background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink-2); }
.modlog-op[data-op="create"] { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.modlog-op[data-op="delete"] { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.modlog-file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.modlog-delta { font-size: var(--ui-fs-2xs); color: var(--meta); font-variant-numeric: tabular-nums; white-space: nowrap; }
.modlog-empty { margin: 0; padding: var(--ui-gap-2xs) var(--ui-gap-md) var(--ui-gap-md); font-size: var(--ui-fs-xs); color: var(--meta); font-style: italic; }

/* OS-90：日志行可点 + diff 弹层
   .modlog-row 现在是 button（点击看完整 diff），要显式重置按钮默认样式 */
button.modlog-row { width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px dashed var(--hair);
  font: inherit; cursor: pointer; }
button.modlog-row:hover { background: var(--accent-soft); }
button.modlog-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.diff-view { max-height: min(52vh, 460px); overflow: auto; margin: var(--ui-gap-sm) 0 4px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
  font-family: var(--mono); font-size: var(--ui-fs-sm); line-height: 1.55; padding: var(--ui-gap-xs) 0; }
.diff-line { padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff-line.hdr { color: var(--meta); }
.diff-line.hunk { color: var(--accent); background: var(--accent-soft); }
.diff-line.add { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ink-2); }
.diff-line.del { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--ink-2); }
.diff-line.ctx { color: var(--muted); }
.ref-mod:hover { box-shadow: var(--shadow-card-hover); }
/* 卡片头统一（OS-48）：标题 + 计数 + 折叠 + 关闭 ×，左三卡与右栏分析头同构 */
.ref-mod-head { display: flex; align-items: center; gap: var(--ui-gap-3xs); padding: var(--ui-gap-2xs) var(--ui-gap-xs) var(--ui-gap-2xs) var(--ui-gap-md); font-size: var(--ui-fs-sm); font-weight: 600; color: var(--ink-2); user-select: none; }
.ref-mod-head:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.rm-toggle { display: flex; align-items: center; gap: var(--ui-gap-xs); flex: 1; min-width: 0; padding: var(--ui-gap-2xs) 0; text-align: left; font: inherit; color: inherit; }
.ref-mod .rm-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-mod .rm-chev { color: var(--meta); font-size: var(--ui-fs-xs); transition: transform .14s ease; transform: rotate(-90deg); }
.ref-mod[data-open="1"] .rm-chev { transform: rotate(90deg); }
.ref-mod .rm-badge { font-size: var(--ui-fs-2xs); font-weight: 400; color: var(--meta); padding: 0 2px; font-variant-numeric: tabular-nums; }
/* 卡片统一关闭按钮（OS-48）：与右栏分析面板的 × 同尺寸同悬停 */
.rm-x { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--meta); font-size: var(--ui-fs-base); line-height: 1; flex: 0 0 auto; }
.rm-x:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }
.ref-mod-body { padding: 0 10px 12px; font-size: var(--ui-fs-sm); color: var(--muted); }
/* 章节树（两级：卷/章） */
.ct-vol { font-size: var(--ui-fs-xs); color: var(--meta); padding: var(--ui-gap-xs) var(--ui-gap-2xs) var(--ui-gap-3xs); letter-spacing: .04em; }
.ct-row { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: var(--ui-gap-xs); width: 100%; padding: var(--ui-gap-2xs) var(--ui-gap-xs); border-radius: var(--radius); text-align: left; align-items: baseline; }
.ct-row:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.ct-row.on { background: var(--accent-soft); color: var(--ink); }
.ct-row .no { font-family: var(--mono); font-size: var(--ui-fs-2xs); color: var(--meta); }
.ct-row .tt { font-size: var(--ui-fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 世界书图谱画布 */
.graph-box { position: relative; width: 100%; height: 190px; border-radius: var(--radius); background: transparent; overflow: hidden; }
.graph-box canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.graph-box.dragging canvas { cursor: grabbing; }
.graph-legend { display: flex; flex-wrap: wrap; gap: var(--ui-gap-sm); margin-top: var(--ui-gap-xs); font-size: var(--ui-fs-2xs); color: var(--meta); }
.graph-legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: var(--ui-gap-3xs); vertical-align: 1px; }
.graph-hint { margin-top: var(--ui-gap-2xs); font-size: var(--ui-fs-2xs); color: var(--meta); }
/* 世界书摘要 */
.ref-summary { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; font-size: var(--ui-fs-sm); color: var(--ink-2); max-height: 260px; overflow-y: auto; }
.ref-summary-ops { display: flex; gap: var(--ui-gap-xs); margin-top: var(--ui-gap-xs); }
.ref-summary-ops button { font-size: var(--ui-fs-xs); color: var(--muted); border: 1px solid var(--line); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-md); }
.ref-summary-ops button:hover { border-color: var(--ink); color: var(--ink); }
/* 世界书页（OS-48）：侧栏导航 / 主区（视图制：笔记 / 关系图谱）/ 反链 */
.ref-page { display: flex; flex-direction: column; gap: var(--ui-gap-md); }
.ref-toolbar { display: flex; align-items: center; gap: var(--ui-gap-md); }
.ref-toolbar h1 { margin: 0; font-size: var(--ui-fs-2xl); }
.ref-toolbar .sp { flex: 1; }
.ok-note { font-size: var(--ui-fs-sm); color: var(--ok); background: var(--soft); border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); }
.ref-grid { display: grid; grid-template-columns: 236px minmax(0,1fr); gap: var(--ui-gap-md); align-items: start; }
@media (max-width: 1280px) { .ref-grid { grid-template-columns: 212px minmax(0,1fr); } }
.ref-sidenav { border: 0; border-radius: var(--radius-md); background: var(--soft); padding: var(--ui-gap-md) var(--ui-gap-sm); max-height: calc(100vh - 230px); overflow-y: auto; }
/* 侧栏导航（OS-51）：视图 / 按标签筛选（三级折叠树） / 笔记（主体） */
.ref-nav { display: flex; flex-direction: column; gap: var(--ui-gap-md); }
.ref-nav .search { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-2xs) var(--ui-gap-md); font-size: var(--ui-fs-sm); background: var(--bg); }
.ref-nav .search:focus { outline: none; border-color: var(--ink-2); }
.nav-group { display: flex; flex-direction: column; gap: calc(1px * var(--ui-scale)); }
.nav-group.grow { min-height: 120px; }
.nav-group-label { font-size: var(--ui-fs-xs); color: var(--meta); letter-spacing: .05em; padding: var(--ui-gap-3xs) var(--ui-gap-xs) var(--ui-gap-2xs); }
/* 侧栏行（OS-54 重做）：三级用「缩进 + 字重 + 字号 + 颜色」四个维度同时拉开，
   不再只靠一个灰字——作者指出二级/三级区分度不够、加粗关系混乱 */
.nav-row { display: flex; align-items: center; gap: var(--ui-gap-xs); width: 100%; padding: var(--ui-gap-2xs) var(--ui-gap-sm); border-radius: var(--radius); text-align: left; font-size: var(--ui-fs-sm); color: var(--muted); }
.nav-row:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.nav-row.on { background: var(--accent-soft); color: var(--ink); }
/* 一级：视图行——最重 */
.nav-row.view { padding: var(--ui-gap-xs) var(--ui-gap-sm); }
.nav-row.view span { font-weight: 700; font-size: var(--ui-fs-md); color: var(--ink-2); }
.nav-row.on.view span { color: var(--ink); }
/* 二级：标签枝干——中重，行高更高；深层标签字重回落 */
.nav-row.tag { padding: var(--ui-gap-2xs) var(--ui-gap-sm); font-weight: 600; font-size: var(--ui-fs-md); color: var(--ink-2); }
.tag-branch .tag-branch > summary .nav-row.tag,
.tag-branch .tag-branch .nav-row.tag { font-weight: 500; font-size: var(--ui-fs-sm); color: var(--muted); }
.nav-row.tag .tag-name::before { content: '#'; margin-right: var(--ui-gap-3xs); color: var(--meta); font-weight: 400; }
/* 三级：笔记叶——最轻，缩进最深，前置小圆点 */
.nav-row.note { padding: var(--ui-gap-3xs) var(--ui-gap-sm) var(--ui-gap-3xs) var(--ui-gap-md); font-weight: 400; font-size: var(--ui-fs-sm); color: var(--muted); }
.nav-row.note .tag-name::before { content: '·'; margin-right: var(--ui-gap-2xs); color: var(--meta); font-weight: 700; }
.nav-row.on .tag-name { font-weight: 600; }
.nav-row.tag-empty { opacity: .55; }
.nav-row.tag-empty:hover { opacity: .85; }
.nav-row .tag-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count { font-size: var(--ui-fs-2xs); color: var(--meta); font-variant-numeric: tabular-nums; }
.nav-row.note .nav-count { opacity: .8; }
.nav-empty { font-size: var(--ui-fs-xs); color: var(--meta); padding: var(--ui-gap-2xs) var(--ui-gap-sm); margin: 0; line-height: 1.7; }
/* 标签三级树（OS-54）：每级 18px 缩进＋虚线引导，层级一眼可辨 */
.tag-branch, .tag-leaf { margin-left: calc(var(--depth, 0) * 18px); }
.tag-branch:not(:first-child) { border-top: 1px dashed transparent; }
.tag-branch > summary { list-style: none; cursor: pointer; position: relative; }
.tag-branch > summary::-webkit-details-marker { display: none; }
.tag-branch > summary .nav-row { width: calc(100% - 20px); }
.tw-chev { position: absolute; right: 8px; top: 9px; width: 7px; height: 7px; border-right: 1.4px solid var(--meta); border-bottom: 1.4px solid var(--meta); transform: rotate(-45deg); transition: transform .12s ease; }
.tag-branch[open] > summary .tw-chev { transform: rotate(45deg); }
.nav-row.on .tag-name { font-weight: 600; }
.tag-desc-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-left: var(--ui-gap-2xs); vertical-align: 2px; }
/* 习惯表单（OS-57）：描述性自定义表单——正向＋负向词条 */
/* ── 习惯页（OS-91 治理）──────────────────────────────────────────
   作者实测：「表格框线、字体和大小都不对」。原实现字号 12/12.5/13px 三档混写、
   内边距各自为政、与全局档位脱节。现在全部走 --ui-* 令牌：
     · 字号：--ui-fs-*（跟界面档位缩放）
     · 行高：--ui-lh-*
     · 控件内边距：--ui-ctl-px / --ui-row-py
     · 圆角/边框：--radius / --line（与全站一致）
   写新页面时照抄这一套，禁止裸写 px。 */
.habits-form { max-width: 760px; display: flex; flex-direction: column; gap: calc(14px * var(--ui-scale)); }
.habits-form .field { display: flex; flex-direction: column; gap: var(--ui-gap-2xs); }
.habits-form .field label {
  display: block; font-size: var(--ui-fs-sm); font-weight: 600;
  color: var(--ink-2); line-height: var(--ui-lh-normal); margin-bottom: var(--ui-gap-3xs);
}
.habits-form .field .count {
  font-weight: 400; color: var(--meta); font-size: var(--ui-fs-xs);
  margin-left: var(--ui-gap-xs); font-family: var(--mono);
}
.habits-form textarea.habit-list {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--ui-row-py) var(--ui-ctl-px);
  font-size: var(--ui-fs-md); line-height: var(--ui-lh-loose);
  background: var(--bg); color: var(--ink); resize: vertical;
  font-family: var(--sans); min-height: calc(76px * var(--ui-scale));
  transition: border-color .12s ease;
}
.habits-form textarea.habit-list:focus { outline: none; border-color: var(--accent); }
.habits-form input.text, .habits-form select.select {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--ui-row-py) var(--ui-ctl-px);
  font-size: var(--ui-fs-md); line-height: var(--ui-lh-normal);
  background: var(--bg); color: var(--ink); font-family: var(--sans);
  height: var(--ui-ctl-h); box-sizing: border-box;
  transition: border-color .12s ease;
}
.habits-form input.text:focus, .habits-form select.select:focus { outline: none; border-color: var(--accent); }
.habits-form .ops {
  display: flex; align-items: center; gap: calc(10px * var(--ui-scale));
  padding-top: calc(8px * var(--ui-scale)); border-top: 1px dashed var(--hair);
}
.habits-form .ops .count { font-size: var(--ui-fs-xs); color: var(--meta); }
/* 笔记视图未选中态（OS-53b）：给出路而不是一句提示 */
.ref-empty-lead { display: flex; flex-direction: column; align-items: flex-start; gap: var(--ui-gap-md); padding: calc(40px * var(--ui-scale)) var(--ui-gap-xl); }
.ref-empty-lead .rem { margin: 0; font-size: var(--ui-fs-md); color: var(--muted); }
/* 图谱视图（OS-51）：大画布＋节点信息卡＋标签筛选行 */
.ref-graph { display: flex; flex-direction: column; gap: var(--ui-gap-sm); }
.ref-graph-meta { font-size: var(--ui-fs-sm); color: var(--meta); }
.ref-graph-tagbar { display: flex; flex-wrap: wrap; gap: var(--ui-gap-2xs); }
.graph-box.big { height: calc(100vh - 360px); min-height: 380px; border-radius: var(--radius-md); }
/* 节点信息卡：画布右上角浮层——类型/标签/简介＋「打开详情」（OS-51 作者口径） */
.ref-node-card { position: absolute; top: 10px; right: 10px; width: 244px; background: var(--bg); border-radius: var(--radius-md); box-shadow: 0 10px 28px -10px rgba(var(--shadow-base, 28,27,26), .3), 0 2px 6px rgba(var(--shadow-base, 28,27,26), .1); padding: var(--ui-gap-md); z-index: 5; display: flex; flex-direction: column; gap: var(--ui-gap-sm); }
.ref-node-card .rn-head { display: flex; align-items: center; gap: var(--ui-gap-xs); min-width: 0; }
.ref-node-card .rn-head b { font-size: var(--ui-fs-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rn-kind { font-size: var(--ui-fs-2xs); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm); background: var(--soft); color: var(--muted); flex: 0 0 auto; }
.rn-kind.reference { background: var(--accent-soft); color: var(--accent); }
.rn-kind.tag { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn-ink); }
.rn-kind.artifact { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.rn-tags { display: flex; flex-wrap: wrap; gap: var(--ui-gap-2xs); }
.rn-tags .pill { font-size: var(--ui-fs-2xs); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm); }
.rn-excerpt { margin: 0; font-size: var(--ui-fs-sm); color: var(--muted); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.rn-ops { display: flex; align-items: center; gap: var(--ui-gap-xs); }
.rn-ops .sp { flex: 1; }
.rn-deg { font-size: var(--ui-fs-xs); color: var(--meta); }
.ref-node-card .btn-ghost { font-size: var(--ui-fs-sm); }
/* 小图信息卡（正文页左栏，OS-52）：画布下方内嵌全宽，不做浮层 */
.ref-node-card.inline { position: static; width: 100%; box-shadow: none; background: transparent; padding: var(--ui-gap-sm) var(--ui-gap-3xs) var(--ui-gap-3xs); }
/* 详情页（OS-51，Wiki 式分层）：上半＝左简介＋右小图谱；下半＝详情；最下＝关联说明 */
.ref-detail { display: flex; flex-direction: column; gap: var(--ui-gap-lg); }
.ref-detail-head { display: flex; align-items: center; gap: var(--ui-gap-md); }
.ref-detail-head h2 { margin: 0; font-size: var(--ui-fs-xl); }
.ref-detail-head .sp { flex: 1; }
.ref-detail-path { font-size: var(--ui-fs-xs); color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-detail-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 46%); gap: var(--ui-gap-md); align-items: stretch; }
@media (max-width: 1100px) { .ref-detail-top { grid-template-columns: minmax(0, 1fr); } }
.ref-detail-brief { background: var(--bg); border-radius: var(--radius-md); padding: var(--ui-gap-lg) var(--ui-gap-lg); box-shadow: var(--shadow-card, 0 1px 2px rgba(28,27,26,.05)); display: flex; flex-direction: column; gap: var(--ui-gap-md); }
.brief-tags { display: flex; flex-wrap: wrap; gap: var(--ui-gap-xs); }
.brief-tags .pill { font-size: var(--ui-fs-xs); }
.brief-text { margin: 0; font-size: var(--ui-fs-md); line-height: 1.8; color: var(--ink-2); }
.ref-detail-graph { background: var(--bg); border-radius: var(--radius-md); padding: var(--ui-gap-md) var(--ui-gap-lg); box-shadow: var(--shadow-card, 0 1px 2px rgba(28,27,26,.05)); display: flex; flex-direction: column; gap: var(--ui-gap-sm); }
.rd-graph-head { font-size: var(--ui-fs-sm); font-weight: 600; color: var(--ink-2); display: flex; gap: var(--ui-gap-sm); align-items: baseline; }
.rd-graph-head span { font-weight: 400; font-size: var(--ui-fs-xs); color: var(--meta); }
.graph-box.detail { height: 240px; flex: 1; min-height: 200px; }
.ref-detail-backlinks { border-top: 1px solid var(--hair); padding-top: var(--ui-gap-md); }
.ref-detail-backlinks h4 { margin: 0 0 8px; font-size: var(--ui-fs-md); }
.ref-detail-backlinks .bl-row { max-width: 720px; }
/* 世界书笔记实时编辑区（OS-53）：与正文同款逐块 contenteditable， serif 排版随正文偏好 */
.ref-doc { max-width: 860px; }
.ref-prose { font-family: var(--serif); font-size: var(--doc-font-size, 16px); line-height: var(--doc-line-height, 1.9); color: var(--ink-2); }
.ref-prose p { margin: 0 0 var(--doc-para-gap, 1em); text-indent: var(--doc-indent, 0); }
.ref-prose h2, .ref-prose h3 { text-indent: 0; }
.ref-prose ul, .ref-prose ol { margin: 0 0 var(--doc-para-gap, 1em); padding-left: 1.6em; }
.ref-prose blockquote { margin: 0 0 var(--doc-para-gap, 1em); padding-left: 14px; border-left: 2px solid var(--line); color: var(--muted); }
.ref-prose table { border-collapse: collapse; font-size: .92em; margin: 0 0 var(--doc-para-gap, 1em); }
.ref-prose th, .ref-prose td { border: 1px solid var(--hair); padding: var(--ui-gap-2xs) var(--ui-gap-md); text-align: left; }
.ref-prose th { background: var(--soft); }
.ref-line { position: relative; display: block; }
.ref-line .doc-block { margin-bottom: var(--doc-para-gap, 1em); }
.ref-line:last-child .doc-block { margin-bottom: 0; }
/* 迁入旧目录弹层（动稿需显式确认） */
.absorb-list { display: flex; flex-direction: column; gap: var(--ui-gap-xs); margin: var(--ui-gap-2xs) 0 8px; }
.absorb-row { display: flex; align-items: center; gap: var(--ui-gap-sm); font-size: var(--ui-fs-md); padding: var(--ui-gap-xs) var(--ui-gap-2xs); cursor: pointer; }
.absorb-row .hint { font-family: var(--mono); font-size: var(--ui-fs-xs); color: var(--meta); }
.ref-main { border: 0; border-radius: var(--radius-md); background: var(--soft); padding: var(--ui-gap-lg) var(--ui-gap-xl); min-height: 300px; }
.ref-main h2 { margin: 0 0 10px; font-size: var(--ui-fs-xl); }
.ref-main .rf-meta { display: flex; flex-wrap: wrap; gap: var(--ui-gap-sm); margin-bottom: var(--ui-gap-md); font-size: var(--ui-fs-xs); color: var(--meta); }
/* 类纸卡片上的内嵌件：围栏代码/表格改白底去外框，行分隔线保留 */
.ref-main .prose-block pre { background: var(--bg); border: 0; }
.ref-main .prose-block .md-table-wrap { border: 0; background: transparent; }
.ref-main .prose-block .md-table th + th, .ref-main .prose-block .md-table td + td { border-left: 0; }
.bl-sec h5 { margin: 0 0 6px; font-size: var(--ui-fs-xs); color: var(--muted); display: flex; align-items: center; gap: var(--ui-gap-xs); }
.bl-row { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); width: 100%; padding: var(--ui-gap-2xs) var(--ui-gap-xs); border-radius: var(--radius); text-align: left; }
.bl-row:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.bl-row b { font-size: var(--ui-fs-sm); color: var(--ink-2); }
.bl-row span { font-size: var(--ui-fs-2xs); color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-sec.unlinked { margin-top: var(--ui-gap-md); }
/* 双链样式（正文与世界书共用） */
.wl { color: var(--accent); text-decoration: none; border-bottom: 1px dashed color-mix(in srgb, var(--accent) 50%, transparent); cursor: pointer; }
.wl:hover { border-bottom-style: solid; }
.wl.embed { border-bottom-style: dotted; }
.agent-head { padding: var(--ui-gap-md) var(--ui-gap-lg) var(--ui-gap-sm); display: flex; align-items: center; gap: var(--ui-gap-sm); }
.agent-avatar { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: var(--ui-fs-xs); font-weight: 800; }
.agent-name { font-weight: 700; }
.agent-model { font-size: var(--ui-fs-xs); color: var(--meta); border: 1px solid var(--line); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-model.on { color: var(--ok); border-color: var(--ok); }
.agent-model[hidden] { display: none; }
.agent-head .sp, .agent-head-sp { flex: 1; }
/* 会话下拉（OS-31）：标题栏只留一个计数按钮，全量列表收在面板里 */
.agent-sess-dd { position: relative; flex: 0 0 auto; }
.agent-sess-btn { display: inline-flex; align-items: center; gap: var(--ui-gap-2xs); height: 24px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--pill); color: var(--muted); font-size: var(--ui-fs-xs); font-variant-numeric: tabular-nums; }
.agent-sess-btn:hover { border-color: var(--ink); color: var(--ink); }
.agent-sess-btn.on { border-color: var(--ink); color: var(--ink); }
.agent-sess-btn svg { flex: 0 0 13px; }
#agent-knowledge-chain:empty { display: none; }
.knowledge-chain { display: inline-flex; align-items: center; gap: var(--ui-gap-2xs); flex-wrap: wrap; margin: var(--ui-gap-xs) var(--ui-gap-lg) 0; padding: var(--ui-gap-2xs) var(--ui-gap-md); border: 1px solid var(--hair); border-radius: 999px; background: var(--soft); font-size: var(--ui-fs-xs); color: var(--ink-2); cursor: pointer; text-align: left; }
.knowledge-chain:hover { border-color: var(--line); background: var(--accent-soft); }
.knowledge-chain.flash { animation: knowledgeflash 1.5s ease-out; }
@keyframes knowledgeflash { 0% { background: var(--accent-soft); border-color: var(--accent); } 100% { background: var(--soft); border-color: var(--hair); } }
.knowledge-chip { font-weight: 600; color: var(--ink-2); }
.knowledge-chip.style { color: var(--accent); }
.knowledge-sep { font-style: normal; color: var(--meta); }
.agent-sess-panel { position: absolute; right: 0; top: calc(100% + 6px); width: 274px; max-height: 60vh; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: var(--ui-gap-xs); display: none; z-index: 85; }
.agent-sess-panel.open { display: block; }
.agent-sess-panel .sess { display: flex; align-items: center; gap: var(--ui-gap-sm); width: 100%; padding: var(--ui-gap-xs) var(--ui-gap-sm); border-radius: var(--radius); text-align: left; color: var(--muted); font-size: var(--ui-fs-sm); }
.agent-sess-panel .sess:hover { background: var(--soft); }
.agent-sess-panel .sess.on { background: var(--accent-soft); color: var(--ink); }
.agent-sess-panel .sess .tt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-sess-panel .sess .meta { font-size: var(--ui-fs-2xs); color: var(--meta); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.agent-sess-panel .sess .x { flex: 0 0 auto; color: var(--meta); font-size: var(--ui-fs-md); padding: 0 2px; border-radius: 4px; }
.agent-sess-panel .sess .x:hover { color: var(--danger); background: var(--soft); }
/* 临时会话标记（OS-39）：润笔/分析这类一次性需求固定走标了「临时」的那条 */
.agent-sess-panel .sess-hint { padding: var(--ui-gap-2xs) var(--ui-gap-sm) var(--ui-gap-sm); font-size: var(--ui-fs-xs); color: var(--meta); line-height: 1.6; }
.agent-sess-panel .sess-mode { display: flex; align-items: center; gap: var(--ui-gap-2xs); padding: var(--ui-gap-3xs) var(--ui-gap-sm) var(--ui-gap-sm); flex-wrap: wrap; }
.agent-sess-panel .sess-mode .sm-label { font-size: var(--ui-fs-xs); color: var(--meta); flex: 0 0 auto; }
.agent-sess-panel .sess-mode .mode-opt { font-size: var(--ui-fs-2xs); border: 1px solid var(--line); border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-sm); color: var(--muted); }
.agent-sess-panel .sess-mode .mode-opt:hover { border-color: var(--ink); color: var(--ink); }
.agent-sess-panel .sess-mode .mode-opt.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.agent-sess-panel .sess .pin { flex: 0 0 auto; font-size: var(--ui-fs-2xs); color: var(--meta); border: 1px solid var(--line); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-xs); }
.agent-sess-panel .sess .pin:hover { border-color: var(--ink); color: var(--ink); }
.agent-sess-panel .sess .pin.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.agent-sess-panel .divider { border-top: 1px solid var(--hair); margin: var(--ui-gap-xs) var(--ui-gap-2xs); }

   原实现三个控件各写各的（9.5/11.5/12px 三档字号、宽度 52/58 两种、只有 fc-input 有内边距），
   且 align-items:baseline 让 number input 与文字基线错位（作者实测截图）。
   现在统一走控件令牌 + 居中对齐 + 数字框固定宽度。 */
/* 故事源词条分组（OS-103） */
.nav-sub { font-size: 10.5px; font-weight: 600; color: var(--ink-2); padding: 6px 8px 3px;
  border-bottom: 1px dashed var(--hair); margin-bottom: 2px; }
.nav-row.entry .tag-name { font-size: 12px; }
.ref-detail-head { flex-wrap: wrap; row-gap: 6px; }
.ref-detail-head .ref-title { flex: 0 0 auto; white-space: nowrap; }
.ref-detail-head .fc-badge { flex: 0 0 auto; }
.fc-badge {
  flex-shrink: 0; display: inline-flex; align-items: center;
  height: calc(var(--ui-ctl-h) * 0.62);
  padding: 0 var(--ui-gap-xs);
  font-size: var(--ui-fs-2xs); line-height: 1;
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: var(--pill); white-space: nowrap;
}
.fc-badge.fc-base { color: var(--meta); border-color: var(--hair); }

/* 工具栏筛选：文字与输入框居中对齐，不再 baseline 错位 */
.fc-filter {
  display: inline-flex; align-items: center; gap: var(--ui-gap-xs);
  font-size: var(--ui-fs-sm); color: var(--ink-2); white-space: nowrap;
}
.fc-filter input,
.fc-input {
  box-sizing: border-box;
  width: calc(52px * var(--ui-scale));
  height: calc(var(--ui-ctl-h) * 0.8);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 0 var(--ui-gap-xs);
  font-family: var(--sans);
  font-size: var(--ui-fs-sm);
  font-variant-numeric: tabular-nums;
  text-align: center;
  color: var(--ink);
  background: var(--bg);
  outline: none;
  transition: border-color .12s ease;
}
.fc-filter input:focus,
.fc-input:focus { border-color: var(--accent); }
/* 去掉 number 输入框的原生上下箭头——58px 宽里它挤掉数字（作者截图里两个灰块就是它） */
.fc-filter input::-webkit-outer-spin-button,
.fc-filter input::-webkit-inner-spin-button,
.fc-input::-webkit-outer-spin-button,
.fc-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.fc-filter input,
.fc-input { -moz-appearance: textfield; appearance: textfield; }

.fc-edit {
  display: inline-flex; align-items: center; gap: var(--ui-gap-2xs);
  font-size: var(--ui-fs-xs); color: var(--meta); white-space: nowrap;
}

/* 弹层（Agent 设置 / 待确认卡） */
.overlay { position: fixed; inset: 0; background: rgba(20,18,16,.42); display: none; place-items: center; z-index: 90; }
.overlay.open { display: grid; }
.modal { width: min(520px, calc(100vw - 40px)); max-height: 84vh; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: var(--ui-gap-xl) calc(22px * var(--ui-scale)); }
.modal h3 { margin: 0 0 4px; font-size: var(--ui-fs-lg); }
.modal .sub { color: var(--muted); font-size: var(--ui-fs-sm); margin: 0 0 14px; line-height: 1.6; }
.modal .field { display: flex; flex-direction: column; gap: var(--ui-gap-2xs); margin-bottom: var(--ui-gap-md); }
.modal .field label { font-size: var(--ui-fs-sm); color: var(--muted); }
.modal .field input, .modal .field textarea { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); outline: none; background: var(--bg); font: inherit; }
.modal .field textarea { font-family: var(--serif); min-height: 160px; resize: vertical; line-height: 1.8; }
.modal .field input:focus, .modal .field textarea:focus { border-color: var(--ink); }
.modal .field .hint { font-size: var(--ui-fs-xs); color: var(--meta); overflow-wrap: anywhere; }
.modal .ops { display: flex; gap: var(--ui-gap-md); justify-content: flex-end; margin-top: var(--ui-gap-xs); }
.modal .err { color: var(--danger); font-size: var(--ui-fs-sm); margin: var(--ui-gap-2xs) 0 8px; }
/* 「本章」面板（OS-30）：章操作一行＋显示偏好分节 */
.modal .chapter-ops { display: flex; gap: var(--ui-gap-sm); flex-wrap: wrap; margin-bottom: var(--ui-gap-2xs); }
.modal .modal-sec { border-top: 1px solid var(--hair); margin-top: var(--ui-gap-lg); padding-top: var(--ui-gap-lg); }
.modal .modal-sec h4 { margin: 0 0 6px; font-size: var(--ui-fs-md); }
.modal .modal-sec .sub { margin: 0 0 12px; }
.modal .field input[type="range"] { border: 0; padding: 0; accent-color: var(--accent); background: none; }

/* 中栏 */
.center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
/* OS-102：页签栏的横向条挤在 44px 里，与全站其他滚动条观感不一致——
   改为隐藏滚动条但保留滚动能力（滚轮/触控板/拖拽仍可） */
.tabs {
  height: 44px; flex: 0 0 44px; display: flex; align-items: flex-end;
  gap: var(--ui-gap-3xs); padding: 0 10px;
  border-bottom: 1px solid var(--hair);
  overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap;
  scrollbar-width: none; -ms-overflow-style: none;
}
.tabs::-webkit-scrollbar { height: 0; width: 0; }
.tabs .tab { padding: var(--ui-gap-md) var(--ui-gap-lg) var(--ui-gap-sm); border-radius: var(--radius) var(--radius) 0 0; color: var(--muted); white-space: nowrap; display: flex; gap: var(--ui-gap-xs); align-items: center; }
.tabs .tab .ic { width: 16px; height: 16px; border-radius: 4px; background: var(--soft); display: inline-grid; place-items: center; font-size: var(--ui-fs-2xs); }
.tabs .tab.on { color: var(--ink); border: 1px solid var(--hair); border-bottom-color: var(--bg); background: var(--bg); margin-bottom: -1px; }
/* OS-203：降级显形——所有降级位置共用一套灰显语义（颜色/字号/间距全走令牌）。 */
.tabs .tab.tab-degraded { opacity: .55; color: var(--warn-ink); cursor: not-allowed; }
.tabs .tab.tab-degraded .ic { background: var(--warm); }
[data-degraded="1"] { opacity: .58; color: var(--warn-ink); cursor: not-allowed; }
.cfg-note.is-degraded, .analyze-degraded { font-size: var(--ui-fs-sm); color: var(--warn-ink); line-height: 1.6; border: 1px solid var(--line); border-radius: var(--radius); background: var(--warm); padding: var(--ui-gap-sm) var(--ui-gap-md); }
.gov-degraded-view { max-width: 640px; margin: var(--ui-gap-xl) auto; padding: var(--ui-gap-lg); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-card); }
.gov-degraded-view h2 { font-size: var(--ui-fs-xl); margin: 0 0 var(--ui-gap-md); color: var(--ink); }
.gov-degraded-view p { font-size: var(--ui-fs-md); color: var(--muted); margin: var(--ui-gap-sm) 0; }
.gov-degraded-view .uikit-btn { margin-top: var(--ui-gap-md); }
.content { flex: 1; overflow-y: auto; padding: calc(26px * var(--ui-scale)) var(--content-px, 34px); }
.doc-head .kick { font-size: var(--ui-fs-sm); color: var(--meta); margin-bottom: var(--ui-gap-2xs); }
.doc-head h1 { font-family: var(--serif); font-size: var(--ui-fs-2xl); font-weight: 700; margin: 0 0 10px; line-height: 1.2; }
.doc-meta { display: flex; gap: var(--ui-gap-md); font-size: var(--ui-fs-sm); color: var(--muted); border-bottom: 1px solid var(--hair); padding-bottom: var(--ui-gap-lg); margin-bottom: var(--ui-gap-xl); flex-wrap: wrap; align-items: center; }
.doc-meta .b { border: 1px solid var(--line); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm); }
.prose { font-family: var(--serif); font-size: var(--ui-fs-lg); line-height: 1.9; max-width: 760px; color: var(--ink-2); }
.prose p { margin: 0 0 1.2em; }

/* 条目页（wiki） */
.e-side h4 { font-size: var(--ui-fs-sm); color: var(--meta); font-weight: 600; margin: var(--ui-gap-lg) 0 8px; }
.e-side .kv { display: flex; gap: var(--ui-gap-md); margin: var(--ui-gap-2xs) 0; }
.e-side .kv .k { width: 54px; color: var(--meta); flex: 0 0 54px; }
.e-side .kv .v { overflow-wrap: anywhere; }

/* ── 库首页 ─────────────────────────────────────────────── */
/* 原生选择器：输入框 + 浏览按钮（OS-108） */
.kv-path { text-align: left; background: transparent; border: 0; padding: 0; cursor: pointer;
  color: var(--ink-2); font: inherit; font-size: 12px; }
.kv-path:hover { color: var(--accent); text-decoration: underline; }
.kv-line { display: flex; align-items: baseline; gap: 6px; }
.kv-line .v { flex: 1; min-width: 0; overflow-wrap: anywhere; }
/* 角色泳道时间线（OS-111）：每角色一行，横轴＝章，圆点＝事件 */
.tl-wrap { display: flex; flex-direction: column; gap: 10px; }
.tl-stats { font-size: 11.5px; color: var(--meta); }
.tl-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--ink-2); }
.tl-lg { display: inline-flex; align-items: center; gap: 5px; }
.tl-lg i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tl-chart { position: relative; border: 1px solid var(--hair); border-radius: var(--radius-sm); padding: 8px 10px 10px; }
.tl-axis { display: grid; grid-template-columns: 96px repeat(auto-fit, minmax(20px, 1fr)); align-items: center;
  font-size: 10px; color: var(--meta); border-bottom: 1px dashed var(--hair); padding-bottom: 4px; margin-bottom: 6px; }
.tl-axis-label { font-weight: 600; color: var(--ink-2); }
.tl-tick { text-align: center; font-variant-numeric: tabular-nums; }
.tl-spans { position: relative; height: 20px; margin: 0 0 6px 96px; }
.tl-span { position: absolute; top: 2px; height: 16px; border-radius: 8px; line-height: 16px; padding: 0 6px;
  font-size: 9.5px; color: var(--on-accent); background: color-mix(in srgb, var(--accent) 65%, transparent);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tl-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; min-height: 26px; }
.tl-who { font-size: 12px; color: var(--ink); display: flex; align-items: baseline; gap: 5px; padding-right: 8px;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tl-who i { font-style: normal; font-size: 9.5px; color: var(--meta); border: 1px solid var(--hair);
  border-radius: var(--pill); padding: 0 5px; }
.tl-lane { position: relative; height: 22px; border-bottom: 1px solid color-mix(in srgb, var(--hair) 60%, transparent); }
.tl-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 11px; height: 11px; border-radius: 50%;
  border: 1.5px solid var(--bg); cursor: pointer; transition: transform .12s; }
.tl-dot:hover { transform: translate(-50%, -50%) scale(1.45); }
.tl-pick { font-size: 12px; color: var(--ink-2); background: var(--soft); border-radius: 6px; padding: 8px 11px; }
.tl-empty { padding: 18px 4px; }
.tl-empty .sub { font-size: 11.5px; color: var(--meta); }

/* 内建目录浏览器（OS-110 兜底，无桌面环境用） */
.fsb-path { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.fsb-cur { flex: 1; min-width: 0; font-size: 12px; color: var(--ink-2);
  background: var(--soft); padding: 5px 10px; border-radius: 6px; overflow-wrap: anywhere; }
.fsb-list { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
  border: 1px solid var(--hair); border-radius: var(--radius-sm); padding: 6px; }
.fsb-row { display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px 9px;
  border-radius: 6px; font-size: 13px; color: var(--ink); cursor: pointer; }
.fsb-row:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.fsb-ic { flex-shrink: 0; }
.fsb-name { overflow-wrap: anywhere; }
.fsb-hint { margin: 8px 4px; font-size: 12px; color: var(--meta); font-style: italic; }
.fsb-err { margin: 8px 4px; font-size: 12px; color: var(--danger); }
/* OS-119：默认目录 / 上次选择两个一步可回的入口 */
.fsb-jumps { display: flex; gap: 6px; flex-wrap: wrap; margin: -2px 0 6px; }
.fsb-jump { padding: 3px 9px; font-size: 11.5px; border-radius: 999px;
  border: 1px solid var(--hair); background: transparent; color: var(--ink-2); cursor: pointer; }
.fsb-jump:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--hair));
  color: var(--ink); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.fsb-tag { margin-left: 6px; padding: 1px 6px; font-size: 10.5px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink-2); }

.input-with-btn { display: flex; gap: 8px; align-items: center; }
.input-with-btn input { flex: 1; min-width: 0; }
.input-with-btn .btn-ghost { flex-shrink: 0; white-space: nowrap; }

.lib-wrap { max-width: var(--content-max, 1180px); margin: 0 auto; padding: calc(34px * var(--ui-scale)) var(--content-px, 40px); }
.lib-wrap h1 { font-size: var(--ui-fs-2xl); font-weight: 800; margin: 0 0 6px; }
.lib-wrap .sub { color: var(--muted); margin: 0 0 24px; }
/* 页面级头（OS-32）：标题＋右上角「!」说明＋关闭 */
.page-head { display: flex; align-items: center; gap: var(--ui-gap-sm); margin-bottom: var(--ui-gap-xl); }
.page-head h1 { margin: 0; }
.page-head .sp { flex: 1; }
.help-btn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: var(--ui-fs-md); font-weight: 700; display: grid; place-items: center; line-height: 1; }
.help-btn:hover { border-color: var(--ink); color: var(--ink); }
.help-btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.page-close { font-size: var(--ui-fs-xl); line-height: 1; }
.help-bubble { border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: var(--radius); background: var(--soft); padding: var(--ui-gap-md) var(--ui-gap-lg); margin: 0 0 18px; font-size: var(--ui-fs-md); line-height: 1.85; color: var(--ink-2); }
.tab-x { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: var(--ui-gap-3xs); border-radius: 50%; color: var(--meta); font-size: var(--ui-fs-md); line-height: 1; opacity: 0; transition: opacity .12s ease; }
.tabs .tab:hover .tab-x, .tabs .tab.on .tab-x { opacity: 1; }
.tab-x:hover { background: var(--soft); color: var(--danger); }
/* 段操作（OS-37）：左键选中整段 / 右键出浮窗 */
.doc-block.para-on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 4px; }
.para-menu { position: fixed; z-index: 130; display: none; flex-direction: column; min-width: 148px; padding: var(--ui-gap-2xs); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow); }
.para-menu.on { display: flex; }
.para-menu button { text-align: left; padding: var(--ui-gap-xs) var(--ui-gap-md); border-radius: var(--radius); font-size: var(--ui-fs-sm); color: var(--ink-2); }
.para-menu button:hover { background: var(--accent-soft); color: var(--accent); }
/* 单段分析结果浮窗 */
.para-result { position: fixed; right: 18px; bottom: 18px; z-index: 110; width: 340px; max-height: 62vh; overflow-y: auto; display: none; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow); }
.para-result.on { display: flex; }
.pr-head { display: flex; align-items: center; gap: var(--ui-gap-sm); padding: var(--ui-gap-sm) var(--ui-gap-md); border-bottom: 1px solid var(--hair); position: sticky; top: 0; background: var(--bg); }
.pr-head b { font-size: var(--ui-fs-md); }
.pr-head .sp { flex: 1; }
.pr-x { color: var(--meta); font-size: var(--ui-fs-base); line-height: 1; padding: 0 2px; }
.pr-x:hover { color: var(--danger); }
.pr-body { padding: var(--ui-gap-md) var(--ui-gap-md) var(--ui-gap-lg); display: flex; flex-direction: column; gap: var(--ui-gap-md); }
.pr-sec h5 { margin: 0 0 6px; font-size: var(--ui-fs-sm); color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: var(--ui-gap-xs); }
.pr-body .spark { height: 38px; }
.tabs .tab { flex: 0 0 auto; }
.tabs .tab-add { color: var(--meta); font-size: var(--ui-fs-base); padding: var(--ui-gap-sm) var(--ui-gap-md); flex: 0 0 auto; }
.tabs .tab-add:hover { color: var(--ink); }
.tab-pick-sec { margin-bottom: var(--ui-gap-lg); }
.tab-pick-sec h4 { margin: 0 0 8px; font-size: var(--ui-fs-sm); color: var(--muted); font-weight: 600; }
.tab-pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--ui-gap-xs); }
.tab-pick { display: flex; align-items: center; gap: var(--ui-gap-xs); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-xs) var(--ui-gap-sm); font-size: var(--ui-fs-sm); color: var(--muted); text-align: left; background: var(--bg); }
.tab-pick:hover { border-color: var(--ink); }
.tab-pick.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.tab-pick .tp-check { width: 12px; flex: 0 0 12px; color: var(--accent); font-size: var(--ui-fs-xs); }
.tab-pick b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-pick .tp-note { margin-left: auto; font-size: var(--ui-fs-2xs); color: var(--meta); white-space: nowrap; flex: 0 0 auto; }
/* OS-84：已退场旧目录（还压着旧稿）——降级标记，提示该迁去世界书/习惯 */
.tab-pick .tp-note.is-retired { color: var(--warn-ink); }
.filter { display: flex; gap: var(--ui-gap-xl); border-bottom: 1px solid var(--hair); margin: var(--ui-gap-xl) 0 6px; flex-wrap: wrap; }
.filter .f { padding: var(--ui-gap-md) var(--ui-gap-3xs); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.filter .f.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.filter .f .n { font-size: var(--ui-fs-xs); color: var(--meta); margin-left: var(--ui-gap-3xs); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--ui-gap-lg); margin-top: var(--ui-gap-lg); }
.card { border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--ui-gap-lg) var(--ui-gap-xl); text-align: left; background: var(--bg); display: flex; flex-direction: column; gap: var(--ui-gap-xs); position: relative; }
.card:hover { border-color: var(--ink); }
.card.on { border: 2px solid var(--ink); padding: calc(15px * var(--ui-scale)) calc(17px * var(--ui-scale)); }
.card .t { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: var(--ui-fs-lg); gap: var(--ui-gap-sm); }
.card .path { font-family: var(--mono); font-size: var(--ui-fs-sm); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .stat { font-size: var(--ui-fs-sm); color: var(--muted); }

/* ── 新增：空态 / 提示 / 条目列表 / 正文编辑 / wiki ────── */
.empty-state { max-width: 560px; margin: calc(56px * var(--ui-scale)) auto; text-align: center; color: var(--muted); line-height: 1.8; }
.empty-state h2 { font-size: var(--ui-fs-2xl); color: var(--ink); margin: 0 0 8px; }
.empty-state .hint { font-family: var(--mono); font-size: var(--ui-fs-sm); color: var(--meta); overflow-wrap: anywhere; margin-top: var(--ui-gap-md); }
.warn-box { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); color: var(--muted); font-size: var(--ui-fs-sm); margin: 0 0 14px; line-height: 1.7; }
.warn-box b { color: var(--ink-2); }
.error-box { border: 1px solid var(--danger); border-radius: var(--radius); padding: var(--ui-gap-md) var(--ui-gap-md); color: var(--danger); margin: 0 0 14px; font-size: var(--ui-fs-md); }
.loading { color: var(--muted); padding: calc(30px * var(--ui-scale)) 0; }
.toolbar { display: flex; gap: var(--ui-gap-md); align-items: center; flex-wrap: wrap; margin-bottom: var(--ui-gap-lg); }
.toolbar .sp { flex: 1; }
.search { border: 1px solid var(--line); border-radius: var(--pill); padding: var(--ui-gap-xs) var(--ui-gap-lg); background: var(--bg); outline: none; min-width: 220px; }
.search:focus { border-color: var(--ink); }
.chip { border: 1px solid var(--line); border-radius: var(--pill); padding: var(--ui-gap-2xs) var(--ui-gap-md); color: var(--muted); font-size: var(--ui-fs-sm); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:hover { border-color: var(--ink); }
.count { font-size: var(--ui-fs-sm); color: var(--meta); }
.pager { display: flex; gap: var(--ui-gap-md); align-items: center; margin-top: var(--ui-gap-lg); font-size: var(--ui-fs-sm); color: var(--muted); }
/* ── OS-93 兼容层：老按钮类 → 套件口径 ───────────────────────────
   183 处 HTML 引用不动，把老类重写成「与 .uikit-btn 同源的令牌组合」。
   这样作者已有的页面立即获得统一的字号/内边距/圆角/交互，且日后
   新代码写 .uikit-btn 或 .btn-primary 得到的是同一套视觉。
   —— 三方开发者请优先用 .uikit-btn；老类保留为别名，不再新增变体。 */
.btn-primary, .btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--ui-gap-xs);
  height: var(--ui-ctl-h); padding: 0 calc(16px * var(--ui-scale));
  border: 1px solid transparent; border-radius: var(--pill);
  font-family: var(--sans); font-size: var(--ui-fs-base); font-weight: 600;
  line-height: 1; cursor: pointer; white-space: nowrap;
  transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-primary:disabled { opacity: .5; cursor: default; }
.btn-primary:disabled:hover { background: var(--accent); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-2); font-weight: 400; }
.btn-ghost:hover { border-color: var(--ink-2); background: var(--soft); }
.btn-ghost:disabled { opacity: .5; cursor: default; }
/* 表单控件：与 .uikit-input / .uikit-select 同口径 */
.select, .file-input, .text {
  height: var(--ui-ctl-h); box-sizing: border-box;
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0 var(--ui-ctl-px); background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: var(--ui-fs-md); outline: none;
  transition: border-color .12s ease;
}
.select { max-width: 420px; }
.file-input { font-family: var(--mono); font-size: var(--ui-fs-sm); min-width: 260px; }
.select:focus, .file-input:focus, .text:focus { border-color: var(--accent); }
.editor { width: 100%; min-height: 58vh; border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--ui-gap-xl) var(--ui-gap-2xl); background: var(--bg); font-family: var(--serif); font-size: var(--ui-fs-lg); line-height: 1.9; resize: vertical; outline: none; color: var(--ink-2); }
.editor:focus { border-color: var(--ink); }
.saved-chip { font-size: var(--ui-fs-sm); color: var(--ok); border: 1px solid var(--ok); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-md); }

/* ── 库管理写操作（OS-7：新建/导入/修复整页流）──────────── */
.lib-head-row { display: flex; align-items: center; gap: var(--ui-gap-md); margin-bottom: var(--ui-gap-lg); flex-wrap: wrap; }
.lib-head-row .sp { flex: 1; }
.lib-head-row h1 { margin: 0; }
.step { border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--ui-gap-lg) var(--ui-gap-xl); margin-bottom: var(--ui-gap-lg); background: var(--bg); }
.step h3 {
  margin: 0 0 var(--ui-gap-md); font-size: var(--ui-fs-base);
  display: flex; align-items: baseline; gap: var(--ui-gap-sm); flex-wrap: wrap;
  font-weight: 600; color: var(--ink);
}
/* OS-98：.sub 之前完全没定义——设置页所有「标题＋副说明」都挤成一坨（作者实测） */
.step h3 .sub,
.step h3 > span.sub {
  font-size: var(--ui-fs-xs); font-weight: 400; color: var(--meta);
  line-height: var(--ui-lh-normal);
  white-space: normal; overflow-wrap: anywhere;
  flex: 1 1 auto; min-width: 0;
}
.step h3 .no { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: var(--ui-fs-xs); flex: 0 0 20px; }
.step .row { display: flex; gap: var(--ui-gap-md); flex-wrap: wrap; align-items: center; margin-top: var(--ui-gap-md); }
.step .field { display: flex; flex-direction: column; gap: var(--ui-gap-2xs); }
.step .field label { font-size: var(--ui-fs-sm); color: var(--muted); }
/* OS-100：label 默认 block，但开关型 label 必须是 flex（否则勾选框与文字竖排——
   作者截图里的「用中文推理（推荐）」竖着一列就是这么来的） */
.step .field label.cfg-switch,
.field label.cfg-switch {
  display: flex !important; align-items: center;
  gap: var(--ui-gap-sm); font-size: var(--ui-fs-sm);
  color: var(--ink-2); cursor: pointer; font-weight: 400;
}
/* OS-100：.field input 的 width:100% 会把 checkbox 撑满整行（实测 662px）——
   勾选框必须钉死尺寸，否则「红方块悬空」就是因为它在 662px 里居中显示 */
.step .field label.cfg-switch input[type="checkbox"],
.field label.cfg-switch input[type="checkbox"],
.step .field label.cfg-switch input[type="radio"],
.field label.cfg-switch input[type="radio"] {
  width: calc(15px * var(--ui-scale)) !important;
  min-width: calc(15px * var(--ui-scale)) !important;
  max-width: calc(15px * var(--ui-scale)) !important;
  height: calc(15px * var(--ui-scale)) !important;
  margin: 0 !important;
  flex: 0 0 auto !important;
}
/* 表单里的 checkbox/radio 一律不参与 width:100% —— 全局兜底 */
input[type="checkbox"], input[type="radio"] {
  width: auto; min-width: 0;
}
.step input { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); outline: none; background: var(--bg); min-width: 300px; }
.step input:focus { border-color: var(--ink); }
.path-preview { font-family: var(--mono); font-size: var(--ui-fs-sm); color: var(--meta); overflow-wrap: anywhere; margin-top: var(--ui-gap-sm); }
.big-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--ui-gap-md); }
.big-opt { display: flex; flex-direction: column; gap: var(--ui-gap-2xs); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--ui-gap-lg) var(--ui-gap-lg); text-align: left; background: var(--bg); }
.big-opt:hover { border-color: var(--ink); }
/* OS-98：选中态原来是 2px 实心黑框，看着像失控的焦点环（作者实测），
   改为主色 1px + 主色浅底 + 内描边，与 .uikit-btn 的选中语义一致。 */
.big-opt.on {
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.big-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.big-opt b { font-size: var(--ui-fs-base); }
.big-opt b .src { font-size: var(--ui-fs-2xs); color: var(--meta); border: 1px solid var(--line); border-radius: var(--pill); padding: 0 6px; margin-left: var(--ui-gap-xs); vertical-align: 1px; font-weight: 400; }
.big-opt span { font-size: var(--ui-fs-sm); color: var(--muted); line-height: 1.6; }
/* 一行摘要（OS-32）：插件自带的长描述截断，全文走 title 悬停 */
.one-line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread-notice { font-size: var(--ui-fs-xs); color: var(--meta); padding: var(--ui-gap-3xs) var(--ui-gap-2xs); }
.plan-group { border-top: 1px dashed var(--hair); padding: var(--ui-gap-md) 0 2px; }
.plan-group h4 { margin: 0 0 6px; font-size: var(--ui-fs-md); }
.plan-group .cnt { color: var(--meta); font-size: var(--ui-fs-sm); margin-left: var(--ui-gap-xs); font-weight: 400; }
.plan-files { max-height: 170px; overflow-y: auto; font-family: var(--mono); font-size: var(--ui-fs-sm); color: var(--muted); line-height: 1.8; }
.result-kv { display: flex; gap: calc(22px * var(--ui-scale)); flex-wrap: wrap; margin: var(--ui-gap-sm) 0; align-items: baseline; }
.result-kv b { font-size: var(--ui-fs-xl); }
.result-kv .bad { color: var(--danger); }
.repair-card { max-width: 640px; margin: calc(56px * var(--ui-scale)) auto; border: 1px solid var(--danger); border-radius: var(--radius-lg); padding: calc(22px * var(--ui-scale)) var(--ui-gap-2xl); }
.repair-card h2 { margin: 0 0 6px; font-size: var(--ui-fs-xl); }
.repair-card .detail { color: var(--muted); line-height: 1.8; margin: 0 0 4px; }
.repair-card .path { font-family: var(--mono); font-size: var(--ui-fs-sm); color: var(--meta); overflow-wrap: anywhere; margin: 0 0 14px; }
.repair-actions { display: flex; gap: var(--ui-gap-md); flex-wrap: wrap; margin-top: var(--ui-gap-lg); align-items: center; }
.raw-detail { font-family: var(--mono); font-size: var(--ui-fs-xs); color: var(--meta); margin-top: var(--ui-gap-md); overflow-wrap: anywhere; line-height: 1.7; }

/* ── 业务页扩展（OS-8：动态页签＋目录工作面＋推演页）────── */
.tabs .tab .pill { font-size: var(--ui-fs-2xs); color: var(--meta); border: 1px solid var(--line); border-radius: var(--pill); padding: 0 6px; margin-left: var(--ui-gap-3xs); }
.deduce-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--ui-gap-lg); max-width: 1200px; }
@media (max-width: 1100px) { .deduce-grid { grid-template-columns: minmax(0, 1fr); } }
.deduce-input { width: 100%; min-height: 88px; border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-md) var(--ui-gap-md); outline: none; background: var(--bg); font: inherit; resize: vertical; margin-bottom: var(--ui-gap-md); }
.deduce-input:focus { border-color: var(--ink); }
#deduce-question { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); outline: none; background: var(--bg); }
#deduce-question:focus { border-color: var(--ink); }
.deduce-reply { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--serif); line-height: 1.9; max-height: 460px; overflow-y: auto; color: var(--ink-2); }

/* ── 正文工作面（OS-23：纸面与标题同基准顶满）────────────────────
   OS-48：旧的章节悬浮抽屉已删除——章节列表统一在左栏「章节」卡片里，
   避免和新左栏功能重合（两套章节列表同时显示是 bug）。 */
.chapter-grid { position: relative; display: block; max-width: none; }
/* 章节卡片内的新建行＋行表（类纸无框） */
.chapter-new { display: flex; gap: var(--ui-gap-xs); padding: 0 0 8px; }
.chapter-new input { flex: 1; min-width: 0; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; padding: var(--ui-gap-2xs) var(--ui-gap-2xs); outline: none; background: transparent; font-size: var(--ui-fs-sm); }
.chapter-new input:focus { border-bottom-color: var(--ink); }
.chapter-rows { max-height: 220px; overflow-y: auto; }
.chapter-editor-col { min-width: 0; }

/* ── 设置页＋产物（OS-11）────────────────────────────── */
.kv-line {
  display: grid; grid-template-columns: 170px minmax(0, 1fr);
  gap: var(--ui-gap-md); padding: var(--ui-row-py) 0;
  border-bottom: 1px dashed var(--hair);
  font-size: var(--ui-fs-md); align-items: baseline;
}
.kv-line .k { color: var(--muted); }
.kv-line .v { font-family: var(--mono); font-size: var(--ui-fs-sm); color: var(--ink-2); overflow-wrap: anywhere; }
.artifacts-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--ui-gap-lg); max-width: 1280px; align-items: start; }
@media (max-width: 1100px) { .artifacts-grid { grid-template-columns: minmax(0, 1fr); } }
.artifact-group h3 { display: flex; align-items: center; gap: var(--ui-gap-sm); }
.artifact-group .cnt { color: var(--meta); font-size: var(--ui-fs-sm); font-weight: 400; }
.artifact-rows { border-top: 1px solid var(--hair); max-height: 300px; overflow-y: auto; }
.artifact-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--ui-gap-md); width: 100%; padding: var(--ui-gap-xs) var(--ui-gap-sm); border-bottom: 1px solid var(--hair); text-align: left; align-items: baseline; }
.artifact-row:hover { background: var(--soft); }
.artifact-row.on { background: var(--accent-soft); }
.artifact-row .nm { font-family: var(--mono); font-size: var(--ui-fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.artifact-row .sz { font-size: var(--ui-fs-xs); color: var(--meta); }
.artifact-row .tm { font-size: var(--ui-fs-xs); color: var(--meta); }
.artifact-row .tag { font-size: var(--ui-fs-2xs); border: 1px solid var(--line); border-radius: var(--pill); padding: 0 6px; color: var(--meta); }
.artifact-row.hist .nm { color: var(--muted); }
.artifact-preview h3 .src { font-size: var(--ui-fs-2xs); color: var(--accent); border: 1px solid var(--accent); border-radius: var(--pill); padding: 0 6px; margin-left: var(--ui-gap-xs); vertical-align: 2px; }
.artifact-preview .editor { min-height: 260px; max-height: 420px; font-size: var(--ui-fs-base); }

/* ── 设置页分节制（OS-14：左导航＋节内容，架子给后续功能规则留位）── */
/* OS-91：技能全文弹层 + 行内查看按钮 */
.skill-peek {
  flex: 0 0 auto; margin-left: auto; padding: 0 8px; border: 0; background: transparent;
  color: var(--meta); font-size: var(--ui-fs-base); cursor: pointer; border-radius: var(--pill);
  line-height: 1; align-self: center;
}
.skill-peek:hover { background: var(--soft); color: var(--ink-2); }
.skill-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ui-gap-sm); margin: var(--ui-gap-xs) 0 10px; }
.skill-md { max-height: min(56vh, 480px); overflow-y: auto; padding: var(--ui-gap-md) var(--ui-gap-md);
  background: var(--soft); border-radius: var(--radius); font-size: var(--ui-fs-md);
  line-height: var(--ui-lh-loose); color: var(--ink-2); }
.skill-md h1, .skill-md h2, .skill-md h3, .skill-md h4 { font-size: var(--ui-fs-lg); margin: var(--ui-gap-md) 0 6px; color: var(--ink); }
.skill-md h1:first-child, .skill-md h2:first-child { margin-top: 0; }
.skill-md p, .skill-md li { margin: 0 0 6px; }
.skill-md ul, .skill-md ol { padding-left: 1.4em; margin: 0 0 8px; }
.skill-md code { font-family: var(--mono); font-size: var(--ui-fs-sm); background: var(--bg);
  padding: calc(1px * var(--ui-scale)) var(--ui-gap-2xs); border-radius: 4px; }
.skill-md pre { background: var(--bg); padding: var(--ui-gap-sm) var(--ui-gap-md); border-radius: var(--radius-sm); overflow-x: auto; }
.skill-md table { border-collapse: collapse; width: 100%; margin: var(--ui-gap-sm) 0; }
.skill-md th, .skill-md td { border: 1px solid var(--line); padding: var(--ui-gap-2xs) var(--ui-gap-sm); font-size: var(--ui-fs-sm); text-align: left; }
.skill-md th { background: var(--bg); font-weight: 600; }
.skill-md-raw { font-family: var(--mono); font-size: var(--ui-fs-sm); white-space: pre-wrap;
  overflow-wrap: anywhere; margin: 0; }
/* ══════════════════════════════════════════════════════════════════
   OS-92 UI 套件（.uikit-*）—— 三方开发者写新页面照这套用，禁止再造轮子
   ──────────────────────────────────────────────────────────────────
   组件清单：
     .uikit-chipfield 标签编辑器（替代「一行一个」的 textarea）
     .uikit-field     表单字段
     .uikit-input / .uikit-select   文本输入 / 下拉
     .uikit-toolbar   工具栏
     .uikit-card      卡片
     .uikit-empty     空态
     .uikit-table     键值表
     .uikit-btn       按钮（含 -primary / -ghost）
   全部只用令牌：--ui-fs-* / --ui-ctl-* / --ui-row-py / --radius / --surface-card
   ══════════════════════════════════════════════════════════════════ */

/* —— 标签编辑器 —— */
.uikit-chipfield { display: flex; flex-direction: column; gap: calc(8px * var(--ui-scale)); }
.uikit-chipfield-head { display: flex; align-items: baseline; gap: var(--ui-gap-sm); }
.uikit-chipfield-label { font-size: var(--ui-fs-sm); font-weight: 600; color: var(--ink-2); }
.uikit-chipfield-hint { font-size: var(--ui-fs-xs); color: var(--meta); }
.uikit-chipfield-count {
  margin-left: auto; font-size: var(--ui-fs-xs); color: var(--meta);
  font-variant-numeric: tabular-nums; min-width: 18px; text-align: right;
}
.uikit-chipfield-actions { flex: 0 0 auto; margin-left: var(--ui-gap-md); }
/* 「删」是低干扰的次要操作：文字按钮，进入删除态才高亮 */
.uikit-chipfield[data-editing="1"] .uikit-chipfield-actions .uikit-btn { color: var(--danger); }
.uikit-chipfield-body {
  display: flex; flex-wrap: wrap; gap: calc(6px * var(--ui-scale));
  min-height: calc(34px * var(--ui-scale)); align-items: flex-start;
  padding: calc(7px * var(--ui-scale)) var(--ui-ctl-px);
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-card);
  transition: border-color .12s ease;
}
.uikit-chipfield[data-editing="1"] .uikit-chipfield-body { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 3%, var(--surface-card)); }
.uikit-chipfield-empty { font-size: var(--ui-fs-xs); color: var(--meta); font-style: italic; align-self: center; }
.uikit-chip {
  display: inline-flex; align-items: center; gap: var(--ui-gap-2xs);
  padding: calc(2px * var(--ui-scale)) calc(8px * var(--ui-scale));
  border-radius: var(--pill);
  background: color-mix(in srgb, var(--accent) 9%, transparent);
  color: var(--accent); font-size: var(--ui-fs-sm); line-height: 1.5;
  max-width: 100%;
}
.uikit-chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uikit-chip-x {
  border: 0; background: transparent; color: inherit; cursor: pointer;
  font-size: var(--ui-fs-base); line-height: 1; padding: 0 1px; opacity: .6;
  border-radius: 50%;
}
.uikit-chip-x:hover { opacity: 1; background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.uikit-chip-x.is-hidden { display: none; }
.uikit-chipfield-inputrow { display: flex; }
.uikit-chipfield-inputrow .uikit-input { flex: 1; }

/* —— 表单 —— */
.uikit-field { display: flex; flex-direction: column; gap: calc(5px * var(--ui-scale)); }
.uikit-field-label { font-size: var(--ui-fs-sm); font-weight: 600; color: var(--ink-2); }
.uikit-field-hint { margin-left: var(--ui-gap-xs); font-size: var(--ui-fs-xs); font-weight: 400; color: var(--meta); }
.uikit-input, .uikit-select {
  width: 100%; box-sizing: border-box; height: var(--ui-ctl-h);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0 var(--ui-ctl-px);
  font-family: var(--sans); font-size: var(--ui-fs-md); color: var(--ink);
  background: var(--bg); transition: border-color .12s ease;
}
.uikit-input:focus, .uikit-select:focus { outline: none; border-color: var(--accent); }

/* —— 工具栏 —— */
.uikit-toolbar {
  display: flex; align-items: center; gap: var(--ui-gap-sm); flex-wrap: wrap;
  padding: calc(8px * var(--ui-scale)) 0;
  border-bottom: 1px solid var(--hair); margin-bottom: calc(12px * var(--ui-scale));
}
.uikit-toolbar-left, .uikit-toolbar-center, .uikit-toolbar-right {
  display: inline-flex; align-items: center; gap: var(--ui-gap-sm); font-size: var(--ui-fs-sm);
}
.uikit-toolbar-right { margin-left: auto; }

/* —— 卡片 —— */
.uikit-card {
  background: var(--surface-card); border-radius: var(--radius-md);
  box-shadow: var(--shadow-card); overflow: hidden;
}
.uikit-card-head {
  display: flex; align-items: baseline; gap: var(--ui-gap-sm); flex-wrap: wrap;
  padding: calc(10px * var(--ui-scale)) var(--ui-ctl-px) 0;
}
.uikit-card-title { margin: 0; font-size: var(--ui-fs-lg); font-weight: 600; color: var(--ink); }
.uikit-badge {
  margin-left: var(--ui-gap-xs); font-size: var(--ui-fs-xs); font-weight: 400;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent);
  padding: calc(1px * var(--ui-scale)) var(--ui-gap-xs); border-radius: var(--pill);
}
.uikit-card-sub { font-size: var(--ui-fs-xs); color: var(--meta); }
.uikit-card-actions { margin-left: auto; }
.uikit-card-body { padding: var(--ui-ctl-px); font-size: var(--ui-fs-md); color: var(--ink-2); }

/* —— 空态 —— */
.uikit-empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--ui-gap-xs);
  padding: calc(24px * var(--ui-scale)) 12px; text-align: center;
}
.uikit-empty-title { margin: 0; font-size: var(--ui-fs-base); color: var(--ink-2); }
.uikit-empty-hint { margin: 0; font-size: var(--ui-fs-sm); color: var(--meta); }

/* —— 表格 —— */
.uikit-table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--hair); }
.uikit-table { width: 100%; border-collapse: collapse; font-size: var(--ui-fs-sm); }
.uikit-table th, .uikit-table td {
  padding: var(--ui-row-py) var(--ui-ctl-px); text-align: left;
  border-bottom: 1px solid var(--hair); vertical-align: top;
}
.uikit-table thead th {
  background: var(--soft); font-weight: 600; color: var(--ink-2);
  font-size: var(--ui-fs-xs);
}
.uikit-table tbody tr:last-child td { border-bottom: 0; }
.uikit-table tbody tr:hover { background: color-mix(in srgb, var(--ink) 2%, transparent); }

/* —— 按钮 —— */
.uikit-btn {
  height: var(--ui-ctl-h); padding: 0 calc(14px * var(--ui-scale));
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg); color: var(--ink-2);
  font-family: var(--sans); font-size: var(--ui-fs-base); cursor: pointer;
  transition: border-color .12s ease, background .12s ease;
}
.uikit-btn:hover { border-color: var(--ink-2); }
.uikit-btn:disabled { opacity: .5; cursor: not-allowed; }
.uikit-btn-primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; }
.uikit-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.uikit-btn-ghost { border-color: transparent; background: transparent; }
.uikit-btn-ghost:hover { background: var(--soft); border-color: transparent; }
.uikit-buttongroup { display: inline-flex; gap: var(--ui-gap-sm); flex-wrap: wrap; }

.typo-preview {
  display: flex; flex-wrap: wrap; align-items: center; gap: calc(10px * var(--ui-scale));
  padding: calc(12px * var(--ui-scale)); margin-top: calc(10px * var(--ui-scale));
  background: var(--soft); border-radius: var(--radius-md); border: 1px dashed var(--line);
}
.typo-preview-head { font-size: var(--ui-fs-xs); color: var(--meta); width: 100%; margin-bottom: var(--ui-gap-3xs); }
.typo-preview-row { display: flex; align-items: baseline; gap: var(--ui-gap-sm); }
.typo-preview-row b { font-size: var(--ui-fs-lg); color: var(--ink); }
.typo-preview-row .count { font-size: var(--ui-fs-sm); color: var(--meta); }
.typo-preview-doc { display: block; }
.doc-paper-sample {
  font-family: var(--serif); font-size: var(--doc-font-size); line-height: var(--doc-line-height);
  color: var(--ink-2); text-indent: var(--doc-indent); margin: 0;
}
/* OS-97：设置左导航分组（本体设置 / 插件中心） */
/* ══ OS-100 按钮容器基础类（.row / .ops 此前根本不存在）══════════
   全站 30 处 inline `style="display:flex;gap:10px;align-items:center"` 
   就是在给这两个类「临时补课」——也正因如此按钮间距、对齐各不相同。
   现在补上真类，inline 全部撤掉。 */
.row {
  display: flex; align-items: center; gap: var(--ui-gap-md);
  flex-wrap: wrap; margin-top: var(--ui-gap-md);
}
.row:first-child { margin-top: 0; }
.row.stack { flex-direction: column; align-items: stretch; }

.ops {
  display: flex; align-items: center; gap: var(--ui-gap-sm);
  flex-wrap: wrap; margin-top: var(--ui-gap-lg);
}
.ops:first-child { margin-top: 0; }
.ops .sp, .row .sp { flex: 1 1 auto; }

/* 字段下方的说明文字（此前用 .count + inline line-height 拼出来的） */
.field-note {
  margin: var(--ui-gap-2xs) 0 0;
  font-size: var(--ui-fs-xs); line-height: var(--ui-lh-loose);
  color: var(--meta);
}

/* ══ OS-98 表单控件统一（作者：按钮设计全都有问题）══════════════
   此前 checkbox / radio / range 全是浏览器原生控件：
   · checkbox 是刺眼的系统蓝（截图里生图那个勾）
   · 与珊瑚主色、暗皮完全不搭
   统一用 accent-color + 尺寸令牌，一行 CSS 让所有原生控件跟主题走。 */
input[type="checkbox"],
input[type="radio"],
input[type="range"],
progress {
  accent-color: var(--accent);
}
input[type="checkbox"],
input[type="radio"] {
  width: calc(15px * var(--ui-scale));
  height: calc(15px * var(--ui-scale));
  cursor: pointer;
  flex: 0 0 auto;
}
input[type="checkbox"]:focus-visible,
input[type="radio"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* 开关行：勾选框 + 标签 + 说明，三者基线对齐（此前是散的） */
.cfg-switch {
  display: flex; align-items: center; gap: var(--ui-gap-sm);
  font-size: var(--ui-fs-sm); color: var(--ink-2);
  cursor: pointer; line-height: var(--ui-lh-normal);
  min-height: var(--ui-ctl-h);
}
.cfg-switch input { margin: 0; }
.cfg-switch span { flex: 1; min-width: 0; }

/* 设置页里的所有按钮/输入框统一走 uikit 口径（含 .step 内部） */
.step .btn-primary,
.step .btn-ghost,
.step .uikit-btn {
  height: var(--ui-ctl-h);
  font-size: var(--ui-fs-base);
}
.step input.text,
.step select.select,
.step input.file-input,
.step .uikit-input,
.step .uikit-select {
  height: var(--ui-ctl-h);
  font-size: var(--ui-fs-md);
  border-radius: var(--radius);
}

/* OS-97：知识库配置区 */
.knowledge-collections { display: flex; flex-direction: column; gap: var(--ui-gap-xs); }
.knowledge-collection-row { display: grid; grid-template-columns: 1fr 2fr auto; gap: var(--ui-gap-xs); align-items: center; }
.knowledge-collection-row .btn-ghost { width: var(--ui-ctl-h); height: var(--ui-ctl-h); padding: 0; }
.knowledge-lamp { margin-right: var(--ui-gap-2xs); }
.knowledge-lamp.is-up { color: var(--ok); }
.knowledge-lamp.is-down { color: var(--danger); }
.knowledge-ops { margin-top: var(--ui-gap-lg); }
.kv-line-sep { height: 1px; background: var(--hair); margin: var(--ui-gap-xs) 0; }
.settings-nav-group { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); }
.settings-nav-group + .settings-nav-group { margin-top: var(--ui-gap-lg); padding-top: var(--ui-gap-md); border-top: 1px solid var(--hair); }
.settings-nav-grouphead {
  padding: var(--ui-gap-xs) var(--ui-ctl-px) var(--ui-gap-2xs);
  font-size: var(--ui-fs-2xs); font-weight: 600; letter-spacing: .06em;
  color: var(--meta); text-transform: none;
  display: flex; flex-direction: column; gap: 1px;
}
.settings-nav-grouphead span {
  font-size: var(--ui-fs-2xs); font-weight: 400; letter-spacing: 0;
  color: var(--meta); opacity: .75;
}
