.composer .row { display: flex; align-items: center; gap: 8px; }
.composer .mode { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: var(--pill); padding: 2px 10px; }
/* 工具小按钮（OS-51）：风格/＋ 与发送键平级，极简圆形，不抢眼 */
.composer-tools { display: flex; align-items: center; gap: 4px; }
.c-tool { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--meta); }
.c-tool:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink); }
.c-tool.on { color: var(--accent); background: var(--accent-soft); }
/* 工具弹出菜单（OS-51）：从底部弹出，对齐其它 Agent 的 ＋ 菜单 */
.composer-pop { position: absolute; left: 8px; right: 8px; bottom: calc(100% - 4px); z-index: 88; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 8px; max-height: 300px; overflow-y: auto; }
#agent-style-menu { right: auto; width: min(460px, calc(100vw - 32px)); max-height: min(430px, calc(100vh - 160px)); }
.composer-pop .pop-title { display: flex; align-items: baseline; gap: 8px; font-size: 10.5px; font-weight: 600; color: var(--meta); letter-spacing: .04em; padding: 2px 6px 4px; }
.composer-pop .pop-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: var(--radius); text-align: left; font-size: 12.5px; color: var(--ink-2); }
.composer-pop .pop-item:hover { background: var(--soft); }
.composer-pop .pop-item b { font-weight: 600; }
.composer-pop .pop-item i { font-style: normal; font-size: 11px; color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer-pop .pop-item .pi-ic { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; background: var(--soft); display: grid; place-items: center; font-size: 12px; }
.composer-pop .pop-div { border-top: 1px solid var(--hair); margin: 6px 2px; }
.composer-pop .pop-hint { margin-left: auto; font-weight: 400; letter-spacing: 0; font-size: 10.5px; color: var(--meta); }
.composer-pop .pop-note { padding: 2px 6px 6px; font-size: 11px; line-height: 1.6; color: var(--ink-2); }
.composer-pop .pop-note b { color: var(--ink); }
.composer-pop .genre-item .pi-ic { align-self: flex-start; }
.composer-pop .genre-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.composer-pop .genre-main b { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; color: var(--ink); }
.composer-pop .genre-main .on-tag { font-style: normal; font-size: 10px; color: var(--ok, #2e7d32); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; line-height: 1.5; }
.composer-pop .genre-main .genre-desc { font-style: normal; font-size: 11px; line-height: 1.6; color: var(--meta); white-space: normal; overflow: visible; text-overflow: clip; }
.composer-pop .kb-card { margin: 4px 6px 8px; padding: 8px 10px; border: 1px solid var(--hair); border-radius: var(--radius); background: var(--soft); }
.composer-pop .kb-head { display: flex; align-items: baseline; gap: 6px; font-size: 11px; font-weight: 600; color: var(--ink-2); padding-bottom: 4px; }
.composer-pop .kb-head .kb-sub { margin-left: auto; font-weight: 400; font-size: 10px; color: var(--meta); }
.composer-pop .kb-row { display: flex; gap: 8px; padding: 3px 0; font-size: 11px; line-height: 1.6; }
.composer-pop .kb-k { flex: 0 0 56px; color: var(--meta); }
.composer-pop .kb-v { color: var(--ink-2); min-width: 0; }
.composer-pop .kb-tag { display: inline-block; border: 1px solid var(--hair); border-radius: 999px; padding: 0 8px; margin-right: 4px; font-size: 10.5px; background: var(--bg); }
.composer-pop .pop-foot { padding: 4px 8px 2px; font-size: 11px; color: var(--meta); cursor: default; user-select: none; }
.composer .send { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.composer .send:hover { background: var(--accent); }
.composer .send:disabled { background: var(--line); cursor: not-allowed; }
.composer .send.stop { background: var(--danger); }
/* hidden 属性会被上面的 display:grid 覆盖（UA 的 [hidden]{display:none} 优先级更低）——
   没有这条，红色停止按钮会永远显示（OS-51 作者指出） */
.composer .send[hidden] { display: none; }
.composer .send[hidden] { display: none; }

/* 弹层（Agent 设置 / 待确认卡） */
.overlay { position: fixed; inset: 0; background: rgba(20,18,16,.42); display: none; place-items: center; z-index: 90; }
.overlay.open { display: grid; }
.modal { width: min(520px, calc(100vw - 40px)); max-height: 84vh; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 20px 22px; }
.modal h3 { margin: 0 0 4px; font-size: 17px; }
.modal .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; line-height: 1.6; }
.modal .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.modal .field label { font-size: 12px; color: var(--muted); }
.modal .field input, .modal .field textarea { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; outline: none; background: var(--bg); font: inherit; }
.modal .field textarea { font-family: var(--serif); min-height: 160px; resize: vertical; line-height: 1.8; }
.modal .field input:focus, .modal .field textarea:focus { border-color: var(--ink); }
.modal .field .hint { font-size: 11px; color: var(--meta); overflow-wrap: anywhere; }
.modal .ops { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
.modal .err { color: var(--danger); font-size: 12px; margin: 4px 0 8px; }
/* 「本章」面板（OS-30）：章操作一行＋显示偏好分节 */
.modal .chapter-ops { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.modal .modal-sec { border-top: 1px solid var(--hair); margin-top: 14px; padding-top: 14px; }
.modal .modal-sec h4 { margin: 0 0 6px; font-size: 13px; }
.modal .modal-sec .sub { margin: 0 0 12px; }
.modal .field input[type="range"] { border: 0; padding: 0; accent-color: var(--accent); background: none; }

/* 中栏 */
.center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.tabs { height: 44px; flex: 0 0 44px; display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--hair); overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap; scrollbar-width: thin; }
.tabs .tab { padding: 10px 14px 8px; border-radius: var(--radius) var(--radius) 0 0; color: var(--muted); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tabs .tab .ic { width: 16px; height: 16px; border-radius: 4px; background: var(--soft); display: inline-grid; place-items: center; font-size: 10px; }
.tabs .tab.on { color: var(--ink); border: 1px solid var(--hair); border-bottom-color: var(--bg); background: var(--bg); margin-bottom: -1px; }
.content { flex: 1; overflow-y: auto; padding: 26px var(--content-px, 34px); }
.doc-head .kick { font-size: 12px; color: var(--meta); margin-bottom: 4px; }
.doc-head h1 { font-family: var(--serif); font-size: 28px; font-weight: 700; margin: 0 0 10px; line-height: 1.2; }
.doc-meta { display: flex; gap: 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--hair); padding-bottom: 14px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
.doc-meta .b { border: 1px solid var(--line); border-radius: var(--pill); padding: 1px 9px; }
.prose { font-family: var(--serif); font-size: 16px; line-height: 1.9; max-width: 760px; color: var(--ink-2); }
.prose p { margin: 0 0 1.2em; }

/* 条目页（wiki） */
.e-side h4 { font-size: 12px; color: var(--meta); font-weight: 600; margin: 14px 0 8px; }
.e-side .kv { display: flex; gap: 10px; margin: 4px 0; }
.e-side .kv .k { width: 54px; color: var(--meta); flex: 0 0 54px; }
.e-side .kv .v { overflow-wrap: anywhere; }

/* ── 库首页 ─────────────────────────────────────────────── */
.lib-wrap { max-width: var(--content-max, 1180px); margin: 0 auto; padding: 34px var(--content-px, 40px); }
.lib-wrap h1 { font-size: 28px; font-weight: 800; margin: 0 0 6px; }
.lib-wrap .sub { color: var(--muted); margin: 0 0 24px; }
/* 页面级头（OS-32）：标题＋右上角「!」说明＋关闭 */
.page-head { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.page-head h1 { margin: 0; }
.page-head .sp { flex: 1; }
.help-btn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.help-btn:hover { border-color: var(--ink); color: var(--ink); }
.help-btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.page-close { font-size: 18px; line-height: 1; }
.help-bubble { border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: var(--radius); background: var(--soft); padding: 12px 14px; margin: 0 0 18px; font-size: 13px; line-height: 1.85; color: var(--ink-2); }
.tab-x { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 2px; border-radius: 50%; color: var(--meta); font-size: 13px; line-height: 1; opacity: 0; transition: opacity .12s ease; }
.tabs .tab:hover .tab-x, .tabs .tab.on .tab-x { opacity: 1; }
.tab-x:hover { background: var(--soft); color: var(--danger); }
/* 段操作（OS-37）：左键选中整段 / 右键出浮窗 */
.doc-block.para-on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 4px; }
.para-menu { position: fixed; z-index: 130; display: none; flex-direction: column; min-width: 148px; padding: 5px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow); }
.para-menu.on { display: flex; }
.para-menu button { text-align: left; padding: 7px 12px; border-radius: var(--radius); font-size: 12px; color: var(--ink-2); }
.para-menu button:hover { background: var(--accent-soft); color: var(--accent); }
/* 单段分析结果浮窗 */
.para-result { position: fixed; right: 18px; bottom: 18px; z-index: 110; width: 340px; max-height: 62vh; overflow-y: auto; display: none; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow); }
.para-result.on { display: flex; }
.pr-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--hair); position: sticky; top: 0; background: var(--bg); }
.pr-head b { font-size: 13px; }
.pr-head .sp { flex: 1; }
.pr-x { color: var(--meta); font-size: 15px; line-height: 1; padding: 0 2px; }
.pr-x:hover { color: var(--danger); }
.pr-body { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.pr-sec h5 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.pr-body .spark { height: 38px; }
.tabs .tab { flex: 0 0 auto; }
.tabs .tab-add { color: var(--meta); font-size: 15px; padding: 8px 12px; flex: 0 0 auto; }
.tabs .tab-add:hover { color: var(--ink); }
.tab-pick-sec { margin-bottom: 16px; }
.tab-pick-sec h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
.tab-pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.tab-pick { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 9px; font-size: 12px; color: var(--muted); text-align: left; background: var(--bg); }
.tab-pick:hover { border-color: var(--ink); }
.tab-pick.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.tab-pick .tp-check { width: 12px; flex: 0 0 12px; color: var(--accent); font-size: 11px; }
.tab-pick b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-pick .tp-note { margin-left: auto; font-size: 10px; color: var(--meta); }
.filter { display: flex; gap: 18px; border-bottom: 1px solid var(--hair); margin: 18px 0 6px; flex-wrap: wrap; }
.filter .f { padding: 10px 2px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.filter .f.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.filter .f .n { font-size: 11px; color: var(--meta); margin-left: 3px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
.card { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 18px; text-align: left; background: var(--bg); display: flex; flex-direction: column; gap: 6px; position: relative; }
.card:hover { border-color: var(--ink); }
.card.on { border: 2px solid var(--ink); padding: 15px 17px; }
.card .t { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 16px; gap: 8px; }
.card .path { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .stat { font-size: 12px; color: var(--muted); }

/* ── 新增：空态 / 提示 / 条目列表 / 正文编辑 / wiki ────── */
.empty-state { max-width: 560px; margin: 56px auto; text-align: center; color: var(--muted); line-height: 1.8; }
.empty-state h2 { font-size: 22px; color: var(--ink); margin: 0 0 8px; }
.empty-state .hint { font-family: var(--mono); font-size: 12px; color: var(--meta); overflow-wrap: anywhere; margin-top: 10px; }
.warn-box { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 8px 12px; color: var(--muted); font-size: 12px; margin: 0 0 14px; line-height: 1.7; }
.warn-box b { color: var(--ink-2); }
.error-box { border: 1px solid var(--danger); border-radius: var(--radius); padding: 10px 12px; color: var(--danger); margin: 0 0 14px; font-size: 13px; }
.loading { color: var(--muted); padding: 30px 0; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .sp { flex: 1; }
.search { border: 1px solid var(--line); border-radius: var(--pill); padding: 6px 14px; background: var(--bg); outline: none; min-width: 220px; }
.search:focus { border-color: var(--ink); }
.chip { border: 1px solid var(--line); border-radius: var(--pill); padding: 4px 12px; color: var(--muted); font-size: 12px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:hover { border-color: var(--ink); }
.count { font-size: 12px; color: var(--meta); }
.pager { display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: 12px; color: var(--muted); }
.btn-primary { background: var(--accent); color: var(--on-accent); border-radius: var(--pill); padding: 7px 18px; font-weight: 600; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: .5; cursor: default; }
.btn-ghost { border: 1px solid var(--line); border-radius: var(--pill); padding: 6px 16px; color: var(--ink-2); }
.btn-ghost:hover { border-color: var(--ink); }
.select { border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; background: var(--bg); outline: none; max-width: 420px; }
.file-input { border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; background: var(--bg); outline: none; font-family: var(--mono); font-size: 12px; min-width: 300px; }
.file-input:focus, .select:focus { border-color: var(--ink); }
.editor { width: 100%; min-height: 58vh; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 20px 24px; background: var(--bg); font-family: var(--serif); font-size: 16px; line-height: 1.9; resize: vertical; outline: none; color: var(--ink-2); }
.editor:focus { border-color: var(--ink); }
.saved-chip { font-size: 12px; color: var(--ok); border: 1px solid var(--ok); border-radius: var(--pill); padding: 1px 10px; }

/* ── 库管理写操作（OS-7：新建/导入/修复整页流）──────────── */
.lib-head-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.lib-head-row .sp { flex: 1; }
.lib-head-row h1 { margin: 0; }
.step { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 14px; background: var(--bg); }
.step h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.step h3 .no { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 11px; flex: 0 0 20px; }
.step .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.step .field { display: flex; flex-direction: column; gap: 5px; }
.step .field label { font-size: 12px; color: var(--muted); }
.step input { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; outline: none; background: var(--bg); min-width: 300px; }
.step input:focus { border-color: var(--ink); }
.path-preview { font-family: var(--mono); font-size: 12px; color: var(--meta); overflow-wrap: anywhere; margin-top: 8px; }
.big-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.big-opt { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; text-align: left; background: var(--bg); }
.big-opt:hover { border-color: var(--ink); }
.big-opt.on { border: 2px solid var(--ink); background: var(--accent-soft); }
.big-opt b { font-size: 15px; }
.big-opt b .src { font-size: 10px; color: var(--meta); border: 1px solid var(--line); border-radius: var(--pill); padding: 0 6px; margin-left: 6px; vertical-align: 1px; font-weight: 400; }
.big-opt span { font-size: 12px; color: var(--muted); line-height: 1.6; }
/* 一行摘要（OS-32）：插件自带的长描述截断，全文走 title 悬停 */
.one-line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread-notice { font-size: 11px; color: var(--meta); padding: 2px 4px; }
.plan-group { border-top: 1px dashed var(--hair); padding: 10px 0 2px; }
.plan-group h4 { margin: 0 0 6px; font-size: 13px; }
.plan-group .cnt { color: var(--meta); font-size: 12px; margin-left: 6px; font-weight: 400; }
.plan-files { max-height: 170px; overflow-y: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.8; }
.result-kv { display: flex; gap: 22px; flex-wrap: wrap; margin: 8px 0; align-items: baseline; }
.result-kv b { font-size: 20px; }
.result-kv .bad { color: var(--danger); }
.repair-card { max-width: 640px; margin: 56px auto; border: 1px solid var(--danger); border-radius: var(--radius-lg); padding: 22px 24px; }
.repair-card h2 { margin: 0 0 6px; font-size: 20px; }
.repair-card .detail { color: var(--muted); line-height: 1.8; margin: 0 0 4px; }
.repair-card .path { font-family: var(--mono); font-size: 12px; color: var(--meta); overflow-wrap: anywhere; margin: 0 0 14px; }
.repair-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.raw-detail { font-family: var(--mono); font-size: 11px; color: var(--meta); margin-top: 12px; overflow-wrap: anywhere; line-height: 1.7; }

/* ── 业务页扩展（OS-8：动态页签＋目录工作面＋推演页）────── */
.tabs .tab .pill { font-size: 10px; color: var(--meta); border: 1px solid var(--line); border-radius: var(--pill); padding: 0 6px; margin-left: 2px; }
.deduce-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; max-width: 1200px; }
@media (max-width: 1100px) { .deduce-grid { grid-template-columns: minmax(0, 1fr); } }
.deduce-input { width: 100%; min-height: 88px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; outline: none; background: var(--bg); font: inherit; resize: vertical; margin-bottom: 12px; }
.deduce-input:focus { border-color: var(--ink); }
#deduce-question { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; outline: none; background: var(--bg); }
#deduce-question:focus { border-color: var(--ink); }
.deduce-reply { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--serif); line-height: 1.9; max-height: 460px; overflow-y: auto; color: var(--ink-2); }

/* ── 正文工作面（OS-23：纸面与标题同基准顶满）────────────────────
   OS-48：旧的章节悬浮抽屉已删除——章节列表统一在左栏「章节」卡片里，
   避免和新左栏功能重合（两套章节列表同时显示是 bug）。 */
.chapter-grid { position: relative; display: block; max-width: none; }
/* 章节卡片内的新建行＋行表（类纸无框） */
.chapter-new { display: flex; gap: 6px; padding: 0 0 8px; }
.chapter-new input { flex: 1; min-width: 0; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 5px 4px; outline: none; background: transparent; font-size: 12px; }
.chapter-new input:focus { border-bottom-color: var(--ink); }
.chapter-rows { max-height: 220px; overflow-y: auto; }
.chapter-editor-col { min-width: 0; }

/* ── 设置页＋产物中心（OS-11）────────────────────────────── */
.kv-line { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--hair); font-size: 13px; align-items: baseline; }
.kv-line .k { color: var(--muted); }
.kv-line .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.artifacts-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; max-width: 1280px; align-items: start; }
@media (max-width: 1100px) { .artifacts-grid { grid-template-columns: minmax(0, 1fr); } }
.artifact-group h3 { display: flex; align-items: center; gap: 8px; }
.artifact-group .cnt { color: var(--meta); font-size: 12px; font-weight: 400; }
.artifact-rows { border-top: 1px solid var(--hair); max-height: 300px; overflow-y: auto; }
.artifact-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; width: 100%; padding: 7px 8px; border-bottom: 1px solid var(--hair); text-align: left; align-items: baseline; }
.artifact-row:hover { background: var(--soft); }
.artifact-row.on { background: var(--accent-soft); }
.artifact-row .nm { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.artifact-row .sz { font-size: 11px; color: var(--meta); }
.artifact-row .tm { font-size: 11px; color: var(--meta); }
.artifact-row .tag { font-size: 10px; border: 1px solid var(--line); border-radius: var(--pill); padding: 0 6px; color: var(--meta); }
.artifact-row.hist .nm { color: var(--muted); }
.artifact-preview h3 .src { font-size: 10px; color: var(--accent); border: 1px solid var(--accent); border-radius: var(--pill); padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
.artifact-preview .editor { min-height: 260px; max-height: 420px; font-size: 14px; }

/* ── 设置页分节制（OS-14：左导航＋节内容，架子给后续功能规则留位）── */
.settings-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .settings-layout { grid-template-columns: minmax(0, 1fr); } }
.settings-nav { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--bg); overflow: hidden; position: sticky; top: 12px; }
.settings-nav-item { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--hair); }
.settings-nav-item:last-child { border-bottom: 0; }
.settings-nav-item:hover { background: var(--soft); }
.settings-nav-item.on { background: var(--accent-soft); border-left: 2px solid var(--accent); padding-left: 12px; }
.settings-nav-item b { font-size: 13px; }
.settings-nav-item span { font-size: 11px; color: var(--meta); }

/* ── 套件详情头（OS-16：块级排版，治换行烂）＋page 模式 iframe ── */
.suite-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
.suite-head .suite-name { font-size: 16px; font-weight: 700; }
.suite-head .state-chip { margin-left: auto; }
.bskill-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 7px 10px; border: 1px solid var(--line, #ddd); border-radius: 8px; margin-top: 6px; }
.bskill-row b { font-size: 13px; }
.bskill-row .sub { flex: 1; min-width: 200px; }
.pill.sm { font-size: 11px; padding: 1px 8px; }
.suite-frame { width: 100%; height: 480px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--bg); }
.cap-chips .pill { margin-right: 4px; }

/* ── 沉浸式文档纸面（OS-21）────────────────────────────── */
:root {
  --doc-font-size: 17px; --doc-line-height: 1.9; --doc-para-gap: 1em; --doc-indent: 2em;
  --doc-max: 720px;
}
.doc-head-immersive { max-width: var(--doc-max); margin: 0 auto 8px; }
.doc-head-immersive .docline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--meta); margin-bottom: 10px; flex-wrap: wrap; }
.doc-head-immersive .docline .sp { flex: 1; }
.doc-head-immersive .chap-no { color: var(--accent); font-weight: 600; }
.doc-head-immersive .docline-sep { color: var(--line); }
.doc-head-immersive .doc-title { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 0 0 6px; }
.doc-head-immersive .doc-actions { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; flex-wrap: wrap; }
.doc-head-immersive .doc-actions .sp { flex: 1; }
.doc-head-immersive .doc-actions .doc-save { padding: 4px 16px; font-size: 12px; }
.doc-head-immersive .doc-link[disabled] { opacity: .4; cursor: default; }
.doc-head-immersive .doc-mini-meta { display: flex; gap: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }
.doc-link { font-size: 12px; color: var(--muted); padding: 2px 8px; border: 1px solid var(--line); border-radius: var(--pill); }
.doc-link:hover { color: var(--ink); border-color: var(--ink); }
.doc-paper { max-width: var(--doc-max); margin: 0 auto; font-family: var(--serif); font-size: var(--doc-font-size); line-height: var(--doc-line-height); color: var(--ink-2); }
.doc-paper p { margin: 0 0 var(--doc-para-gap); text-indent: var(--doc-indent); }
.doc-paper h1, .doc-paper h2, .doc-paper h3, .doc-paper h4 { font-family: var(--serif); text-indent: 0; }
.doc-paper blockquote { margin: 0 0 var(--doc-para-gap); padding-left: 14px; border-left: 2px solid var(--line); color: var(--muted); }
.doc-paper ul, .doc-paper ol { margin: 0 0 var(--doc-para-gap); padding-left: 1.6em; }
.doc-paper code { font-family: var(--mono); font-size: .9em; background: var(--soft); padding: 1px 5px; border-radius: 4px; text-indent: 0; }
.doc-paper pre { background: var(--soft); border: 1px solid var(--hair); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; }
.doc-paper pre code { background: none; padding: 0; }
.doc-paper hr { border: 0; border-top: 1px solid var(--hair); margin: 24px 0; }
.doc-paper a { color: var(--accent); }
.doc-paper [data-para] { cursor: text; border-radius: 4px; }
.doc-paper [data-para]:hover { background: var(--soft); }
html[data-doc-auto-gap="off"] .doc-paper p { margin-bottom: 0; }
/* 正文工作台（OS-33）：页头吸顶；正文与右栏各自独立滚动 */
.content.content-locked { overflow: hidden; padding: 0; display: flex; flex-direction: column; }
.doc-workspace-sticky { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.doc-workspace-sticky .doc-head-immersive {
  flex: 0 0 auto; max-width: none; margin: 0;
  padding: 12px calc(var(--content-px, 34px) + 4px) 10px;
  border-bottom: 1px solid var(--hair);
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(8px);
  z-index: 30;
}
.doc-workspace-sticky .doc-head-immersive .docline { max-width: var(--doc-max); margin: 0 auto 8px; }
.doc-workspace-sticky .doc-head-immersive .doc-title-row { max-width: var(--doc-max); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.doc-workspace-sticky .doc-head-immersive .doc-title { flex: 1; min-width: 0; margin: 0; }
.doc-workspace-sticky .doc-head-immersive .doc-actions { margin: 0; flex: 0 0 auto; }
.doc-workspace-sticky .doc-head-immersive .doc-mini-meta { max-width: var(--doc-max); margin: 4px auto 0; }
.doc-workspace-sticky .chapter-grid { flex: 1; min-height: 0; display: block; position: relative; }
/* 题材页通用布局（OS-45）：左栏（章节树/图谱/摘要）＋ 题材主区 */
.topic-workspace { flex: 1; min-height: 0; display: flex; }
.topic-main { flex: 1; min-width: 0; overflow-y: auto; padding: 22px var(--content-px, 34px) 60px; }
/* 正文滚动区占满整格（OS-48）：左右两栏都是绝对定位浮层，纸面宽度与位置只受窗口影响，
   开关任何一栏都不会动正文一像素——这是「附庸不挤占正文」的落地。 */
.doc-workspace-sticky .doc-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 22px calc(var(--content-px, 34px) + 4px) 60px; }
/* 浮层让位（OS-48）：纸面固定居中，窄窗口里先把行宽收窄，保证不被左右浮层压住。
   300(右) + 248(左) + 两侧各 16 的呼吸 ≈ 580px 被浮层占用，其余才是纸面可用的净宽。 */
@media (max-width: 1500px) { :root { --doc-max: min(720px, calc(100vw - 320px - 580px)); } }
.doc-block { outline: none; border-radius: 4px; margin: 0 0 var(--doc-para-gap); padding: 2px 4px; margin-left: -4px; margin-right: -4px; }
.doc-block:hover { background: var(--soft); }
.doc-block:focus { background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); }
.doc-block:focus p { text-indent: var(--doc-indent); }
.doc-block > *:first-child { margin-top: 0; }
.doc-block > *:last-child { margin-bottom: 0; }
.doc-block p { margin: 0; }
html[data-doc-auto-gap="off"] .doc-block { margin-bottom: 0; }
.doc-icon { width: 26px; height: 26px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.doc-drawer-btn { width: 26px; height: 26px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.doc-icon svg, .doc-drawer-btn svg { display: block; }
.doc-drawer-btn:hover, .doc-drawer-btn.on { background: var(--soft); color: var(--ink); }
.doc-icon:hover { background: var(--soft); color: var(--ink); }
.doc-autosave { font-size: 11px; color: var(--meta); }
.doc-editor { width: 100%; min-height: calc(100vh - 260px); border: 0; outline: none; background: transparent; resize: none; padding: 0; font-family: var(--serif); font-size: var(--doc-font-size); line-height: var(--doc-line-height); color: var(--ink-2); }
.doc-editor:focus { outline: none; }
.doc-workspace .chapter-editor-col .toolbar { max-width: var(--doc-max); margin: 0 auto 10px; }

/* ── 运行时货架分组（OS-18）─────────────────────────────── */
.runtime-group { margin-bottom: 14px; }
.runtime-group-head { font-size: 12px; color: var(--meta); font-weight: 600; margin: 0 0 8px; letter-spacing: .04em; }
.big-opt .rt-status { font-size: 10px; border-radius: var(--pill); padding: 0 7px; margin-left: 6px; border: 1px solid var(--line); color: var(--meta); font-weight: 400; }
.big-opt .rt-status.ready, .big-opt .rt-status.running { color: var(--ok); border-color: var(--ok); }
.big-opt .rt-status.unconfigured, .big-opt .rt-status.idle { color: var(--meta); }
.big-opt .rt-status.missing { color: var(--danger); border-color: var(--danger); }
.big-opt.is-missing { opacity: .7; }
.rt-fix { margin-top: 8px; border: 1px solid var(--accent); color: var(--accent); border-radius: var(--pill); padding: 3px 12px; font-size: 11px; text-align: center; cursor: pointer; }
.rt-fix:hover { background: var(--accent-soft); }

/* ── 套件激活管理面板（OS-17）────────────────────────────── */
.suite-manage { border: 1px solid var(--hair); border-radius: var(--radius); overflow: hidden; }
.suite-manage-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--hair); align-items: center; }
.suite-manage-row:last-child { border-bottom: 0; }
.suite-manage-row.off { opacity: .62; }
.suite-manage-row .sm-main { min-width: 0; }
.suite-manage-row .sm-name { font-weight: 700; font-size: 14px; padding: 0; }
.suite-manage-row .sm-name:hover { color: var(--accent); }
.suite-manage-row .sm-main .count { margin-top: 2px; }
.suite-manage-row .sm-ops { display: flex; gap: 8px; align-items: center; }
.sm-toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--pill); padding: 4px 10px 4px 4px; background: var(--bg); }
.sm-toggle .knob { width: 14px; height: 14px; border-radius: 50%; background: var(--meta); }
.sm-toggle.on { border-color: var(--ok); }
.sm-toggle.on .knob { background: var(--ok); }
.sm-toggle.on .lab { color: var(--ok); }
.sm-toggle:hover { border-color: var(--ink); }

/* ── 选区浮窗＋Agent 上下文条（OS-24）────────────── */
.sel-bar { position: fixed; z-index: 120; display: none; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--pill); box-shadow: var(--shadow); }
.sel-bar.on { display: flex; }
.sel-bar button { border-radius: var(--pill); padding: 5px 14px; font-size: 12px; color: var(--ink-2); }
.sel-bar button:hover { background: var(--accent-soft); color: var(--accent); }
.agent-context:empty { display: none; }
.agent-context { padding: 0 14px 6px; }
/* 上下文条（OS-67 作者口径）：提示类信息用浅绿（--ok 系），红色留给错误——
   之前用 --accent 红虚线，读起来像报错 */
.ctx-chip { display: flex; align-items: center; gap: 8px; border: 1px dashed color-mix(in srgb, var(--ok) 55%, transparent); border-radius: var(--radius); padding: 6px 10px; font-size: 11px; background: color-mix(in srgb, var(--ok) 7%, transparent); }
.ctx-chip .ctx-label { color: color-mix(in srgb, var(--ok) 80%, var(--ink)); font-weight: 600; flex: 0 0 auto; }
.ctx-chip .ctx-text { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.ctx-chip .ctx-x { color: var(--meta); font-size: 14px; line-height: 1; }
.ctx-chip .ctx-x:hover { color: var(--danger); }

/* ── 分析面板（OS-33）：独立右栏，不跟正文一起滚；批注卡随段落吸顶 ──────
   类纸（OS-47）：右栏无边框，模块各自是软卡片堆叠
   OS-48：右栏同样是**浮层附庸**（绝对定位），开关不改变正文纸面宽度与位置 */
.analyze-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 300px; min-width: 0; z-index: 45;
  background: transparent;
  display: none; flex-direction: column; overflow-y: auto; }
.analyze-panel.open { display: flex; }
.analyze-head { display: flex; align-items: center; gap: 6px; padding: 9px 10px 9px 14px; font-size: 12px; font-weight: 600; color: var(--ink-2); position: sticky; top: 0; background: var(--bg); z-index: 2; }
.analyze-head .rm-title { flex: 0 0 auto; }
.analyze-head .rm-badge { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.analyze-head .sp { flex: 1; }
.analyze-body { padding: 4px 12px 18px; display: flex; flex-direction: column; gap: 8px; }
/* 右栏每张分析卡与左侧卡片同一套影与底色（OS-49） */
.analyze-sec { background: var(--surface-card); border-radius: var(--radius-md); padding: 12px; box-shadow: var(--shadow-card); transition: box-shadow .16s ease; }
.analyze-sec:hover { box-shadow: var(--shadow-card-hover); }
.analyze-kpis { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.analyze-kpis b { color: var(--ink); font-size: 15px; margin-right: 2px; }
.analyze-sec h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.analyze-sec .sub { font-size: 11px; color: var(--meta); margin: 6px 0 0; line-height: 1.6; }
.spark { width: 100%; height: 46px; display: block; background: var(--bg); border-radius: var(--radius); }.chart-tabs { display: flex; gap: 6px; margin: 2px 0 8px; }
.chart-tab { border: 0; background: transparent; color: var(--meta); border-radius: 999px; padding: 3px 12px; font-size: 12px; cursor: pointer; }
.chart-tab.on { background: var(--accent-soft, color-mix(in srgb, var(--accent) 12%, transparent)); color: var(--accent); font-weight: 600; }
.analyze-sec svg [data-action] { transition: fill-opacity .15s; }
.analyze-sec svg [data-action]:hover { fill-opacity: 1; }
/* 曲线交互（OS-50）：可见点默认小，hover 命中区时放大——让「能点、且点和正文段落对应」一眼可见 */
.analyze-sec svg .cv-dot { transition: r .12s ease, fill-opacity .12s ease; }
.analyze-sec svg .cv-hit:hover + .cv-dot,
.analyze-sec svg .cv-dot.on { r: 5; fill-opacity: 1; }
.ai-score { font-size: 15px; }
/* 编辑总评（OS-56）：结论优先——人话总评＋好在哪＋问题在哪（可定位可跳详情） */
.ed-card { background: var(--surface-card); border-radius: var(--radius-md); padding: 12px; box-shadow: var(--shadow-card); }
.ed-card h4 { margin: 0 0 6px; font-size: 13px; }
.ed-headline { margin: 0 0 10px; font-size: 13px; line-height: 1.75; color: var(--ink); font-weight: 600; }
.ed-line { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-top: 1px dashed var(--hair); font-size: 12px; line-height: 1.65; }
.ed-line:first-child { border-top: 0; }
.ed-ic { flex: 0 0 14px; text-align: center; font-weight: 700; }
.ed-line.good .ed-ic { color: var(--ok); }
.ed-line.warn .ed-ic { color: var(--warn); }
.ed-text { flex: 1; min-width: 0; }
.ed-text b { font-weight: 600; color: var(--ink-2); }
.ed-action { display: block; color: var(--ink-2); font-style: normal; margin-top: 2px; }
.ed-action::before { content: '→ '; color: var(--meta); }
.ed-why { display: block; color: var(--meta); font-style: normal; font-size: 11px; margin-top: 1px; }
.ed-source { display: block; color: var(--meta); font-style: normal; font-size: 10.5px; margin-top: 2px; opacity: .9; }
.ed-ops { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
.ed-act { font-size: 11px; color: var(--muted); border-radius: var(--pill); padding: 2px 10px; background: color-mix(in srgb, var(--ink) 5%, var(--bg)); white-space: nowrap; }
.ed-act:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 9%, var(--bg)); }
/* 模块折叠卡（OS-56）：summary＝人话结论，展开＝数据（详有略） */
.analyze-sec.mod { padding: 0; }
.analyze-sec.mod > summary { display: flex; align-items: center; gap: 8px; padding: 11px 12px; cursor: pointer; list-style: none; user-select: none; }
.analyze-sec.mod > summary::-webkit-details-marker { display: none; }
.analyze-sec.mod > summary::marker { content: ''; }
.analyze-sec.mod > summary:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); border-radius: var(--radius-md); }
.mod-v-head { font-size: 13px; font-weight: 600; color: var(--ink-2); flex: 0 0 auto; }
.mod-verdict { flex: 1; min-width: 0; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mod-verdict.warn { color: var(--warn); }
.mod-verdict.good { color: var(--ok); }
.mod-verdict.neutral { color: var(--meta); }
.mod-caret { color: var(--meta); font-size: 12px; transition: transform .15s ease; transform: rotate(90deg); }
.analyze-sec.mod[open] > summary .mod-caret { transform: rotate(-90deg); }
.analyze-sec.mod > .mod-v-body { padding: 0 12px 12px; border-top: 1px dashed var(--hair); }
.analyze-sec.mod > .mod-v-body h4 { display: none; }
/* 文风模块（OS-44）：句长/段长变异系数是「像不像人写」的两个硬指标 */
.style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.style-kpi { display: flex; flex-direction: column; gap: 1px; border: 0; border-radius: var(--radius); padding: 7px 9px; background: color-mix(in srgb, var(--ink) 2.5%, var(--bg)); }
.style-kpi .sk-label { font-size: 10px; color: var(--meta); }
.style-kpi .sk-val { font-size: 16px; font-variant-numeric: tabular-nums; }
.style-kpi .sk-val.good { color: var(--ok); }
.style-kpi .sk-val.mid { color: var(--warn); }
.style-kpi .sk-val.bad { color: var(--danger); }
.style-kpi .sk-note { font-size: 10px; color: var(--muted); }
.style-block { margin-top: 8px; }
.style-block h5 { margin: 0 0 5px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.style-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.style-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); border: 0; border-radius: var(--pill); padding: 2px 8px; background: var(--bg); cursor: help; }
.style-chip b { font-size: 9px; color: var(--meta); font-variant-numeric: tabular-nums; }
.style-chip.cliche { background: color-mix(in srgb, var(--danger) 8%, var(--bg)); }
.style-chip.connective { background: color-mix(in srgb, var(--warn) 10%, var(--bg)); }
/* 工作台模块插拔（OS-44）：设置页勾选列表 */
.mod-list { display: flex; flex-direction: column; gap: 2px; }
.mod-row { border-bottom: 1px dashed var(--hair); }
.mod-row:last-child { border-bottom: 0; }
.mod-main { display: flex; align-items: flex-start; gap: 10px; padding: 9px 4px; cursor: pointer; }
.mod-main input { margin-top: 2px; }
.mod-main span { display: flex; flex-direction: column; gap: 1px; }
.mod-main b { font-size: 13px; font-weight: 600; }
.mod-main i { font-style: normal; font-size: 11px; color: var(--meta); }
.ai-score.good { color: var(--ok); }
.ai-score.mid { color: var(--warn); }
.ai-score.bad { color: var(--danger); }
.bar-row { display: grid; grid-template-columns: 74px minmax(0,1fr) 28px; gap: 6px; align-items: center; font-size: 11px; margin-bottom: 5px; }
.bar-label { color: var(--muted); }
.bar-track { height: 6px; background: var(--hair); border-radius: 999px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar-score { text-align: right; color: var(--ink-2); }
.bar-detail { grid-column: 1 / -1; color: var(--meta); font-size: 10px; margin: -2px 0 2px; }
/* 批注卡：右栏「本段批注」区随滚动换内容（OS-33）；类纸化后它自己就是一张卡（OS-47） */
.analyze-here { border: 0; border-radius: 0; padding: 0; background: transparent; }
.analyze-here h4 { margin-bottom: 8px; }
.sec-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.sec-toggle:hover { color: var(--ink); }
.sec-toggle .caret { font-size: 10px; color: var(--meta); }
.issue-card { border: 0; border-radius: var(--radius); padding: 8px 10px; margin-bottom: 6px; background: color-mix(in srgb, var(--ink) 2.5%, var(--bg)); font-size: 12px; }
.ic-head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
/* 严重度改为小圆点，不再用色条描边 */
.ic-head::before { content: ''; flex: 0 0 auto; align-self: center; width: 6px; height: 6px; border-radius: 50%; background: var(--meta); }
.issue-card.sev-high .ic-head::before { background: var(--danger); }
.issue-card.sev-medium .ic-head::before { background: var(--warn); }
.ic-tag { font-weight: 600; }
.ic-para { margin-left: auto; font-size: 10px; color: var(--meta); font-variant-numeric: tabular-nums; }
.ic-detail { color: var(--muted); line-height: 1.6; }
.ic-ops { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
/* 批注空态（OS-50）：不再是一行灰字＋大片留白，改成「结论 + 全章概览 + 可跳转入口」 */
.ann-empty { display: flex; flex-direction: column; gap: 7px; padding: 2px 0 2px; }
.ann-empty-main { margin: 0; font-size: 12px; color: var(--ink-2); line-height: 1.6; }
.ann-empty-sub { margin: 0; font-size: 11px; color: var(--meta); line-height: 1.6; }
.ann-empty-ops { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 1px; }
.ann-jump { font-size: 11px; color: var(--muted); border-radius: var(--pill); padding: 3px 10px; background: color-mix(in srgb, var(--ink) 5%, var(--bg)); }
.ann-jump:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 9%, var(--bg)); }
.ann-more { font-size: 10.5px; color: var(--meta); align-self: center; }
.issue-act { font-size: 11px; border: 0; border-radius: var(--pill); padding: 2px 10px; color: var(--muted); background: color-mix(in srgb, var(--ink) 5%, var(--bg)); }
.issue-act:hover { color: var(--ink); background: var(--hair); }
/* 文档内标注（OS-33）：左侧可点竖条＝这一段有批注；点它跳到那段并让右栏对齐 */
.doc-line { position: relative; display: block; }
.doc-line .doc-block { margin-bottom: var(--doc-para-gap); }
.doc-line:last-child .doc-block { margin-bottom: 0; }
.doc-gutter { position: absolute; left: -22px; top: 6px; bottom: 6px; width: 14px; border: 0; background: none; cursor: default; padding: 0; display: block; }
.doc-gutter.has-issue { cursor: pointer; }
.doc-gutter.has-issue::after { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; border-radius: 2px; background: var(--meta); transition: width .12s ease, left .12s ease; }
.doc-gutter.has-issue.sev-high::after { background: var(--danger); }
.doc-gutter.has-issue.sev-medium::after { background: var(--warn); }
.doc-gutter.has-issue.sev-low::after { background: var(--meta); }
.doc-gutter.has-issue:hover::after { width: 3px; left: 5.5px; }
.doc-gutter.has-issue.on::after { width: 3px; left: 5.5px; background: var(--accent); }
.doc-block.issue-flash { animation: issueFlash 1.2s ease; }
@keyframes issueFlash { 0%,100% { background: transparent; } 30% { background: var(--accent-soft); } }

.discover-row { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px dashed var(--hair); font-size: 13px; }
.discover-row b { margin-right: 8px; }
.discover-row .hint { font-family: var(--mono); font-size: 11px; color: var(--meta); }

/* ── 推演引擎（OS-29）────────────────────────────────── */
.doc-line-row { display: flex; align-items: center; gap: 14px; }
/* 推演页（OS-60 打磨）：类纸卡片、局面卡字段化、候选翻译成人话 */
.ded-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.ded-tools .file-input { flex: 0 1 200px; }
.ded-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1180px) { .ded-grid { grid-template-columns: minmax(0, 1fr); } }
.ded-col-left, .ded-col-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ded-card { background: var(--surface-card); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-card); }
.ded-card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.ded-card-head h3 { margin: 0; font-size: 14px; }
.ded-card-head .sub { font-size: 11px; color: var(--meta); }
.ded-heat { margin-left: auto; font-size: 10.5px; border-radius: var(--pill); padding: 1px 9px; }
.ded-heat.h-low { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.ded-heat.h-mid { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn-ink); }
.ded-heat.h-high { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.ded-heat.h-crit { background: var(--danger); color: var(--on-accent); }
.ded-fields { margin: 0; display: flex; flex-direction: column; gap: 7px; }
.ded-fields > div { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.ded-fields dt { font-size: 11px; color: var(--meta); }
.ded-fields dd { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
.ded-none { color: var(--meta); font-style: normal; font-size: 12px; }
.ded-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--hair); font-size: 10.5px; color: var(--meta); font-variant-numeric: tabular-nums; }
.ded-badge { font-size: 10px; border-radius: var(--pill); padding: 1px 9px; background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink-2); }
.ded-cand-note { font-size: 10.5px; color: var(--meta); }
.ded-cand-ops { display: flex; gap: 6px; }
.ded-front { margin-bottom: 9px; }
.ded-front-row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); margin-bottom: 4px; }
.ded-front-n { color: var(--meta); font-variant-numeric: tabular-nums; }
.ded-clock { height: 5px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; }
.ded-clock i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.ded-hint { font-size: 12px; color: var(--ok); margin-bottom: 10px; }
.ded-howto { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--hair); display: flex; flex-direction: column; gap: 3px; }
.ded-howto b { font-size: 11.5px; color: var(--ink-2); }
.ded-howto span { font-size: 11px; color: var(--meta); line-height: 1.65; }
.ded-pack-row { display: grid; grid-template-columns: 14px 62px minmax(0,1fr); gap: 7px; align-items: baseline; padding: 3px 0; font-size: 11.5px; }
.ded-pack-ic { text-align: center; font-size: 10px; }
.ded-pack-row.ok .ded-pack-ic { color: var(--ok); }
.ded-pack-row.gap .ded-pack-ic { color: var(--meta); }
.ded-pack-label { color: var(--ink-2); }
.ded-pack-hint { color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ded-empty { max-width: 640px; }
.ded-empty h2 { font-size: 17px; margin: 0 0 8px; }
.ded-empty p { font-size: 13px; color: var(--muted); line-height: 1.75; margin: 0 0 10px; }
.ded-empty-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.ded-type { background: var(--surface-card); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; box-shadow: var(--shadow-card); }
.ded-type b { font-size: 12.5px; }
.ded-type span { font-size: 11px; color: var(--meta); }
/* 推演回合层（OS-61 P2）：缓存区进度 / 自己写 / 正文草稿 */
.ded-buffer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.ded-buffer-stat { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ded-buffer .ok-note { flex: 1 1 240px; }
.ded-custom { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--hair); }
.ded-custom-input { flex: 1 1 auto; min-height: 54px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; outline: none; background: var(--bg); font: inherit; font-size: 12.5px; line-height: 1.7; resize: vertical; }
.ded-custom-input:focus { border-color: var(--ink); }
.ded-custom .btn-primary { flex: 0 0 auto; white-space: nowrap; }
.ded-draft-input { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; outline: none; background: var(--bg); font-family: var(--serif); font-size: 14px; line-height: 1.9; resize: vertical; box-sizing: border-box; }
.ded-draft-input:focus { border-color: var(--ink); }
.ded-draft-meta { display: flex; justify-content: flex-end; font-size: 10.5px; color: var(--meta); font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
.ded-draft .warn-box { margin-bottom: 10px; }
/* 文游舞台（OS-61 P4）：场景立绘＋对话框打字机＋人物头像列＋宽按钮选项 */
/* 文游舞台（OS-63）：一张铺满的画面，对话框浮底、选项浮其上——galgame 观感 */
.ded-stage { position: relative; height: min(72vh, 760px); min-height: 520px; border-radius: var(--radius-md);
  overflow: hidden; background: var(--soft); margin-bottom: 12px; }
/* OS-70：舞台是唯一主面——占满视口余量，局面/设置浮层并入，舞台下不再有割裂的详情区 */
.ded-stage-tall { height: calc(100vh - 178px); min-height: 600px; margin-bottom: 0; }
/* 左侧浮层卡（局面/前线/事实包）：类纸半透明，暗舞台上可读；可经顶栏「局面」收起 */
.ded-stage-info { position: absolute; left: 14px; top: 46px; bottom: 190px; z-index: 3; width: 302px;
  display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 2px; }
.ded-stage-info[hidden] { display: none; }
.ded-stage-info .ded-card { background: rgba(255, 255, 255, .93); backdrop-filter: blur(8px);
  box-shadow: 0 2px 14px rgba(0,0,0,.2); padding: 11px 13px; border-radius: var(--radius); }
.ded-stage-info .ded-card-head h3 { font-size: 12.5px; }
.ded-stage-info .ded-card .sub { font-size: 10.5px; }
.ded-stage-info .ded-fields dt { font-size: 10.5px; }
.ded-stage-info .ded-fields dd { font-size: 11.5px; }
.ded-stage-info .ded-meta { font-size: 10px; }
/* 右上设置弹层（POV/种子/推进/重新开局） */
.ded-set-panel { position: absolute; right: 14px; top: 46px; z-index: 6; width: min(430px, calc(100% - 380px));
  background: rgba(255, 255, 255, .95); backdrop-filter: blur(8px); border-radius: var(--radius);
  box-shadow: 0 6px 24px rgba(0,0,0,.26); padding: 12px 14px; }
.ded-set-panel[hidden] { display: none; }
.ded-set-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; font-size: 12.5px; font-weight: 600; }
.ded-set-head .sub { font-size: 10.5px; color: var(--meta); font-weight: 400; }
.ded-set-panel .ded-tools { margin: 0; }
/* 对话框动作行（编辑/重写/下一拍内嵌，不再外置重复） */
.ded-dialog-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.ded-dialog-head .ded-dialog-tip { margin-left: 0; }
.ded-dialog-actions .ded-bgm { font-size: 10.5px; color: rgba(255,255,255,.82);
  background: rgba(20,18,30,.4); border-radius: var(--pill); padding: 2px 11px; backdrop-filter: blur(4px); }
.ded-dialog-actions .ded-bgm:hover { background: rgba(20,18,30,.62); }
.ded-dialog-actions .ded-bgm.on { background: rgba(255,255,255,.16); }
.ded-dialog-actions .ded-next { font-size: 11px; color: var(--on-accent); background: var(--accent);
  border-radius: var(--pill); padding: 3px 13px; font-weight: 600; }
.ded-dialog-actions .ded-next:hover { background: var(--accent-hover); }
.ded-dialog-actions .ded-next[disabled] { opacity: .55; }
/* 对话框编辑态：就地 textarea，字数脚注 */
.ded-dialog.editing { padding-bottom: 10px; }
.ded-dialog-input { width: 100%; min-height: 150px; max-height: 34vh; resize: vertical; border: 0; outline: none;
  border-radius: var(--radius); padding: 10px 13px; font-family: var(--serif); font-size: 14px; line-height: 1.9;
  background: rgba(12, 11, 18, .55); color: rgba(255,255,255,.95); }
.ded-dialog-input:focus { background: rgba(12, 11, 18, .72); }
.ded-dialog-foot { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; font-size: 10.5px; color: rgba(255,255,255,.62); }
.ded-dialog-foot-sub { margin-left: auto; opacity: .7; }
.ded-scene-visual { position: absolute; inset: 0; background-size: cover; background-position: center;
  background-color: var(--scene-deep); background-image: linear-gradient(160deg, var(--scene-deep) 0%, var(--scene-mid) 45%, var(--scene-far) 100%); }
.ded-scene-grain { position: absolute; inset: 0; opacity: .5;
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.14), transparent 55%),
              radial-gradient(circle at 75% 70%, rgba(255,200,220,.12), transparent 50%); }
.ded-scene-badge { position: absolute; left: 16px; top: 44px; font-size: 11px; color: rgba(255,255,255,.82);
  background: rgba(20,18,30,.34); border-radius: var(--pill); padding: 2px 10px; backdrop-filter: blur(4px); z-index: 3; }
.ded-stage-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; z-index: 4; }
.ded-bar-sep { margin: 0 7px; opacity: .45; }
.ded-bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.ded-stage-bar .ded-stage-progress { font-size: 11.5px; color: rgba(255,255,255,.86); }
.ded-stage-bar .ded-heat { font-size: 10.5px; }
.ded-stage-bar .ded-bgm { font-size: 10.5px; color: rgba(255,255,255,.8);
  background: rgba(20,18,30,.34); border-radius: var(--pill); padding: 2px 10px; backdrop-filter: blur(4px); }
.ded-stage-bar .ded-bgm[disabled] { opacity: .55; }
.ded-stage-side { position: absolute; right: 12px; top: 46px; z-index: 3; display: flex; flex-direction: column; gap: 10px;
  max-height: calc(100% - 240px); overflow-y: auto; }
.ded-avatar { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.ded-avatar img, .ded-avatar-ph { width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
  display: grid; place-items: center; font-size: 20px; font-weight: 700; box-shadow: 0 2px 10px rgba(0,0,0,.22); }
.ded-avatar-name { font-size: 10px; color: rgba(255,255,255,.88); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.ded-avatar-none { font-size: 10.5px; color: rgba(255,255,255,.6); writing-mode: vertical-rl; }
.ded-stage-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  display: flex; flex-direction: column; gap: 8px; padding: 0 18px 16px; }
.ded-stage-options { display: flex; flex-direction: column; gap: 6px; max-height: 40%; overflow-y: auto; padding-right: 4px; }
.ded-opt-row { display: flex; gap: 6px; align-items: stretch; }
.ded-opt { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px;
  padding: 9px 13px; border-radius: var(--radius); background: rgba(255,255,255,.93);
  box-shadow: 0 2px 12px rgba(0,0,0,.16); transition: transform .1s ease, box-shadow .12s ease; }
.ded-opt:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,.22); }
.ded-opt:disabled { opacity: .6; }
.ded-opt-main .ded-opt-title { font-size: 14px; }
.ded-opt-head { display: flex; align-items: center; gap: 6px; }
.ded-opt-title { font-family: var(--serif); font-size: 13.5px; line-height: 1.6; color: var(--ink); }
.ded-opt-sub { font-size: 11px; color: var(--muted); line-height: 1.5; }
.ded-opt-refs { font-size: 10px; color: var(--meta); }
.ded-opt-veto { flex: 0 0 auto; font-size: 11px; color: rgba(255,255,255,.8); background: rgba(20,18,30,.4);
  border-radius: var(--radius); padding: 0 12px; backdrop-filter: blur(4px); }
.ded-opt-veto:hover { background: rgba(20,18,30,.62); }
.ded-custom { display: flex; gap: 6px; align-items: stretch; }
.ded-custom-input { flex: 1; min-height: 38px; max-height: 88px; resize: vertical; border: 0;
  border-radius: var(--radius); padding: 8px 12px; font-size: 12.5px; font-family: inherit;
  background: rgba(255,255,255,.92); box-shadow: 0 2px 12px rgba(0,0,0,.16); outline: none; }
.ded-custom .btn-primary { flex: 0 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,.2); }
/* 舞台内的主按钮统一深色半透明（.btn-primary 的浅底在画面上太扎眼） */
.ded-stage .ded-opt-main { background: rgba(255,255,255,.93); }
.ded-stage .ded-opt-veto, .ded-stage .btn-primary {
  background: var(--scene-overlay); color: var(--on-accent); border: 0; backdrop-filter: blur(6px); }
.ded-stage .ded-opt-veto:hover, .ded-stage .btn-primary:hover { background: rgba(20,18,30,.75); }
/* 对话框：半透明深色卡片浮在画面底部，像 galgame 的文本框 */
.ded-dialog { background: rgba(24, 22, 34, .82); backdrop-filter: blur(10px); border-radius: var(--radius-md);
  padding: 14px 18px 16px; box-shadow: 0 6px 28px rgba(0,0,0,.3); }
.ded-dialog-head { display: flex; align-items: baseline; gap: 8px; font-size: 10.5px; color: rgba(255,255,255,.6); margin-bottom: 7px; }
.ded-dialog-tip { margin-left: auto; opacity: .7; }
.ded-dialog-body { max-height: min(26vh, 220px); overflow-y: auto; }
.ded-dialog-text { font-family: var(--serif); font-size: 14.5px; line-height: 1.92; color: rgba(255,255,255,.95);
  white-space: pre-wrap; overflow-wrap: anywhere; }
.ded-dialog-caret { color: var(--accent); animation: blink 1s steps(1) infinite; }
.ded-dialog .warn-box { background: rgba(255,180,120,.16); color: var(--warn-on-dark); border-radius: var(--radius); padding: 6px 10px; font-size: 11.5px; margin-bottom: 8px; }
/* 工具区收成一行细线 */
.ded-toolbox { margin-bottom: 12px; }
.ded-toolbox > summary { cursor: pointer; font-size: 11.5px; color: var(--meta); padding: 6px 2px; list-style: none; }
.ded-toolbox > summary::-webkit-details-marker { display: none; }
.ded-toolbox > summary::marker { content: ''; }
.ded-toolbox > summary:hover { color: var(--ink-2); }
.ded-toolbox .ded-tools { margin: 8px 0 0; }
.ded-image-ops { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
/* 拆解知识化视图（OS-66）：fact 链的可读呈现 */
.fv-wrap { max-width: 880px; display: flex; flex-direction: column; gap: 14px; }
.fv-card { background: var(--surface-card); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-card); }
.fv-card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.fv-card-head h3 { margin: 0; font-size: 14px; }
.fv-card-head .sub { font-size: 11px; color: var(--meta); }
.fv-ch { padding: 9px 0; border-top: 1px dashed var(--hair); }
.fv-ch:first-of-type { border-top: 0; }
.fv-ch-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin-bottom: 4px; }
.fv-ch-no { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fv-tag { font-size: 10px; border-radius: var(--pill); padding: 1px 8px; background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink-2); }
.fv-tag.emo { background: var(--accent-soft); color: var(--accent); }
.fv-ch-n { margin-left: auto; font-size: 10px; color: var(--meta); font-variant-numeric: tabular-nums; }
.fv-ch-summary { margin: 0; font-size: 12.5px; line-height: 1.75; color: var(--ink-2); }
.fv-ch-summary.empty { color: var(--meta); }
.fv-slot { margin-bottom: 10px; }
.fv-slot h4 { margin: 0 0 4px; font-size: 12.5px; color: var(--ink-2); }
.fv-slot-row { display: grid; grid-template-columns: 90px minmax(0,1fr); gap: 8px; padding: 2px 0; font-size: 12px; }
.fv-slot-k { color: var(--meta); }
.fv-slot-v { color: var(--ink-2); line-height: 1.6; overflow-wrap: anywhere; }
.fv-causal-nodes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.fv-node { font-size: 11.5px; border-radius: var(--pill); padding: 2px 10px; background: var(--accent-soft); color: var(--ink-2); }
.fv-causal-edges { display: flex; flex-direction: column; gap: 3px; }
.fv-edge { font-size: 12px; color: var(--ink-2); line-height: 1.6; }
.fv-edge i { font-style: normal; color: var(--meta); padding: 0 4px; }
.fv-led-row { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 8px; padding: 3px 0; font-size: 12px; }
.fv-led-row b { color: var(--ink-2); }
.fv-led-row span { color: var(--muted); line-height: 1.6; }
.fv-led-block h5 { margin: 4px 0 2px; font-size: 11.5px; color: var(--meta); }
.ded-details { margin-top: 4px; }
.ded-details > summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 6px 2px; user-select: none; }
.ded-details[open] > summary { margin-bottom: 10px; }
.deduce-engine-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .deduce-engine-grid { grid-template-columns: minmax(0, 1fr); } }
/* 剧情树（OS-61 P3）：整宽 SVG 导图＋右上选中提示 */
.ded-tree-wrap { position: relative; }
.ded-tree-bar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.ded-tree-bar .sub { font-size: 11px; color: var(--meta); }
.ded-tree-host { width: 100%; height: min(62vh, 560px); min-height: 380px; background: var(--surface-card); border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; }
.ded-tree-empty { padding: 40px 24px; font-size: 13px; color: var(--muted); line-height: 1.8; }
.ded-tree-svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
.ded-tree-svg.dragging { cursor: grabbing; }
.ded-tree-lane { fill: transparent; }
.ded-tree-lane.alt { fill: color-mix(in srgb, var(--ink) 2.5%, transparent); }
.ded-tree-lane-label { font-size: 11px; fill: var(--meta); letter-spacing: .04em; }
.ded-tree-grid { stroke: var(--hair); stroke-width: 1; }
.ded-tree-tick { font-size: 10.5px; fill: var(--meta); font-variant-numeric: tabular-nums; }
.ded-tree-edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
.ded-tree-edge.fork { stroke: var(--meta); stroke-dasharray: 5 4; }
.ded-tree-node { cursor: pointer; outline: none; }
.ded-tree-node .core { fill: var(--muted); stroke: var(--bg); stroke-width: 2; transition: fill .12s ease; }
.ded-tree-node:hover .core, .ded-tree-node:focus-visible .core { fill: var(--ink); }
.ded-tree-node.current .core { fill: var(--accent); }
.ded-tree-node .ring { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: .55; }
.ded-tree-node .no { font-size: 10px; fill: var(--meta); font-variant-numeric: tabular-nums; }
.ded-tree-node .label { font-size: 11.5px; fill: var(--ink-2); }
.ded-tree-node.current .label { fill: var(--ink); font-weight: 600; }
.ded-tree-pick { position: absolute; top: 48px; right: 14px; z-index: 5; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 8px 12px; font-size: 12px; max-width: min(520px, 80%); }
.ded-tree-pick[hidden] { display: none; }
.ded-tree-pick-label { color: var(--ink-2); font-weight: 600; }
.ded-tree-pick .btn-primary, .ded-tree-pick .btn-ghost { padding: 5px 14px; font-size: 12px; }
.scene-card { border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--soft); }
.scene-card > div { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 8px; padding: 3px 0; font-size: 13px; }
.scene-card .k { color: var(--meta); font-size: 12px; }
.front-row { display: grid; grid-template-columns: minmax(0,1fr) 90px 40px; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 4px; }
.front-bar { height: 5px; background: var(--hair); border-radius: 999px; overflow: hidden; }
.front-bar > span { display: block; height: 100%; background: var(--accent); }
.cand-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-left: 3px solid var(--line); padding: 9px 12px; margin-bottom: 8px; background: var(--soft); border-radius: 0 var(--radius) var(--radius) 0; }
.cand-row.src-certain { border-left-color: var(--ink); }
.cand-row.src-fate { border-left-color: var(--accent); }
.cand-row.src-drama { border-left-color: var(--ok); }
.cand-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.cand-badge { font-size: 10px; border: 1px solid var(--line); border-radius: var(--pill); padding: 0 7px; align-self: flex-start; color: var(--muted); }
.cand-text { font-family: var(--serif); font-size: 14px; line-height: 1.7; }
.cand-trace { font-family: var(--mono); font-size: 11px; color: var(--meta); }
.cand-ops { display: flex; gap: 6px; flex: 0 0 auto; }

/* ── 色板（左下角浮层）──────────────────────────────────── */
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">O</span><span class="brand-name">OpenStory</span></div>
    <!-- 库切换器：logo 右侧，默认显示当前库，点击下方弹库面板 -->
    <div class="lib-switch" id="lib-switch">
      <button class="lib-switch-btn" id="lib-switch-btn" data-action="toggle-lib-switch" title="切换库">
        <span class="mark">库</span><span id="lib-switch-name">选择库</span><span class="caret">▾</span>
      </button>
      <div class="lib-switch-panel" id="lib-switch-panel"></div>
    </div>
    <span class="sp"></span>
    <!-- 设置：右上角总入口（Agent 运行时/套件/外观/数据目录） -->
    <button class="top-settings" data-go="settings" title="设置（运行时/套件/外观/数据目录）">
      <span class="gear-glyph">⚙</span>设置
    </button>
  </header>

  <div class="main">
    <!-- Agent 列（一等公民，OS-45 归位最左）：会话 JSONL 在 daemon 侧，凭据只存本机配置。
         小说/参考这些题材是右侧工作台里的模块，不占 Agent 的位置。 -->
    <aside class="agent-col">
      <div class="agent-head">
        <span class="agent-avatar">P</span><span class="agent-name">Pi-Agent</span>
        <span class="agent-model" id="agent-model-chip" hidden></span>
        <span class="agent-head-sp"></span>
        <!-- 会话列表（OS-31）：从横条药丸改成右上角下拉，标题栏只留一个带计数的按钮 -->
        <div class="agent-sess-dd" id="agent-sess-dd">
          <button class="agent-sess-btn" id="agent-sess-btn" data-action="toggle-agent-sessions" title="会话列表">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 3.5h11M2.5 8h11M2.5 12.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
            <span id="agent-sess-count">0</span>
          </button>
          <div class="agent-sess-panel" id="agent-sess-panel"></div>
        </div>
      </div>
      <div class="agent-current" id="agent-current"></div>
      <div id="agent-kb-chain"></div>
      <div class="agent-body" id="agent-thread">
        <div class="agent-empty">
          <strong>问剧情、要一段正文、改设定…</strong>
          回答可以转成「待确认卡」，采纳后才真正写进正文文件。
        </div>
      </div>
      <div class="agent-context" id="agent-context"></div>
      <div class="composer">
        <textarea id="agent-input" placeholder="先选一个库，再和 Agent 聊…" disabled></textarea>
        <!-- 工具行（OS-51）：风格/＋ 与发送键平级，靠左小按钮，不再占显眼位置 -->
        <div class="row">
          <div class="composer-tools">
            <button class="c-tool" id="agent-style-btn" data-action="toggle-style-menu" title="题材风格">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2.6c-3 0-5.4 2.3-5.4 5.2 0 1.7.9 2.6 2 3.4.6.4.9 1 .9 1.7v.5c0 .4.3.7.7.7h3.6c.4 0 .7-.3.7-.7v-.5c0-.7.3-1.3.9-1.7 1.1-.8 2-1.7 2-3.4C13.4 4.9 11 2.6 8 2.6z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.2 15h3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button class="c-tool" id="agent-plus-btn" data-action="toggle-plus-menu" title="引用文件 / 指令 / 技能">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </div>
          <span class="mode" id="agent-mode-chip" hidden>对话</span>
          <span class="mode" id="agent-lib-chip" hidden></span>
          <span class="sp"></span>
          <button class="send" id="agent-send" title="发送" data-action="agent-send" disabled>↑</button>
          <button class="send stop" id="agent-stop" title="停止" data-action="agent-stop" hidden>■</button>
        </div>
        <div class="composer-pop" id="agent-style-menu" hidden></div>
        <div class="composer-pop" id="agent-plus-menu" hidden></div>
      </div>
    </aside>

    <!-- 中栏：题材工作台（正文/参考/产物…都放这里） -->
    <main class="center" id="center">
      <div class="tabs" id="tabs"></div>
      <div class="content" id="view"><div class="loading">正在读取库清单…</div></div>
    </main>
  </div>
</div>

<!-- 弹层：Agent 设置 / 转待确认卡（内容由 app.js 注入） -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<!-- 单段分析结果（OS-37：右键一段 → 分析这一段） -->
<aside class="para-result" id="para-result"></aside>

<script src="./app.js" defer></script>
</body>
</html>
