<!doctype html>
<html lang="zh-CN" data-skin="coral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenStory · 工作台</title>
<style>
/* ── 风格包（OS-5：目录加载，本块只是无 JS 兜底的珊瑚默认）──────────
   真皮是 openstory/styles 目录下的 json（内置）＋本机 PinaxNext/openstory/styles 目录，
   工作台运行时注入 skin-style 样式块后置覆盖。 */
:root {
  --bg: #ffffff; --soft: #faf9f7; --warm: #fff6ef;
  --ink: #222222; --ink-2: #3d3a36; --muted: #6f6a63; --meta: #a39d94;
  --line: #e7e3dd; --hair: #f0ede8;
  --accent: #ff385c; --accent-hover: #e31c5f; --accent-active: #e00b41; --accent-soft: #fff1f3;
  --ok: #008a05; --danger: #c13515;
  --warn: #c48a00; --warn-ink: #a06a00; --warn-on-dark: #ffd7a8;
  --on-accent: #ffffff;
  --scene-deep: #2b2a4a; --scene-mid: #4a3d6b; --scene-far: #6b4f6b; --scene-overlay: rgba(20,18,30,.55);
  --radius: 10px; --radius-md: 14px; --radius-lg: 20px; --pill: 999px;
  --shadow: 0 8px 30px rgba(34,34,34,.08);
  /* 卡片与浮层的语义色/影（OS-49，照 OpenDesign 逆出的口径）：
     · --surface-card 是「比画布深一档的中性面」，从 ink 混进 bg 派生（不用偏暖的 --soft，
       否则珊瑚皮/墨皮会显脏）；同一 token 在夜间皮里自动变浅一档
     · 阴影基色用暖墨 1c1b1a（OD 口径），不用纯黑
     · 静息卡片只留 1px 级微影，浮起才加散影；容器（左右栏）本身不投影——影属于卡片 */
  --surface-card: color-mix(in srgb, var(--ink) 3%, var(--bg));
  --shadow-base: 28, 27, 26;
  --shadow-card: 0 1px 2px rgba(var(--shadow-base), .05), 0 1px 3px rgba(var(--shadow-base), .04);
  --shadow-card-hover: 0 2px 6px rgba(var(--shadow-base), .07), 0 1px 2px rgba(var(--shadow-base), .05);
  --shadow-float: 0 1px 2px rgba(var(--shadow-base), .04), 0 10px 28px -10px rgba(var(--shadow-base), .18);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --serif: "Noto Serif SC", "Songti SC", Georgia, serif;
  --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  --content-max: 1180px; --content-px: 40px;
}
* { box-sizing: border-box; }
/* 夜间皮阴影加深（浅色阴影在深底上不可见） */
html[data-skin="night"] {
  --shadow-base: 0, 0, 0;
  --shadow-card: 0 1px 2px rgba(var(--shadow-base), .38), 0 1px 3px rgba(var(--shadow-base), .3);
  --shadow-card-hover: 0 2px 8px rgba(var(--shadow-base), .46), 0 1px 3px rgba(var(--shadow-base), .32);
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; transition: background .2s cubic-bezier(.2,0,0,1); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

.app { height: 100vh; display: flex; flex-direction: column; }

/* ── 顶栏 ─────────────────────────────────────────────── */
.topbar { height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 12px; border-bottom: 1px solid var(--hair); }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; }
/* 库切换器（OS-12）：顶栏右上，与 Agent 设置平级 */
.lib-switch { position: relative; }
.lib-switch-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--pill); padding: 5px 12px; background: var(--bg); }
.lib-switch-btn:hover { border-color: var(--ink); }
.lib-switch-btn .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.lib-switch-btn #lib-switch-name { font-weight: 600; font-size: 13px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-switch-btn .caret { color: var(--meta); font-size: 10px; }
.lib-switch-panel { position: absolute; left: 0; top: calc(100% + 6px); width: 340px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 8px; display: none; z-index: 80; }
.lib-switch-panel.open { display: block; }
.lib-switch-panel .sw-lib { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 8px 10px; border-radius: var(--radius); text-align: left; }
.lib-switch-panel .sw-lib:hover { background: var(--soft); }
.lib-switch-panel .sw-lib.on { background: var(--accent-soft); }
.lib-switch-panel .sw-lib b { font-size: 13px; }
.lib-switch-panel .sw-lib .path { font-family: var(--mono); font-size: 11px; color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-switch-panel .divider { border-top: 1px solid var(--hair); margin: 6px 4px; }
.lib-switch-panel .ops { display: flex; gap: 6px; padding: 4px; flex-wrap: wrap; }
.lib-switch-panel .ops button { flex: 1; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; font-size: 12px; }
.lib-switch-panel .ops button:hover { border-color: var(--ink); }
.lib-switch-panel .empty { padding: 14px 10px; color: var(--muted); font-size: 12px; line-height: 1.7; text-align: center; }
.top-settings { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--pill); padding: 5px 14px; color: var(--muted); }
.top-settings:hover { border-color: var(--ink); color: var(--ink); }
.top-settings .gear-glyph { font-size: 13px; }
.pill { padding: 2px 10px; border: 1px solid var(--line); border-radius: var(--pill); font-size: 12px; color: var(--muted); }
.topbar .sp { flex: 1; }
.icon-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--soft); color: var(--ink); }
.gear { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.gear:hover { color: var(--ink); border-color: var(--ink); }

/* ── 主体：Agent 左列 ＋ 中栏 ───────────────────────────── */
.main { flex: 1; display: flex; min-height: 0; }

/* Agent 左列（OS-4：会话 JSONL＋流式对话＋待确认卡） */
.agent-col { width: 320px; flex: 0 0 320px; border-right: 1px solid var(--hair); display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
/* 题材工作面内部左栏（OS-45）：章节树 / 参考图谱 / 参考摘要。
   它属于「小说/参考」这类题材页自己的布局，属于二等公民的内部结构；
   Agent 始终在最外层最左，不参与题材页的布局。 */
/* 类纸（OS-47）：左右侧模块＝无边框软卡片，堆叠留缝，不画框线
   OS-48：左栏是**浮层附庸**，绝对定位脱离正文流——正文纸面永远按窗口居中，
   开/关左栏都不动正文一个像素。 */
/* 类纸左右侧模块（OS-47/49）：栏是透明容器，不投影；每张卡自己带极轻底影 */
.ref-col { position: absolute; left: 0; top: 0; bottom: 0; z-index: 42; width: 248px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: transparent; overflow-y: auto; padding: 10px 12px 12px; }
.ref-col:empty { display: none; }
.ref-col.collapsed-all { display: none; }
.ref-mod { flex: 0 0 auto; background: var(--surface-card); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); transition: box-shadow .16s ease; }
.ref-mod:hover { box-shadow: var(--shadow-card-hover); }
/* 卡片头统一（OS-48）：标题 + 计数 + 折叠 + 关闭 ×，左三卡与右栏分析头同构 */
.ref-mod-head { display: flex; align-items: center; gap: 2px; padding: 4px 6px 4px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); user-select: none; }
.ref-mod-head:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.rm-toggle { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; padding: 5px 0; text-align: left; font: inherit; color: inherit; }
.ref-mod .rm-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-mod .rm-chev { color: var(--meta); font-size: 11px; transition: transform .14s ease; transform: rotate(-90deg); }
.ref-mod[data-open="1"] .rm-chev { transform: rotate(90deg); }
.ref-mod .rm-badge { font-size: 10px; font-weight: 400; color: var(--meta); padding: 0 2px; font-variant-numeric: tabular-nums; }
/* 卡片统一关闭按钮（OS-48）：与右栏分析面板的 × 同尺寸同悬停 */
.rm-x { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--meta); font-size: 14px; line-height: 1; flex: 0 0 auto; }
.rm-x:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }
.ref-mod-body { padding: 0 10px 12px; font-size: 12px; color: var(--muted); }
/* 章节树（两级：卷/章） */
.ct-vol { font-size: 11px; color: var(--meta); padding: 6px 4px 2px; letter-spacing: .04em; }
.ct-row { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 6px; width: 100%; padding: 4px 6px; border-radius: var(--radius); text-align: left; align-items: baseline; }
.ct-row:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.ct-row.on { background: var(--accent-soft); color: var(--ink); }
.ct-row .no { font-family: var(--mono); font-size: 10px; color: var(--meta); }
.ct-row .tt { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 参考图谱画布 */
.graph-box { position: relative; width: 100%; height: 190px; border-radius: var(--radius); background: transparent; overflow: hidden; }
.graph-box canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.graph-box.dragging canvas { cursor: grabbing; }
.graph-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; font-size: 10px; color: var(--meta); }
.graph-legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 3px; vertical-align: 1px; }
.graph-hint { margin-top: 4px; font-size: 10px; color: var(--meta); }
/* 参考摘要 */
.ref-summary { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; font-size: 12px; color: var(--ink-2); max-height: 260px; overflow-y: auto; }
.ref-summary-ops { display: flex; gap: 6px; margin-top: 6px; }
.ref-summary-ops button { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: var(--pill); padding: 1px 10px; }
.ref-summary-ops button:hover { border-color: var(--ink); color: var(--ink); }
/* 参考页（OS-48）：侧栏导航 / 主区（视图制：笔记 / 关系图谱）/ 反链 */
.ref-page { display: flex; flex-direction: column; gap: 12px; }
.ref-toolbar { display: flex; align-items: center; gap: 10px; }
.ref-toolbar h1 { margin: 0; font-size: 22px; }
.ref-toolbar .sp { flex: 1; }
.ok-note { font-size: 12px; color: var(--ok); background: var(--soft); border-radius: var(--radius); padding: 8px 12px; }
.ref-grid { display: grid; grid-template-columns: 236px minmax(0,1fr); gap: 12px; align-items: start; }
@media (max-width: 1280px) { .ref-grid { grid-template-columns: 212px minmax(0,1fr); } }
.ref-sidenav { border: 0; border-radius: var(--radius-md); background: var(--soft); padding: 10px 8px; max-height: calc(100vh - 230px); overflow-y: auto; }
/* 侧栏导航（OS-51）：视图 / 按标签筛选（三级折叠树） / 笔记（主体） */
.ref-nav { display: flex; flex-direction: column; gap: 10px; }
.ref-nav .search { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 10px; font-size: 12px; background: var(--bg); }
.ref-nav .search:focus { outline: none; border-color: var(--ink-2); }
.nav-group { display: flex; flex-direction: column; gap: 1px; }
.nav-group.grow { min-height: 120px; }
.nav-group-label { font-size: 10.5px; color: var(--meta); letter-spacing: .05em; padding: 2px 6px 4px; }
/* 侧栏行（OS-54 重做）：三级用「缩进 + 字重 + 字号 + 颜色」四个维度同时拉开，
   不再只靠一个灰字——作者指出二级/三级区分度不够、加粗关系混乱 */
.nav-row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 8px; border-radius: var(--radius); text-align: left; font-size: 12px; color: var(--muted); }
.nav-row:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.nav-row.on { background: var(--accent-soft); color: var(--ink); }
/* 一级：视图行——最重 */
.nav-row.view { padding: 6px 8px; }
.nav-row.view span { font-weight: 700; font-size: 13px; color: var(--ink-2); }
.nav-row.on.view span { color: var(--ink); }
/* 二级：标签枝干——中重，行高更高；深层标签字重回落 */
.nav-row.tag { padding: 5px 8px; font-weight: 600; font-size: 12.5px; color: var(--ink-2); }
.tag-branch .tag-branch > summary .nav-row.tag,
.tag-branch .tag-branch .nav-row.tag { font-weight: 500; font-size: 12px; color: var(--muted); }
.nav-row.tag .tag-name::before { content: '#'; margin-right: 3px; color: var(--meta); font-weight: 400; }
/* 三级：笔记叶——最轻，缩进最深，前置小圆点 */
.nav-row.note { padding: 3px 8px 3px 10px; font-weight: 400; font-size: 11.5px; color: var(--muted); }
.nav-row.note .tag-name::before { content: '·'; margin-right: 5px; color: var(--meta); font-weight: 700; }
.nav-row.on .tag-name { font-weight: 600; }
.nav-row.tag-empty { opacity: .55; }
.nav-row.tag-empty:hover { opacity: .85; }
.nav-row .tag-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count { font-size: 10px; color: var(--meta); font-variant-numeric: tabular-nums; }
.nav-row.note .nav-count { opacity: .8; }
.nav-empty { font-size: 11px; color: var(--meta); padding: 4px 8px; margin: 0; line-height: 1.7; }
/* 标签三级树（OS-54）：每级 18px 缩进＋虚线引导，层级一眼可辨 */
.tag-branch, .tag-leaf { margin-left: calc(var(--depth, 0) * 18px); }
.tag-branch:not(:first-child) { border-top: 1px dashed transparent; }
.tag-branch > summary { list-style: none; cursor: pointer; position: relative; }
.tag-branch > summary::-webkit-details-marker { display: none; }
.tag-branch > summary .nav-row { width: calc(100% - 20px); }
.tw-chev { position: absolute; right: 8px; top: 9px; width: 7px; height: 7px; border-right: 1.4px solid var(--meta); border-bottom: 1.4px solid var(--meta); transform: rotate(-45deg); transition: transform .12s ease; }
.tag-branch[open] > summary .tw-chev { transform: rotate(45deg); }
.nav-row.on .tag-name { font-weight: 600; }
.tag-desc-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-left: 4px; vertical-align: 2px; }
/* 习惯表单（OS-57）：描述性自定义表单——正向＋负向词条 */
.habits-form { max-width: 720px; display: flex; flex-direction: column; gap: 14px; }
.habits-form .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.habits-form .field .count { font-weight: 400; color: var(--meta); }
.habits-form textarea.habit-list { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; font-size: 12.5px; background: var(--bg); resize: vertical; font-family: inherit; }
.habits-form textarea.habit-list:focus { outline: none; border-color: var(--ink-2); }
.habits-form input.text, .habits-form select.select { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; font-size: 13px; background: var(--bg); }
.habits-form .ops { display: flex; align-items: center; gap: 10px; }
/* 笔记视图未选中态（OS-53b）：给出路而不是一句提示 */
.ref-empty-lead { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 40px 20px; }
.ref-empty-lead .rem { margin: 0; font-size: 13px; color: var(--muted); }
/* 图谱视图（OS-51）：大画布＋节点信息卡＋标签筛选行 */
.ref-graph { display: flex; flex-direction: column; gap: 8px; }
.ref-graph-meta { font-size: 12px; color: var(--meta); }
.ref-graph-tagbar { display: flex; flex-wrap: wrap; gap: 4px; }
.graph-box.big { height: calc(100vh - 360px); min-height: 380px; border-radius: var(--radius-md); }
/* 节点信息卡：画布右上角浮层——类型/标签/简介＋「打开详情」（OS-51 作者口径） */
.ref-node-card { position: absolute; top: 10px; right: 10px; width: 244px; background: var(--bg); border-radius: var(--radius-md); box-shadow: 0 10px 28px -10px rgba(var(--shadow-base, 28,27,26), .3), 0 2px 6px rgba(var(--shadow-base, 28,27,26), .1); padding: 12px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.ref-node-card .rn-head { display: flex; align-items: center; gap: 7px; min-width: 0; }
.ref-node-card .rn-head b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rn-kind { font-size: 10px; border-radius: var(--pill); padding: 1px 8px; background: var(--soft); color: var(--muted); flex: 0 0 auto; }
.rn-kind.reference { background: var(--accent-soft); color: var(--accent); }
.rn-kind.tag { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn-ink); }
.rn-kind.artifact { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.rn-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.rn-tags .pill { font-size: 10px; padding: 1px 8px; }
.rn-excerpt { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.rn-ops { display: flex; align-items: center; gap: 6px; }
.rn-ops .sp { flex: 1; }
.rn-deg { font-size: 10.5px; color: var(--meta); }
.ref-node-card .btn-ghost { font-size: 12px; }
/* 小图信息卡（正文页左栏，OS-52）：画布下方内嵌全宽，不做浮层 */
.ref-node-card.inline { position: static; width: 100%; box-shadow: none; background: transparent; padding: 8px 2px 2px; }
/* 详情页（OS-51，Wiki 式分层）：上半＝左简介＋右小图谱；下半＝详情；最下＝关联说明 */
.ref-detail { display: flex; flex-direction: column; gap: 14px; }
.ref-detail-head { display: flex; align-items: center; gap: 10px; }
.ref-detail-head h2 { margin: 0; font-size: 20px; }
.ref-detail-head .sp { flex: 1; }
.ref-detail-path { font-size: 11px; color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-detail-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 46%); gap: 12px; align-items: stretch; }
@media (max-width: 1100px) { .ref-detail-top { grid-template-columns: minmax(0, 1fr); } }
.ref-detail-brief { background: var(--bg); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-card, 0 1px 2px rgba(28,27,26,.05)); display: flex; flex-direction: column; gap: 10px; }
.brief-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.brief-tags .pill { font-size: 11px; }
.brief-text { margin: 0; font-size: 13px; line-height: 1.8; color: var(--ink-2); }
.ref-detail-graph { background: var(--bg); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-card, 0 1px 2px rgba(28,27,26,.05)); display: flex; flex-direction: column; gap: 8px; }
.rd-graph-head { font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
.rd-graph-head span { font-weight: 400; font-size: 10.5px; color: var(--meta); }
.graph-box.detail { height: 240px; flex: 1; min-height: 200px; }
.ref-detail-backlinks { border-top: 1px solid var(--hair); padding-top: 12px; }
.ref-detail-backlinks h4 { margin: 0 0 8px; font-size: 13px; }
.ref-detail-backlinks .bl-row { max-width: 720px; }

.bub-foot { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
