.settings-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: var(--ui-gap-xl); align-items: start; }
@media (max-width: 900px) { .settings-layout { grid-template-columns: minmax(0, 1fr); } }
.settings-nav { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--bg); overflow: hidden; position: sticky; top: 12px; }
.settings-nav-item { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); width: 100%; padding: var(--ui-gap-md) var(--ui-gap-lg); text-align: left; border-bottom: 1px solid var(--hair); }
.settings-nav-item:last-child { border-bottom: 0; }
.settings-nav-item:hover { background: var(--soft); }
.settings-nav-item.on { background: var(--accent-soft); border-left: 2px solid var(--accent); padding-left: var(--ui-gap-md); }
.settings-nav-item b { font-size: var(--ui-fs-md); }
.settings-nav-item span { font-size: var(--ui-fs-xs); color: var(--meta); }

/* ── 套件详情头（OS-16：块级排版，治换行烂）＋page 模式 iframe ── */
.suite-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ui-gap-sm); margin-bottom: var(--ui-gap-xs); }
.suite-head .suite-name { font-size: var(--ui-fs-lg); font-weight: 700; }
.suite-head .state-chip { margin-left: auto; }
.bskill-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ui-gap-sm); padding: var(--ui-gap-xs) var(--ui-gap-md); border: 1px solid var(--line, #ddd); border-radius: 8px; margin-top: var(--ui-gap-xs); }
.bskill-row b { font-size: var(--ui-fs-md); }
.bskill-row .sub { flex: 1; min-width: 200px; }
.pill.sm { font-size: var(--ui-fs-xs); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm); }
.suite-frame { width: 100%; height: 480px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--bg); }
.cap-chips .pill { margin-right: var(--ui-gap-2xs); }

/* ── 沉浸式文档纸面（OS-21）────────────────────────────── */
:root {
  --doc-font-size: 17px; --doc-line-height: 1.9; --doc-para-gap: 1em; --doc-indent: 2em;
  --doc-max: 720px;
  /* OS-114 纸面可读下限：窄面板/右栏停靠时也不许把正文压到这条线以下 */
  --doc-read-min: 320px;
}

/* ══════════════════════════════════════════════════════════════════
   OS-91 全局字号体系（作者裁定：前端 CSS 必须全局化，明确档位）
   ──────────────────────────────────────────────────────────────────
   两条轨道，互不干扰：
     【正文轨】--doc-*  —— 只服务阅读/写作的纸面正文（衬线、行高 1.9）
                          档位 5 级，由「项目级主题设置」覆盖
     【功能轨】--ui-*   —— 所有界面元素（按钮/表单/卡片/标签/表格）
                          档位 7 级（2xs…2xl），由「项目级主题设置」整体缩放

   规范（写新样式时必须遵守）：
     1. 功能界面字号**只准**用 var(--ui-fs-*)，禁止裸写 px
     2. 正文纸面字号**只准**用 var(--doc-font-size)
     3. 两者不混用：功能模块里不要出现 --doc-*，正文里不要出现 --ui-fs-*
   ══════════════════════════════════════════════════════════════════ */
:root {
  /* 功能轨基准（medium 档＝14px，是界面元素的默认尺寸） */
  --ui-scale: 1;
  --ui-fs-2xs: calc(10px * var(--ui-scale));   /* 行内徽标、极次要标注 */
  --ui-fs-xs:  calc(11px * var(--ui-scale));   /* 辅助说明、表格脚注 */
  --ui-fs-sm:  calc(12px * var(--ui-scale));   /* 卡片副标、元信息 */
  --ui-fs-md:  calc(13px * var(--ui-scale));   /* 正文类控件（输入框、列表项） */
  --ui-fs-base:calc(14px * var(--ui-scale));   /* 界面基准（按钮、导航） */
  --ui-fs-lg:  calc(16px * var(--ui-scale));   /* 小标题、卡片标题 */
  --ui-fs-xl:  calc(18px * var(--ui-scale));   /* 区块标题 */
  --ui-fs-2xl: calc(22px * var(--ui-scale));   /* 页面主标题 */

  /* 行高（功能轨固定比例，不随字号档缩放） */
  --ui-lh-tight: 1.35;
  --ui-lh-normal: 1.6;
  --ui-lh-loose: 1.75;

  /* 功能轨控件尺寸（跟着字号档走，保证比例一致） */
  --ui-ctl-h: calc(32px * var(--ui-scale));    /* 按钮/输入框高度 */
  --ui-ctl-px: calc(12px * var(--ui-scale));   /* 控件横向内边距 */
  --ui-row-py: calc(6px * var(--ui-scale));    /* 列表行纵向内边距 */

  /* ── 间距刻度（OS-94）─────────────────────────────────────────
     作者裁定：「规范性要在统一的 UI 里管理，迁移工作肯定还要做。」
     此前 482 处字号已令牌化，但间距还是随手写（2/4/6/8/9/10/12/14/16/18/24…）。
     这里定 8 级刻度，全部跟随 --ui-scale：
       3xs=2  2xs=4  xs=6  sm=8  md=12  lg=16  xl=20  2xl=24
     规则：组件内部用刻度；页面级栅格允许 calc(Npx * var(--ui-scale))。
     检查口径：全站 `gap|padding|margin` 的裸 px 数应持续下降，新增一律用 --ui-gap-*。 */
  --ui-gap-3xs: calc(2px * var(--ui-scale));
  --ui-gap-2xs: calc(4px * var(--ui-scale));
  --ui-gap-xs:  calc(6px * var(--ui-scale));
  --ui-gap-sm:  calc(8px * var(--ui-scale));
  --ui-gap-md:  calc(12px * var(--ui-scale));
  --ui-gap-lg:  calc(16px * var(--ui-scale));
  --ui-gap-xl:  calc(20px * var(--ui-scale));
  --ui-gap-2xl: calc(24px * var(--ui-scale));
}

/* 字号档位：只改 --ui-scale 与 --doc-font-size 两个值，全站生效 */
:root[data-fs="compact"]     { --ui-scale: 0.92; }
:root[data-fs="comfortable"] { --ui-scale: 1; }
:root[data-fs="large"]       { --ui-scale: 1.08; }
:root[data-fs="xlarge"]      { --ui-scale: 1.18; }

/* 正文纸面档位（独立于功能轨；5 级，只影响阅读面） */
:root[data-doc-fs="s"]  { --doc-font-size: 15px; --doc-line-height: 1.85; }
:root[data-doc-fs="m"]  { --doc-font-size: 17px; --doc-line-height: 1.9; }
:root[data-doc-fs="l"]  { --doc-font-size: 19px; --doc-line-height: 1.95; }
:root[data-doc-fs="xl"] { --doc-font-size: 21px; --doc-line-height: 2; }
:root[data-doc-fs="2xl"]{ --doc-font-size: 24px; --doc-line-height: 2.05; }
.doc-head-immersive { max-width: var(--doc-max); margin: 0 auto 8px; }
.doc-head-immersive .docline { display: flex; align-items: center; gap: var(--ui-gap-sm); font-size: var(--ui-fs-sm); color: var(--meta); margin-bottom: var(--ui-gap-md); flex-wrap: wrap; }
.doc-head-immersive .docline .sp { flex: 1; }
.doc-head-immersive .chap-no { color: var(--accent); font-weight: 600; }
.doc-head-immersive .docline-sep { color: var(--line); }
.doc-head-immersive .doc-title { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 0 0 6px; }
.doc-head-immersive .doc-actions { display: flex; align-items: center; gap: var(--ui-gap-sm); margin: var(--ui-gap-2xs) 0 8px; flex-wrap: wrap; }
.doc-head-immersive .doc-actions .sp { flex: 1; }
.doc-head-immersive .doc-actions .doc-save { padding: var(--ui-gap-2xs) var(--ui-gap-lg); font-size: var(--ui-fs-sm); }
.doc-head-immersive .doc-link[disabled] { opacity: .4; cursor: default; }
.doc-head-immersive .doc-mini-meta { display: flex; gap: var(--ui-gap-md); font-size: var(--ui-fs-sm); color: var(--muted); min-height: 16px; }
.doc-link { font-size: var(--ui-fs-sm); color: var(--muted); padding: var(--ui-gap-3xs) var(--ui-gap-sm); border: 1px solid var(--line); border-radius: var(--pill); }
.doc-link:hover { color: var(--ink); border-color: var(--ink); }
.doc-paper { max-width: var(--doc-max); margin: 0 auto; font-family: var(--serif); font-size: var(--doc-font-size); line-height: var(--doc-line-height); color: var(--ink-2); }
.doc-paper p { margin: 0 0 var(--doc-para-gap); text-indent: var(--doc-indent); }
.doc-paper h1, .doc-paper h2, .doc-paper h3, .doc-paper h4 { font-family: var(--serif); text-indent: 0; }
.doc-paper blockquote { margin: 0 0 var(--doc-para-gap); padding-left: 14px; border-left: 2px solid var(--line); color: var(--muted); }
.doc-paper ul, .doc-paper ol { margin: 0 0 var(--doc-para-gap); padding-left: 1.6em; }
.doc-paper code { font-family: var(--mono); font-size: .9em; background: var(--soft); padding: 1px 5px; border-radius: 4px; text-indent: 0; }
.doc-paper pre { background: var(--soft); border: 1px solid var(--hair); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; }
.doc-paper pre code { background: none; padding: 0; }
.doc-paper hr { border: 0; border-top: 1px solid var(--hair); margin: 24px 0; }
.doc-paper a { color: var(--accent); }
.doc-paper [data-para] { cursor: text; border-radius: 4px; }
.doc-paper [data-para]:hover { background: var(--soft); }
html[data-doc-auto-gap="off"] .doc-paper p { margin-bottom: 0; }
/* 正文工作台（OS-33）：页头吸顶；正文与右栏各自独立滚动 */
.content.content-locked { overflow: hidden; padding: 0; display: flex; flex-direction: column; }
.doc-workspace-sticky { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.doc-workspace-sticky .doc-head-immersive {
  flex: 0 0 auto; max-width: none; margin: 0;
  padding: var(--ui-gap-md) calc(var(--content-px, 34px) + 4px) 10px;
  border-bottom: 1px solid var(--hair);
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(8px);
  z-index: 30;
}
.doc-workspace-sticky .doc-head-immersive .docline { max-width: var(--doc-max); margin: 0 auto 8px; }
.doc-workspace-sticky .doc-head-immersive .doc-title-row { max-width: var(--doc-max); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.doc-workspace-sticky .doc-head-immersive .doc-title { flex: 1; min-width: 0; margin: 0; }
.doc-workspace-sticky .doc-head-immersive .doc-actions { margin: 0; flex: 0 0 auto; }
.doc-workspace-sticky .doc-head-immersive .doc-mini-meta { max-width: var(--doc-max); margin: 4px auto 0; }
.doc-workspace-sticky .chapter-grid { flex: 1; min-height: 0; display: block; position: relative; }
/* 题材页通用布局（OS-45）：左栏（章节树/图谱/摘要）＋ 题材主区 */
.topic-workspace { flex: 1; min-height: 0; display: flex; }
.topic-main { flex: 1; min-width: 0; overflow-y: auto; padding: calc(22px * var(--ui-scale)) var(--content-px, 34px) 60px; }
/* 正文滚动区占满整格（OS-48）：左右两栏都是绝对定位浮层，纸面宽度与位置只受窗口影响，
   开关任何一栏都不会动正文一像素——这是「附庸不挤占正文」的落地。 */
.doc-workspace-sticky .doc-scroll { position: absolute; inset: 0; overflow-y: auto; padding: calc(22px * var(--ui-scale)) calc(var(--content-px, 34px) + 4px) 60px; }
/* 浮层让位（OS-48 原设计已退役）：
   旧方案靠「窄窗口自动收窄纸面」避免遮挡，但窗口 ≥1500 时纸面用默认 720px，
   而左右浮层实占 ~580px —— 正文被分析面板压住（作者实测截图）。
   OS-88 改为**结构性让位**：哪一侧浮层打开，正文滚动区就补对应内边距，
   纸面永远居中落在剩余空间里，不依赖窗口宽度断点。 */
.doc-workspace-sticky.has-refcol .doc-scroll { padding-left: calc(248px + var(--content-px, 34px)); }
.doc-workspace-sticky.has-analyze .doc-scroll { padding-right: calc(300px + var(--content-px, 34px)); }
/* 左右浮层同时打开且窗口不够宽时的兜底：纸面收窄到可读下限之上，宁可窄不重叠。
   OS-114：下限用 max() 焊死——旧式 calc(100vw - 640px) 在 675px 右栏里只剩 35px，
   正文会一字一行（作者实测截图），这是窄面板适配的第一条硬约束。 */
@media (max-width: 1180px) and (min-width: 1001px) {
  :root { --doc-max: min(720px, max(var(--doc-read-min), calc(100vw - 640px))); }
}

/* ══ OS-114 窄面板 / 嵌入适配约束（作者口径：「前端适配要加一些约束」）═════
   三条规则，全部按宽度断点落地（独立浏览器窄窗口同样生效），不针对某个具体面板：
   ① 纸面可读下限 --doc-read-min（320px）：--doc-max 不许再往下缩；实在放不下时
      让 .doc-scroll 横向滚，禁止把正文压成一字一行。
   ② ≤1000px：左右浮层不再用内边距「让位」（248px ＋ 300px 同时让位会把 675px
      面板的正文挤到几十像素）——回到纯覆盖抽屉，用页头「世界书 / 分析本章」
      开合；≥1001px 才保留 OS-88 的结构性让位。
   ③ 窄面板降档：--content-px 16px（≤720px 再降到 12px）；侧栏抽屉按 72vw~86vw 收；
      页签只横滚不换行；页头标题降一档，避免窄栏里挤爆。 */
@media (max-width: 1000px) {
  :root {
    --content-px: 16px;
    --doc-max: min(720px, max(var(--doc-read-min), calc(100vw - 96px)));
  }
  .doc-workspace-sticky.has-refcol .doc-scroll,
  .doc-workspace-sticky.has-analyze .doc-scroll {
    padding-left: calc(var(--content-px, 16px) + 4px);
    padding-right: calc(var(--content-px, 16px) + 4px);
  }
  /* 兜底：连 320px 都放不下时允许横向滚，别把字挤成竖排 */
  .doc-workspace-sticky .doc-scroll { overflow-x: auto; }
  /* 窄面板下世界书左栏默认收起（抽屉），点页头「世界书」才盖出来 */
  .doc-workspace-sticky.is-narrow-ref-closed .ref-col { display: none; }
  .doc-workspace-sticky .ref-col { width: min(248px, 78vw); }
  .doc-workspace-sticky .analyze-panel { width: min(300px, 86vw); }
  /* 抽屉态：浮层加实底＋边线/影，盖住正文时不再和正文文字叠着看 */
  .doc-workspace-sticky .ref-col,
  .doc-workspace-sticky .analyze-panel {
    background: var(--bg);
    box-shadow: var(--shadow-float);
  }
  .doc-workspace-sticky .ref-col { border-right: 1px solid var(--hair); }
  .doc-workspace-sticky .analyze-panel { border-left: 1px solid var(--hair); }
  .sc-side { width: min(236px, 72vw); }
  .tabs { padding: 0 6px; }
  .tabs .tab { padding: calc(var(--ui-gap-sm) + 2px) var(--ui-gap-md) var(--ui-gap-sm); }
}
@media (max-width: 720px) {
  :root { --content-px: 12px; }
  .tabs { height: 40px; flex-basis: 40px; padding: 0 4px; }
  .tabs .tab { padding: calc(var(--ui-gap-sm) + 1px) var(--ui-gap-sm) var(--ui-gap-sm); }
  .doc-workspace-sticky .doc-head-immersive {
    padding-left: calc(var(--content-px, 12px) + 4px);
    padding-right: calc(var(--content-px, 12px) + 4px);
  }
  .doc-head-immersive .doc-title { font-size: 20px; }
}
.doc-block { outline: none; border-radius: 4px; margin: 0 0 var(--doc-para-gap); padding: 2px 4px; margin-left: -4px; margin-right: -4px; }
.doc-block:hover { background: var(--soft); }
.doc-block:focus { background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); }
.doc-block:focus p { text-indent: var(--doc-indent); }
.doc-block > *:first-child { margin-top: 0; }
.doc-block > *:last-child { margin-bottom: 0; }
.doc-block p { margin: 0; }
html[data-doc-auto-gap="off"] .doc-block { margin-bottom: 0; }
.doc-icon { width: 26px; height: 26px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.doc-drawer-btn { width: 26px; height: 26px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.doc-drawer-btn[hidden] { display: none; }
.doc-icon svg, .doc-drawer-btn svg { display: block; }
.doc-drawer-btn:hover, .doc-drawer-btn.on { background: var(--soft); color: var(--ink); }
.doc-icon:hover { background: var(--soft); color: var(--ink); }
.doc-autosave { font-size: var(--ui-fs-xs); color: var(--meta); }
.doc-editor { width: 100%; min-height: calc(100vh - 260px); border: 0; outline: none; background: transparent; resize: none; padding: 0; font-family: var(--serif); font-size: var(--doc-font-size); line-height: var(--doc-line-height); color: var(--ink-2); }
.doc-editor:focus { outline: none; }
.doc-workspace .chapter-editor-col .toolbar { max-width: var(--doc-max); margin: 0 auto 10px; }

/* ── 运行时货架分组（OS-18）─────────────────────────────── */
.runtime-group { margin-bottom: var(--ui-gap-lg); }
.runtime-group-head { font-size: var(--ui-fs-sm); color: var(--meta); font-weight: 600; margin: 0 0 8px; letter-spacing: .04em; }
.big-opt .rt-status { font-size: var(--ui-fs-2xs); border-radius: var(--pill); padding: 0 7px; margin-left: var(--ui-gap-xs); border: 1px solid var(--line); color: var(--meta); font-weight: 400; }
.big-opt .rt-status.ready, .big-opt .rt-status.running { color: var(--ok); border-color: var(--ok); }
.big-opt .rt-status.unconfigured, .big-opt .rt-status.idle { color: var(--meta); }
.big-opt .rt-status.missing { color: var(--danger); border-color: var(--danger); }
.big-opt.is-missing { opacity: .7; }
.rt-fix { margin-top: var(--ui-gap-sm); border: 1px solid var(--accent); color: var(--accent); border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-md); font-size: var(--ui-fs-xs); text-align: center; cursor: pointer; }
.rt-fix:hover { background: var(--accent-soft); }

/* ── 设置 · 模型与能力（S4）：四张配置卡＋probe 徽标 ─────────────── */
.cfg-card { border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--ui-gap-lg) var(--ui-gap-xl); margin-bottom: var(--ui-gap-lg); background: var(--bg); }
/* OS-74：生图后端切换的两个表单块（OpenAI 兼容 / ComfyUI），hidden 时不占位 */
/* OS-81 修（作者批评「简介和下面的介绍隔了这么长一截」）：
   卡片浮在右侧（float），摘要+详情在左侧流动——卡片结束正文自然变全宽，
   不再用 grid 行（右栏比摘要高时会撑出一大截空白）。 */
.ref-flow { position: relative; }
.ref-side-cards { float: right; width: min(40%, 340px); margin: var(--ui-gap-3xs) 0 14px 22px; display: flex; flex-direction: column; gap: var(--ui-gap-md); }
.ref-img-slot { background: var(--surface-card); border-radius: var(--radius-md); padding: var(--ui-gap-md) var(--ui-gap-md) var(--ui-gap-md); box-shadow: var(--shadow-card); }
.ref-slot-head { display: flex; align-items: baseline; gap: var(--ui-gap-xs); font-size: var(--ui-fs-sm); font-weight: 600; color: var(--ink-2); margin-bottom: var(--ui-gap-sm); }
.ref-slot-n { font-size: var(--ui-fs-xs); color: var(--meta); font-weight: 400; }
.ref-slot-cover { border-radius: var(--radius); overflow: hidden; background: var(--soft); }
.ref-slot-cover img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.ref-slot-thumbs { display: flex; gap: var(--ui-gap-2xs); margin-top: var(--ui-gap-xs); overflow-x: auto; scrollbar-width: none; }
.ref-slot-thumbs::-webkit-scrollbar { height: 0; }
.ref-slot-thumbs img { width: 46px; height: 46px; object-fit: cover; border-radius: var(--radius-sm); flex: 0 0 auto; }
.ref-slot-ops { margin-top: var(--ui-gap-sm); }
.ref-slot-gen { font-size: var(--ui-fs-sm); color: var(--ink-2); background: var(--bg); border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-md); box-shadow: var(--shadow-card); }
.ref-slot-gen:hover { color: var(--accent); }
.ref-slot-empty-body { display: flex; flex-direction: column; align-items: flex-start; gap: var(--ui-gap-xs); padding: var(--ui-gap-2xs) 0 2px; }
.ref-graph-slot { background: var(--surface-card); border-radius: var(--radius-md); padding: var(--ui-gap-md) var(--ui-gap-md) var(--ui-gap-md); box-shadow: var(--shadow-card); }
.ref-graph-slot .graph-box.detail { height: 220px; }
.ref-flow .brief-text { font-family: var(--serif); font-size: var(--ui-fs-base); line-height: 1.95; color: var(--ink-2); margin: 0 0 14px; }
.ref-flow .ref-doc { clear: none; }

/* OS-80：全局后台任务中心悬浮球（右下角，跨插件共用）
   作者口径：所有插件的长任务都该在一个地方看进度，切走页面不丢状态。 */
#job-ball-host { position: fixed; right: 18px; bottom: 18px; z-index: 200; }
.job-ball.idle { opacity: .42; transition: opacity .18s; }
.job-ball.idle:hover { opacity: 1; }
.job-ball-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: var(--ui-gap-sm); }
.job-ball { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg); box-shadow: var(--shadow-float); border: 1px solid var(--hair); color: var(--ink-2); transition: transform .12s ease, box-shadow .12s ease; }
.job-ball:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(var(--shadow-base), .16); }
.job-ball.busy { border-color: var(--accent); color: var(--accent); }
.jb-ic { font-size: var(--ui-fs-lg); line-height: 1; }
.jb-count { position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: var(--pill);
  background: var(--accent); color: var(--on-accent); font-size: var(--ui-fs-xs); font-weight: 700; display: grid; place-items: center; }
.job-panel { width: 380px; max-height: 60vh; overflow-y: auto; background: var(--bg); border-radius: var(--radius-md);
  box-shadow: var(--shadow-float); border: 1px solid var(--hair); }
.jb-head { display: flex; align-items: baseline; gap: var(--ui-gap-sm); padding: var(--ui-gap-md) calc(13px * var(--ui-scale)); border-bottom: 1px solid var(--hair); position: sticky; top: 0; background: var(--bg); }
.jb-head b { font-size: var(--ui-fs-md); }
.jb-sub { font-size: var(--ui-fs-xs); color: var(--meta); }
.jb-clear { margin-left: auto; font-size: var(--ui-fs-xs); color: var(--muted); padding: var(--ui-gap-3xs) var(--ui-gap-sm); border-radius: var(--pill); background: var(--surface-card); }
.jb-clear:hover { color: var(--ink); }
.jb-list { padding: var(--ui-gap-xs) 0; }
.jb-group { font-size: var(--ui-fs-xs); color: var(--meta); padding: var(--ui-gap-xs) calc(13px * var(--ui-scale)) var(--ui-gap-3xs); }
.jb-empty { font-size: var(--ui-fs-sm); color: var(--meta); padding: var(--ui-gap-md) calc(13px * var(--ui-scale)); font-style: italic; }
.jb-row { padding: var(--ui-gap-xs) calc(13px * var(--ui-scale)); border-top: 1px dashed var(--hair); }
.jb-row:first-child { border-top: 0; }
.jb-row-head { display: flex; align-items: center; gap: var(--ui-gap-xs); }
.jb-kind { font-size: var(--ui-fs-2xs); background: var(--surface-card); color: var(--ink-2); padding: calc(1px * var(--ui-scale)) var(--ui-gap-xs); border-radius: var(--radius-sm); flex: 0 0 auto; }
.jb-label { font-size: var(--ui-fs-sm); color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jb-state { font-size: var(--ui-fs-xs); flex: 0 0 auto; }
.jb-state.running { color: var(--accent); }
.jb-state.done { color: var(--ok); }
.jb-state.failed { color: var(--danger); }
.jb-state.cancelled { color: var(--meta); }
.jb-x { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--meta); font-size: var(--ui-fs-sm); flex: 0 0 auto; }
.jb-x:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }
.jb-msg { font-size: var(--ui-fs-xs); color: var(--muted); margin-top: var(--ui-gap-3xs); padding-left: var(--ui-gap-3xs); }
.jb-err { font-size: var(--ui-fs-xs); color: var(--danger); margin-top: var(--ui-gap-3xs); }
.jb-spin { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid var(--accent); border-top-color: transparent; animation: jb-spin .8s linear infinite; flex: 0 0 auto; }
.jb-ok { color: var(--ok); font-size: var(--ui-fs-sm); flex: 0 0 auto; }
.jb-fail { color: var(--danger); font-size: var(--ui-fs-sm); flex: 0 0 auto; }
.jb-cancel { color: var(--meta); font-size: var(--ui-fs-sm); flex: 0 0 auto; }
@keyframes jb-spin { to { transform: rotate(360deg); } }

/* OS-79 退役（OS-81）：galgame 开场三卡改为序章消息入流，gg-* 样式全部退役 */
.ded-opt-roll { margin-left: auto; font-size: var(--ui-fs-2xs); color: var(--meta); font-family: var(--mono); }

/* OS-76：剧本左侧文件列表（与正文页章节列表同构，顶部横栏退役） */
.sc-side { width: 236px; }
/* OS-78：角色专属色——块级变量由 castColorStyle 注入，台词名用专属色 */
.sc-block[style*="--sc-cast-bg"] { background: var(--sc-cast-bg); border-radius: var(--radius-sm); }
.sc-block[style*="--sc-cast-bg"] .sc-who { color: var(--sc-cast-fg); }
.sc-block[style*="--sc-cast-bg"] .sc-said { color: var(--sc-cast-fg); }
.sc-block[style*="--sc-cast-bg"]::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
  background: var(--sc-cast-bar); border-radius: 2px; }
.doc-line { position: relative; }
/* 角色配色色块预览（设置页） */
.sc-cast-preview { display: flex; flex-wrap: wrap; gap: var(--ui-gap-xs); padding: var(--ui-gap-xs) 0; }
.cast-chip { font-size: var(--ui-fs-sm); padding: var(--ui-gap-3xs) var(--ui-gap-md); border-radius: var(--pill); font-weight: 600; }
/* 自动排版规则清单（设置页） */
.sc-rule-list { display: flex; flex-direction: column; gap: var(--ui-gap-2xs); padding: var(--ui-gap-sm) 0; }
.sc-rule { display: flex; align-items: baseline; gap: var(--ui-gap-sm); font-size: var(--ui-fs-sm); color: var(--muted); }
.sc-rule code { background: var(--surface-card); padding: calc(1px * var(--ui-scale)) var(--ui-gap-xs); border-radius: 4px; font-family: var(--mono); color: var(--ink-2); }
.sc-side .cast-row { display: flex; align-items: baseline; gap: var(--ui-gap-sm); padding: var(--ui-gap-3xs) 0; font-size: var(--ui-fs-sm); }
.sc-side .cast-name { color: var(--ink-2); flex: 1; min-width: 0; }
.sc-side .cast-n { color: var(--meta); font-size: var(--ui-fs-xs); flex: 0 0 auto; }
.sc-file-list { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); padding: var(--ui-gap-2xs) 0; }
.sc-new-row { display: flex; gap: var(--ui-gap-2xs); margin-top: var(--ui-gap-sm); padding-top: var(--ui-gap-sm); border-top: 1px solid var(--hair); }
.sc-new-row .file-input { flex: 1; min-width: 0; font-size: var(--ui-fs-sm); padding: var(--ui-gap-2xs) var(--ui-gap-sm); }

/* OS-75：剧本原生渲染——幕/场景指示/角色台词各有版式（与小说同一套排版基线） */
.sc-doc { max-width: var(--doc-max); margin: 0 auto; padding: 8px 0 60px; font-family: var(--serif);
  font-size: var(--ui-fs-base); line-height: 1.85; color: var(--ink); outline: none; }
.sc-doc:focus { outline: none; }
/* OS-76：剧本页复用 doc-line/doc-block 逐块编辑链路——块内是剧本版式，不是纯文本 */
.sc-doc .doc-line { padding-left: 0; }
.sc-block { min-height: 1.6em; outline: none; }
.sc-block:focus { background: color-mix(in srgb, var(--accent) 5%, transparent); border-radius: var(--radius-sm); }
.sc-act { font-family: var(--sans); font-size: var(--ui-fs-xl); font-weight: 700; letter-spacing: .02em;
  margin: calc(34px * var(--ui-scale)) 0 18px; padding-bottom: var(--ui-gap-sm); border-bottom: 2px solid var(--line); color: var(--ink); }
.sc-act:first-child { margin-top: var(--ui-gap-sm); }
.sc-stage { text-align: center; color: var(--muted); font-size: var(--ui-fs-md); font-style: italic;
  margin: var(--ui-gap-lg) 0; padding: var(--ui-gap-xs) var(--ui-gap-md); }
.sc-line { margin: var(--ui-gap-md) 0 10px 3em; text-indent: -3em; }
.sc-who { font-weight: 700; color: var(--ink); margin-right: var(--ui-gap-3xs); }
.sc-hint { color: var(--meta); font-size: 0.88em; margin-right: var(--ui-gap-2xs); }
.sc-said { color: var(--ink-2); }
.sc-action { margin: var(--ui-gap-md) 0; color: var(--ink-2); }
.sc-empty { color: var(--meta); text-align: center; padding: calc(40px * var(--ui-scale)) 0; }

/* OS-75：世界书条目图墙（封面 + 缩略图 + 生图按钮） */
.ref-gallery { display: flex; flex-direction: column; gap: var(--ui-gap-sm); margin-bottom: var(--ui-gap-md); }
.ref-gallery-cover { border-radius: var(--radius-md); overflow: hidden; background: var(--surface-card); box-shadow: var(--shadow-card); }
.ref-gallery-cover img { display: block; width: 100%; height: auto; }
.ref-gallery-thumbs { display: flex; gap: var(--ui-gap-xs); overflow-x: auto; scrollbar-width: none; }
.ref-gallery-thumbs::-webkit-scrollbar { height: 0; }
.ref-gallery-thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius); box-shadow: var(--shadow-card); flex: 0 0 auto; }
.ref-gallery-ops { display: flex; gap: var(--ui-gap-xs); }
.ref-gallery.empty { align-items: flex-start; }
.ref-gallery-none { font-size: var(--ui-fs-sm); color: var(--meta); padding: var(--ui-gap-md) 0; }

.cfg-sub { padding-top: var(--ui-gap-2xs); }
.cfg-sub[hidden] { display: none; }
.cfg-head { display: flex; align-items: center; gap: var(--ui-gap-md); margin-bottom: var(--ui-gap-md); }
.cfg-head h3 { margin: 0; font-size: var(--ui-fs-base); flex: 1 1 auto; }
.cfg-badge { flex: 0 0 auto; max-width: 52%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--ui-fs-xs); border: 1px solid var(--line); border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-md); color: var(--meta); }
.cfg-badge.running { color: var(--warn-ink); border-color: var(--warn); }
.cfg-badge.ok { color: var(--ok); border-color: var(--ok); }
.cfg-badge.fail { color: var(--danger); border-color: var(--danger); }
.cfg-card .field { display: flex; flex-direction: column; gap: var(--ui-gap-2xs); margin-bottom: var(--ui-gap-md); }
.cfg-card .field label { font-size: var(--ui-fs-sm); color: var(--muted); }
.cfg-card .field input { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); outline: none; background: var(--bg); }
.cfg-card .field input:focus { border-color: var(--ink); }
.cfg-card .field select.select { width: 100%; max-width: none; }
.cfg-card .row { display: flex; gap: var(--ui-gap-md); flex-wrap: wrap; align-items: center; margin-top: var(--ui-gap-2xs); }
.cfg-card .err { color: var(--danger); font-size: var(--ui-fs-sm); margin-top: var(--ui-gap-xs); }
/* OS-145 设置 · 模块组：停用的模块整卡压暗（值可见、控件 disabled，重新启用即恢复） */
.mp-card.mp-off { opacity: .55; }
.cfg-switch input { width: auto; min-width: 0; }
.cfg-note { font-size: var(--ui-fs-xs); color: var(--meta); line-height: 1.6; }

/* ── 套件激活管理面板（OS-17）────────────────────────────── */
/* ══ OS-101 插件中心：导航直接列套件 + 套件内模块设置 ══════════ */
.nav-off-tag {
  margin-left: var(--ui-gap-xs); font-size: var(--ui-fs-2xs); font-weight: 400;
  font-style: normal; color: var(--meta);
  border: 1px solid var(--hair); border-radius: var(--pill); padding: 0 var(--ui-gap-xs);
}
.nav-empty { margin: 0; padding: var(--ui-gap-sm) var(--ui-ctl-px); font-size: var(--ui-fs-xs); color: var(--meta); }
.h5-sub { margin-left: var(--ui-gap-sm); font-weight: 400; font-size: var(--ui-fs-2xs); color: var(--meta); }
.suite-mod-group { margin-bottom: var(--ui-gap-md); }
.suite-mod-group h6 {
  margin: 0 0 var(--ui-gap-xs); font-size: var(--ui-fs-xs); font-weight: 600; color: var(--ink-2);
}

/* ══ OS-120 插件总览（三套一份清单）════════════════════════════
   为什么单独一屏：套件/技能/运行时是三套独立 spec，用户不该为了回答
   「我装了什么」先去分辨类型。这一屏只做盘点，编辑仍回各自详情。 */
.plug-overview { display: flex; flex-direction: column; gap: var(--ui-gap-md); }
.plug-summary {
  display: flex; gap: var(--ui-gap-md); align-items: baseline;
  padding: 8px 12px; border-radius: var(--radius-sm); background: var(--soft);
  font-size: var(--ui-fs-xs); color: var(--meta);
}
.plug-summary b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.plug-sum-bad b { color: var(--danger); }
.plug-warn {
  padding: 9px 12px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--warn) 12%, transparent);
  font-size: var(--ui-fs-xs); color: var(--ink-2);
}
.plug-warn b { display: block; margin-bottom: 4px; color: var(--ink); font-weight: 600; }
.plug-warn ul { margin: 0; padding-left: 16px; }
.plug-warn li { margin: 2px 0; overflow-wrap: anywhere; }
.plug-block { display: flex; flex-direction: column; gap: 2px; }
.plug-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 2px; border-bottom: 1px solid var(--hair);
}
.plug-head b { font-size: var(--ui-fs-sm); color: var(--ink); font-weight: 600; }
.plug-head span { font-size: var(--ui-fs-xs); color: var(--meta); font-variant-numeric: tabular-nums; }
.plug-list { display: flex; flex-direction: column; }
.plug-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto;
  gap: 10px; align-items: center; text-align: left;
  padding: 7px 6px; border-radius: 6px; background: transparent;
  border: 0; cursor: pointer; color: var(--ink); font-size: var(--ui-fs-xs);
}
.plug-row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.plug-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plug-ver { color: var(--meta); font-variant-numeric: tabular-nums; }
.plug-src { color: var(--meta); font-size: 11px; }
.plug-tag {
  font-style: normal; font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
  background: var(--soft); color: var(--meta);
}
.plug-tag.off { opacity: .75; }
.plug-tag.blocked {
  background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger);
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.plug-empty { padding: 10px 4px; margin: 0; }
.plug-info-meta {
  display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0;
  font-size: var(--ui-fs-xs); color: var(--meta);
}
.plug-info-bad { color: var(--danger); }

/* ══ OS-192 五类货架统一设置面：六组供给类型，每项就地启停 ══ */
.shelf-groups { display: flex; flex-direction: column; gap: var(--ui-gap-sm); margin-bottom: var(--ui-gap-lg); }
.shelf-group {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-card); padding: var(--ui-gap-xs);
}
.shelf-group-head {
  display: flex; align-items: baseline; gap: var(--ui-gap-xs);
  padding: var(--ui-row-py) var(--ui-ctl-px); border-bottom: 1px solid var(--hair);
}
.shelf-group-head b { font-size: var(--ui-fs-sm); color: var(--ink); font-weight: 600; }
.shelf-group-head span { font-size: var(--ui-fs-xs); color: var(--meta); }
.shelf-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center; gap: var(--ui-gap-xs);
  padding: var(--ui-row-py) var(--ui-ctl-px); border-radius: var(--radius-sm);
}
.shelf-row.on { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.shelf-name {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  text-align: left; background: transparent; border: 0; cursor: pointer;
  color: var(--ink); font-size: var(--ui-fs-md);
}
.shelf-name b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shelf-name .sub { font-size: var(--ui-fs-xs); color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-nav-sub {
  padding: var(--ui-gap-xs) var(--ui-ctl-px) 2px;
  font-size: var(--ui-fs-xs); color: var(--meta); font-weight: 600;
}
@media (max-width: 1000px) {
  .shelf-row { grid-template-columns: minmax(0, 1fr) auto; }
  .shelf-row .plug-tag { display: none; }
}

/* ══ OS-99 业务套件中心（主从两栏，对齐 DSH 插件管理）══════════
   左列＝套件清单（谁是谁一眼看出），右列＝选中项详情（来源/能力/启停/设置） */
.suite-center .suite-split {
  display: grid; grid-template-columns: calc(240px * var(--ui-scale)) minmax(0, 1fr);
  gap: var(--ui-gap-lg); align-items: start;
}
@media (max-width: 1180px) { .suite-center .suite-split { grid-template-columns: minmax(0, 1fr); } }

.suite-col {
  display: flex; flex-direction: column; gap: var(--ui-gap-2xs);
  border: 1px solid var(--hair); border-radius: var(--radius);
  padding: var(--ui-gap-xs); background: var(--surface-card);
}
.suite-list-item {
  display: flex; flex-direction: column; gap: var(--ui-gap-3xs);
  width: 100%; text-align: left; padding: var(--ui-gap-sm) var(--ui-gap-md);
  border: 1px solid transparent; border-radius: var(--radius-sm);
  background: transparent; cursor: pointer;
  transition: background .12s ease, border-color .12s ease;
}
.suite-list-item:hover { background: var(--soft); }
.suite-list-item.on { background: var(--accent-soft); border-color: var(--accent); }
.suite-list-item.off { opacity: .6; }
.sli-name { font-size: var(--ui-fs-md); font-weight: 600; color: var(--ink); }
.suite-list-item.on .sli-name { color: var(--accent); }
.sli-meta { display: flex; align-items: center; gap: var(--ui-gap-xs); }
.sli-domain { font-size: var(--ui-fs-2xs); color: var(--meta); }
.sli-state {
  margin-left: auto; font-size: var(--ui-fs-2xs); color: var(--meta);
  border-radius: var(--pill); padding: 0 var(--ui-gap-xs);
  background: color-mix(in srgb, var(--ink) 6%, transparent);
}
.sli-state.is-on { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.suite-empty { padding: var(--ui-gap-lg); text-align: center; }

.suite-detail-col { display: flex; flex-direction: column; gap: var(--ui-gap-md); min-width: 0; }
.suite-detail-head { display: flex; align-items: flex-start; gap: var(--ui-gap-md); }
.suite-detail-head .sdh-main { flex: 1; min-width: 0; }
.suite-detail-head h4 { margin: 0 0 var(--ui-gap-2xs); font-size: var(--ui-fs-xl); font-weight: 600; color: var(--ink); }
.suite-detail-head .sub { margin: 0; font-size: var(--ui-fs-sm); color: var(--muted); line-height: var(--ui-lh-normal); }
.suite-detail-body { display: flex; flex-direction: column; gap: var(--ui-gap-lg); }
.suite-detail-section h5 {
  margin: 0 0 var(--ui-gap-sm); font-size: var(--ui-fs-xs); font-weight: 600;
  color: var(--meta); letter-spacing: .04em;
}
.suite-source { display: flex; flex-direction: column; gap: 0; margin: 0; }
.suite-source > div {
  display: grid; grid-template-columns: calc(96px * var(--ui-scale)) minmax(0, 1fr);
  gap: var(--ui-gap-md); padding: var(--ui-gap-xs) 0;
  border-bottom: 1px dashed var(--hair); align-items: baseline;
}
.suite-source > div:last-child { border-bottom: 0; }
.suite-source dt { font-size: var(--ui-fs-xs); color: var(--meta); }
.suite-source dd { margin: 0; font-size: var(--ui-fs-sm); color: var(--ink-2); overflow-wrap: anywhere; }
.suite-source .mono { font-family: var(--mono); font-size: var(--ui-fs-xs); }
.suite-caps { margin-top: var(--ui-gap-sm); display: flex; flex-direction: column; gap: var(--ui-gap-2xs); }
.suite-cap-row { display: flex; gap: var(--ui-gap-sm); font-size: var(--ui-fs-xs); align-items: baseline; }
.suite-cap-row b { color: var(--meta); font-weight: 600; flex: 0 0 auto; }
.suite-cap-row span { color: var(--ink-2); overflow-wrap: anywhere; }
.suite-manage { border: 1px solid var(--hair); border-radius: var(--radius); overflow: hidden; }
.suite-manage-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--ui-gap-md); padding: var(--ui-gap-md) var(--ui-gap-lg); border-bottom: 1px solid var(--hair); align-items: center; }
.suite-manage-row:last-child { border-bottom: 0; }
.suite-manage-row.off { opacity: .62; }
.suite-manage-row .sm-main { min-width: 0; }
.suite-manage-row .sm-name { font-weight: 700; font-size: var(--ui-fs-base); padding: 0; }
.suite-manage-row .sm-name:hover { color: var(--accent); }
.suite-manage-row .sm-main .count { margin-top: var(--ui-gap-3xs); }
.suite-manage-row .sm-ops { display: flex; gap: var(--ui-gap-sm); align-items: center; }
.sm-toggle { display: inline-flex; align-items: center; gap: var(--ui-gap-xs); border: 1px solid var(--line); border-radius: var(--pill); padding: var(--ui-gap-2xs) var(--ui-gap-md) var(--ui-gap-2xs) var(--ui-gap-2xs); background: var(--bg); }
.sm-toggle .knob { width: 14px; height: 14px; border-radius: 50%; background: var(--meta); }
.sm-toggle.on { border-color: var(--ok); }
.sm-toggle.on .knob { background: var(--ok); }
.sm-toggle.on .lab { color: var(--ok); }
.sm-toggle:hover { border-color: var(--ink); }

/* ── OS-201 插件治理台：卡片流与卡内确认条 ──────────────────────
   颜色只走令牌（三类着色 --cat-*，浅底由 color-mix 派生）；字号 --ui-fs-*；
   间距 --ui-gap-* 或 calc(Npx * var(--ui-scale))。展开卡通栏。 */
.gov { display: flex; flex-direction: column; gap: var(--ui-gap-lg); min-width: 0; }
.gov-head { display: flex; align-items: baseline; gap: var(--ui-gap-md); flex-wrap: wrap; }
.gov-head h2 { font-size: var(--ui-fs-xl); margin: 0; }
.gov-lead { font-size: var(--ui-fs-sm); color: var(--muted); margin: 0; line-height: var(--ui-lh-normal); }
.gov-count { font-size: var(--ui-fs-xs); color: var(--meta); font-variant-numeric: tabular-nums; }
.gov-empty, .gov-empty-group { font-size: var(--ui-fs-sm); color: var(--muted); padding: var(--ui-gap-lg); border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface-card); }
.gov-group { display: flex; flex-direction: column; gap: var(--ui-gap-sm); }
.gov-group-head { display: flex; align-items: center; gap: var(--ui-gap-sm); flex-wrap: wrap; }
.gov-group-head h3 { font-size: var(--ui-fs-lg); margin: 0; }
.gov-group-head .gov-desc { font-size: var(--ui-fs-xs); color: var(--meta); }
.gov-dot { display: inline-block; flex: 0 0 auto; width: calc(8px * var(--ui-scale)); height: calc(8px * var(--ui-scale)); border-radius: 50%; background: var(--meta); }
.gov-dot.cat-kernel { background: var(--cat-kernel); }
.gov-dot.cat-workbench { background: var(--cat-workbench); }
.gov-dot.cat-host { background: var(--cat-host); }
.gov-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ui-gap-md); align-items: start; }
.gov-card { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-card); box-shadow: var(--shadow-card); overflow: hidden; }
.gov-card.open { grid-column: 1 / -1; border-color: var(--accent); }
.gov-card.gov-workbench:not(.off) .gov-row { background: color-mix(in srgb, var(--cat-workbench) 6%, var(--bg)); }
.gov-card.gov-kernel .gov-row { background: color-mix(in srgb, var(--cat-kernel) 6%, var(--bg)); }
.gov-card.gov-host .gov-row { background: color-mix(in srgb, var(--cat-host) 6%, var(--bg)); }
.gov-card.off .gov-name, .gov-card.off .gov-sum { opacity: .6; }
.gov-row { display: flex; align-items: center; gap: var(--ui-gap-sm); padding: var(--ui-gap-md); cursor: pointer; flex-wrap: wrap; }
.gov-row:hover { box-shadow: var(--shadow-card-hover); }
/* OS-205a：没开库时开关是 disabled，这里补上可见的置灰；颜色/透明度仍走令牌。 */
.gov .sm-toggle:disabled { opacity: .5; cursor: not-allowed; border-color: var(--line); }
.gov .sm-toggle:disabled:hover { border-color: var(--line); }
.gov .sm-toggle:disabled .knob { background: var(--meta); }
.gov .sm-toggle:disabled .lab { color: var(--meta); }
.gov-name { font-size: var(--ui-fs-base); font-weight: 600; white-space: nowrap; }
.gov-ident { display: inline-flex; align-items: baseline; gap: var(--ui-gap-3xs); white-space: nowrap; }
.gov-ident code { font-family: var(--mono); font-size: var(--ui-fs-xs); color: var(--muted); }
.gov-ver { font-family: var(--mono); font-size: var(--ui-fs-2xs); color: var(--meta); }
.gov-badge { font-size: var(--ui-fs-2xs); color: var(--muted); border: 1px solid var(--line); border-radius: var(--pill); padding: 0 var(--ui-gap-sm); white-space: nowrap; }
.gov-badge-local { color: var(--accent); border-color: var(--accent); }
.gov-sum { flex: 1 1 auto; min-width: calc(120px * var(--ui-scale)); font-size: var(--ui-fs-sm); color: var(--muted); }
.gov-status { display: inline-block; flex: 0 0 auto; width: calc(8px * var(--ui-scale)); height: calc(8px * var(--ui-scale)); border-radius: 50%; background: var(--meta); }
.gov-status.--ok { background: var(--ok); }
.gov-status.--warn { background: var(--warn); }
.gov-status.--meta { background: var(--meta); }
.gov-chev { color: var(--meta); font-size: var(--ui-fs-lg); line-height: 1; transition: transform .15s ease; }
.gov-card.open .gov-chev { transform: rotate(90deg); }
.gov-lock { display: inline-flex; position: relative; flex: 0 0 auto; width: calc(14px * var(--ui-scale)); height: calc(12px * var(--ui-scale)); border: 1px solid var(--meta); border-radius: calc(3px * var(--ui-scale)); color: var(--meta); }
.gov-lock i { position: absolute; left: calc(2px * var(--ui-scale)); top: calc(-5px * var(--ui-scale)); width: calc(7px * var(--ui-scale)); height: calc(6px * var(--ui-scale)); border: 1px solid currentColor; border-bottom: 0; border-radius: 999px 999px 0 0; }
.gov-body { display: flex; flex-direction: column; gap: var(--ui-gap-sm); padding: var(--ui-gap-md); border-top: 1px solid var(--hair); }
.gov-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ui-gap-md); }
.gov-col { display: flex; flex-direction: column; gap: var(--ui-gap-2xs); min-width: 0; }
.gov-col h4, .gov-settings h4, .gov-confirm h4 { font-size: var(--ui-fs-sm); margin: 0 0 var(--ui-gap-2xs); color: var(--ink-2); }
.gov-line { display: flex; align-items: baseline; gap: var(--ui-gap-2xs); flex-wrap: wrap; font-size: var(--ui-fs-xs); line-height: var(--ui-lh-normal); }
.gov-line code { font-family: var(--mono); font-size: var(--ui-fs-xs); }
.gov-mark { color: var(--muted); }
.gov-mark.good { color: var(--ok); }
.gov-mark.bad { color: var(--danger); }
.gov-golden { font-size: var(--ui-fs-2xs); color: var(--warn-ink); }
.gov-why { color: var(--danger); font-size: var(--ui-fs-2xs); }
.gov-provider { color: var(--muted); }
.gov-note { font-size: var(--ui-fs-xs); color: var(--meta); line-height: var(--ui-lh-normal); }
.gov-deps { display: flex; flex-wrap: wrap; gap: var(--ui-gap-2xs); }
.gov-dep { display: inline-flex; align-items: center; gap: var(--ui-gap-2xs); font-size: var(--ui-fs-xs); color: var(--ink-2); border: 1px solid var(--line); border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-sm); }
.gov-dep-tag { font-size: var(--ui-fs-2xs); color: var(--meta); }
.gov-dep-tag.warn { color: var(--warn-ink); }
.gov-impact, .gov-identity, .gov-recovery { font-size: var(--ui-fs-xs); color: var(--muted); line-height: var(--ui-lh-normal); padding: var(--ui-gap-sm); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--cat-kernel) 10%, var(--bg)); }
.gov-recovery { background: color-mix(in srgb, var(--warn) 10%, var(--bg)); }
.gov-settings { display: flex; flex-direction: column; gap: var(--ui-gap-xs); padding-top: var(--ui-gap-sm); border-top: 1px dashed var(--hair); }
.gov-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ui-gap-sm); }
.gov-field { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); font-size: var(--ui-fs-xs); color: var(--muted); }
.gov-field .uikit-input, .gov-field .select, .gov-field input, .gov-field select { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--ui-row-py) var(--ui-ctl-px); font-size: var(--ui-fs-md); background: var(--bg); min-width: 0; }
.gov-field .uikit-input:focus, .gov-field .select:focus, .gov-field input:focus, .gov-field select:focus { border-color: var(--accent); outline: none; }
.gov-field.gov-check { flex-direction: row; align-items: center; gap: var(--ui-gap-sm); }
.gov-pointer { display: flex; align-items: center; gap: var(--ui-gap-sm); flex-wrap: wrap; font-size: var(--ui-fs-xs); color: var(--muted); padding: var(--ui-gap-sm); border-radius: var(--radius-sm); background: var(--soft); }
.gov-error { font-size: var(--ui-fs-xs); color: var(--danger); padding: var(--ui-gap-sm); border: 1px solid var(--danger); border-radius: var(--radius-sm); }
.gov-confirm { display: flex; flex-direction: column; gap: var(--ui-gap-sm); border-top: 1px solid var(--danger); padding: var(--ui-gap-md); background: color-mix(in srgb, var(--danger) 6%, var(--bg)); }
.gov-impact-list { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); }
.gov-impact-list p { font-size: var(--ui-fs-xs); color: var(--ink-2); margin: 0; line-height: var(--ui-lh-normal); }
.gov-confirm-actions { display: flex; gap: var(--ui-gap-sm); align-items: center; }
.gov-danger { font-size: var(--ui-fs-sm); color: var(--on-accent); background: var(--danger); border: 1px solid var(--danger); border-radius: var(--radius); padding: var(--ui-row-py) var(--ui-ctl-px); }
/* ── OS-202 能力图：布局由投影算，颜色/字号/间距一律令牌 ──────────────── */
.gov-map { display: flex; flex-direction: column; gap: var(--ui-gap-sm); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-card); box-shadow: var(--shadow-card); padding: var(--ui-gap-md); min-width: 0; }
.gov-map-head { display: flex; align-items: baseline; gap: var(--ui-gap-sm); flex-wrap: wrap; }
.gov-map-head h3 { font-size: var(--ui-fs-lg); margin: 0; }
.gov-graph-legend { display: flex; align-items: center; gap: var(--ui-gap-md); flex-wrap: wrap; font-size: var(--ui-fs-xs); color: var(--muted); }
.gov-graph-legend > span { display: inline-flex; align-items: center; gap: var(--ui-gap-3xs); }
.gov-graph-arrow-note { color: var(--meta); }
.gov-map-toggle { margin-left: auto; font-size: var(--ui-fs-xs); }
.gov-graph { width: 100%; height: auto; display: block; overflow: visible; }
.gov-map.collapsed .gov-graph, .gov-map.collapsed .gov-graph-legend { display: none; }
.gov-graph-edge { fill: none; stroke-width: 1.4; transition: opacity .15s ease; }
.gov-graph-edge.hot { stroke: var(--accent); stroke-width: 2.2; }
.gov-graph-edge.dim, .gov-graph-node.dim { opacity: .14; }
.gov-graph-node { cursor: pointer; }
.gov-graph-node rect { stroke-width: 1.2; transition: opacity .15s ease, stroke-width .15s ease; }
.gov-graph-node:hover rect { stroke-width: 2; }
.gov-graph-node.sel rect { stroke-width: 2.4; }
.gov-graph-node text { font-size: var(--ui-fs-xs); fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.gov-graph-node .gov-graph-local { font-size: var(--ui-fs-2xs); fill: var(--accent); text-anchor: end; }
.gov-graph-note-text { font-size: var(--ui-fs-xs); fill: var(--muted); text-anchor: start; dominant-baseline: central; }
.gov-card.sel { border-color: var(--accent); }
.gov-card.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 720px) {
  .gov-cards { grid-template-columns: minmax(0, 1fr); }
  .gov-grid, .gov-fields { grid-template-columns: minmax(0, 1fr); }
  .gov-card.open { grid-column: auto; }
  .gov-sum { flex-basis: 100%; }
}

/* ── 选区浮窗＋Agent 上下文条（OS-24）────────────── */
.sel-bar { position: fixed; z-index: 120; display: none; gap: var(--ui-gap-2xs); padding: var(--ui-gap-2xs); background: var(--bg); border: 1px solid var(--line); border-radius: var(--pill); box-shadow: var(--shadow); }
.sel-bar.on { display: flex; }
.sel-bar button { border-radius: var(--pill); padding: var(--ui-gap-2xs) var(--ui-gap-lg); font-size: var(--ui-fs-sm); color: var(--ink-2); }
.sel-bar button:hover { background: var(--accent-soft); color: var(--accent); }
.agent-context:empty { display: none; }
.agent-context { padding: 0 14px 6px; }
/* 上下文条（OS-67 作者口径）：提示类信息用浅绿（--ok 系），红色留给错误——
   之前用 --accent 红虚线，读起来像报错 */
.ctx-chip { display: flex; align-items: center; gap: var(--ui-gap-sm); border: 1px dashed color-mix(in srgb, var(--ok) 55%, transparent); border-radius: var(--radius); padding: var(--ui-gap-xs) var(--ui-gap-md); font-size: var(--ui-fs-xs); background: color-mix(in srgb, var(--ok) 7%, transparent); }
.ctx-chip .ctx-label { color: color-mix(in srgb, var(--ok) 80%, var(--ink)); font-weight: 600; flex: 0 0 auto; }
.ctx-chip .ctx-text { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.ctx-chip .ctx-x { color: var(--meta); font-size: var(--ui-fs-base); line-height: 1; }
.ctx-chip .ctx-x:hover { color: var(--danger); }

/* ── 分析面板（OS-33）：独立右栏，不跟正文一起滚；批注卡随段落吸顶 ──────
   类纸（OS-47）：右栏无边框，模块各自是软卡片堆叠
   OS-48：右栏同样是**浮层附庸**（绝对定位），开关不改变正文纸面宽度与位置 */
.analyze-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 300px; min-width: 0; z-index: 45;
  background: transparent;
  display: none; flex-direction: column; overflow-y: auto; }
.analyze-panel.open { display: flex; }
.analyze-head { display: flex; align-items: center; gap: var(--ui-gap-xs); padding: var(--ui-gap-sm) var(--ui-gap-md) var(--ui-gap-sm) var(--ui-gap-lg); font-size: var(--ui-fs-sm); font-weight: 600; color: var(--ink-2); position: sticky; top: 0; background: var(--bg); z-index: 2; }
.analyze-head .rm-title { flex: 0 0 auto; }
.analyze-head .rm-badge { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.analyze-head .sp { flex: 1; }
.analyze-body { padding: var(--ui-gap-2xs) var(--ui-gap-md) var(--ui-gap-xl); display: flex; flex-direction: column; gap: var(--ui-gap-sm); }
/* 右栏每张分析卡与左侧卡片同一套影与底色（OS-49） */
.analyze-sec { background: var(--surface-card); border-radius: var(--radius-md); padding: var(--ui-gap-md); box-shadow: var(--shadow-card); transition: box-shadow .16s ease; }
.analyze-sec:hover { box-shadow: var(--shadow-card-hover); }
.analyze-kpis { display: flex; gap: var(--ui-gap-lg); font-size: var(--ui-fs-sm); color: var(--muted); flex-wrap: wrap; }
.analyze-kpis b { color: var(--ink); font-size: var(--ui-fs-base); margin-right: var(--ui-gap-3xs); }
.analyze-sec h4 { margin: 0 0 6px; font-size: var(--ui-fs-md); display: flex; align-items: center; gap: var(--ui-gap-xs); }
.analyze-sec .sub { font-size: var(--ui-fs-xs); color: var(--meta); margin: var(--ui-gap-xs) 0 0; line-height: 1.6; }
.spark { width: 100%; height: 46px; display: block; background: var(--bg); border-radius: var(--radius); }.chart-tabs { display: flex; gap: var(--ui-gap-xs); margin: var(--ui-gap-3xs) 0 8px; }
.chart-tab { border: 0; background: transparent; color: var(--meta); border-radius: 999px; padding: var(--ui-gap-3xs) var(--ui-gap-md); font-size: var(--ui-fs-sm); cursor: pointer; }
.chart-tab.on { background: var(--accent-soft, color-mix(in srgb, var(--accent) 12%, transparent)); color: var(--accent); font-weight: 600; }
.analyze-sec svg [data-action] { transition: fill-opacity .15s; }
.analyze-sec svg [data-action]:hover { fill-opacity: 1; }
/* 曲线交互（OS-50）：可见点默认小，hover 命中区时放大——让「能点、且点和正文段落对应」一眼可见 */
.analyze-sec svg .cv-dot { transition: r .12s ease, fill-opacity .12s ease; }
.analyze-sec svg .cv-hit:hover + .cv-dot,
.analyze-sec svg .cv-dot.on { r: 5; fill-opacity: 1; }
.ai-score { font-size: var(--ui-fs-base); }
/* 编辑总评（OS-56）：结论优先——人话总评＋好在哪＋问题在哪（可定位可跳详情） */
.ed-card { background: var(--surface-card); border-radius: var(--radius-md); padding: var(--ui-gap-md); box-shadow: var(--shadow-card); }
.ed-card h4 { margin: 0 0 6px; font-size: var(--ui-fs-md); }
.ed-headline { margin: 0 0 10px; font-size: var(--ui-fs-md); line-height: 1.75; color: var(--ink); font-weight: 600; }
.ed-line { display: flex; gap: var(--ui-gap-sm); align-items: flex-start; padding: var(--ui-gap-2xs) 0; border-top: 1px dashed var(--hair); font-size: var(--ui-fs-sm); line-height: 1.65; }
.ed-line:first-child { border-top: 0; }
.ed-ic { flex: 0 0 14px; text-align: center; font-weight: 700; }
.ed-line.good .ed-ic { color: var(--ok); }
.ed-line.warn .ed-ic { color: var(--warn); }
.ed-text { flex: 1; min-width: 0; }
.ed-text b { font-weight: 600; color: var(--ink-2); }
.ed-action { display: block; color: var(--ink-2); font-style: normal; margin-top: var(--ui-gap-3xs); }
.ed-action::before { content: '→ '; color: var(--meta); }
.ed-why { display: block; color: var(--meta); font-style: normal; font-size: var(--ui-fs-xs); margin-top: calc(1px * var(--ui-scale)); }
.ed-source { display: block; color: var(--meta); font-style: normal; font-size: var(--ui-fs-xs); margin-top: var(--ui-gap-3xs); opacity: .9; }
.ed-ops { display: flex; flex-direction: column; gap: var(--ui-gap-2xs); flex: 0 0 auto; }
.ed-act { font-size: var(--ui-fs-xs); color: var(--muted); border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-md); background: color-mix(in srgb, var(--ink) 5%, var(--bg)); white-space: nowrap; }
.ed-act:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 9%, var(--bg)); }
/* 分析模块选装（S3）：＋分析＝模块选择器；work 模块卡头带「在故事源中查看」 */
.am-bar { display: flex; align-items: center; gap: var(--ui-gap-sm); }
.am-add { font-size: var(--ui-fs-sm); font-weight: 600; color: var(--accent); border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-md); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.am-add:hover, .am-add.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.am-bar-note { font-size: var(--ui-fs-xs); color: var(--meta); }
.am-menu { display: flex; flex-direction: column; gap: var(--ui-gap-sm); padding: var(--ui-gap-md); border-radius: var(--radius-md); background: var(--surface-card); box-shadow: var(--shadow-card); }
.am-group { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); }
.am-group h5 { margin: 0 0 2px; font-size: var(--ui-fs-xs); font-weight: 600; letter-spacing: .04em; color: var(--meta); }
.am-row { display: flex; align-items: flex-start; gap: var(--ui-gap-sm); padding: var(--ui-gap-2xs) var(--ui-gap-xs); border-radius: var(--radius); text-align: left; }
.am-row:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.am-check { flex: 0 0 14px; height: 14px; margin-top: calc(1px * var(--ui-scale)); border: 1px solid var(--line); border-radius: 4px; font-size: var(--ui-fs-2xs); line-height: 13px; text-align: center; color: var(--accent); }
.am-row.on .am-check { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.am-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(1px * var(--ui-scale)); }
.am-row-main b { font-size: var(--ui-fs-sm); font-weight: 600; color: var(--ink-2); }
.am-row-hint { font-size: var(--ui-fs-xs); color: var(--meta); line-height: 1.5; }
.am-card-head { display: flex; align-items: baseline; gap: var(--ui-gap-sm); }
.am-card-head h4 { margin: 0 0 6px; flex: 1; min-width: 0; }
.am-goto { flex: 0 0 auto; font-size: var(--ui-fs-xs); color: var(--accent); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm); }
.am-goto:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.am-stat { display: flex; flex-wrap: wrap; gap: var(--ui-gap-md); font-size: var(--ui-fs-sm); color: var(--muted); margin-bottom: var(--ui-gap-xs); }
.am-stat b { color: var(--ink); font-size: var(--ui-fs-base); margin-left: var(--ui-gap-3xs); }
.am-list { display: flex; flex-direction: column; gap: calc(1px * var(--ui-scale)); margin-top: var(--ui-gap-2xs); }
.am-list-row { display: flex; align-items: baseline; gap: var(--ui-gap-sm); padding: var(--ui-gap-2xs) 0; border-top: 1px dashed var(--hair); font-size: var(--ui-fs-sm); }
.am-list-row:first-child { border-top: 0; }
.am-li-main { flex: 1; min-width: 0; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.am-li-meta { flex: 0 0 auto; font-size: var(--ui-fs-xs); color: var(--meta); font-variant-numeric: tabular-nums; }
.am-empty { padding: var(--ui-gap-sm) var(--ui-gap-3xs); font-size: var(--ui-fs-sm); line-height: 1.7; color: var(--meta); }
.ss-module-tabs { flex-wrap: wrap; margin: var(--ui-gap-3xs) 0 10px; }
/* 模块折叠卡（OS-56）：summary＝人话结论，展开＝数据（详有略） */
.analyze-sec.mod { padding: 0; }
.analyze-sec.mod > summary { display: flex; align-items: center; gap: var(--ui-gap-sm); padding: var(--ui-gap-md) var(--ui-gap-md); cursor: pointer; list-style: none; user-select: none; }
.analyze-sec.mod > summary::-webkit-details-marker { display: none; }
.analyze-sec.mod > summary::marker { content: ''; }
.analyze-sec.mod > summary:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); border-radius: var(--radius-md); }
.mod-v-head { font-size: var(--ui-fs-md); font-weight: 600; color: var(--ink-2); flex: 0 0 auto; }
.mod-verdict { flex: 1; min-width: 0; font-size: var(--ui-fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mod-verdict.warn { color: var(--warn); }
.mod-verdict.good { color: var(--ok); }
.mod-verdict.neutral { color: var(--meta); }
.mod-caret { color: var(--meta); font-size: var(--ui-fs-sm); transition: transform .15s ease; transform: rotate(90deg); }
.analyze-sec.mod[open] > summary .mod-caret { transform: rotate(-90deg); }
.analyze-sec.mod > .mod-v-body { padding: 0 12px 12px; border-top: 1px dashed var(--hair); }
.analyze-sec.mod > .mod-v-body h4 { display: none; }
/* 文风模块（OS-44）：句长/段长变异系数是「像不像人写」的两个硬指标 */
.style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ui-gap-sm); margin-bottom: var(--ui-gap-sm); }
.style-kpi { display: flex; flex-direction: column; gap: calc(1px * var(--ui-scale)); border: 0; border-radius: var(--radius); padding: var(--ui-gap-xs) var(--ui-gap-sm); background: color-mix(in srgb, var(--ink) 2.5%, var(--bg)); }
.style-kpi .sk-label { font-size: var(--ui-fs-2xs); color: var(--meta); }
.style-kpi .sk-val { font-size: var(--ui-fs-lg); font-variant-numeric: tabular-nums; }
.style-kpi .sk-val.good { color: var(--ok); }
.style-kpi .sk-val.mid { color: var(--warn); }
.style-kpi .sk-val.bad { color: var(--danger); }
.style-kpi .sk-note { font-size: var(--ui-fs-2xs); color: var(--muted); }
.style-block { margin-top: var(--ui-gap-sm); }
.style-block h5 { margin: 0 0 5px; font-size: var(--ui-fs-xs); color: var(--muted); display: flex; align-items: center; gap: var(--ui-gap-xs); }
.style-chips { display: flex; flex-wrap: wrap; gap: var(--ui-gap-2xs); }
.style-chip { display: inline-flex; align-items: center; gap: var(--ui-gap-3xs); font-size: var(--ui-fs-2xs); color: var(--muted); border: 0; border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-sm); background: var(--bg); cursor: help; }
.style-chip b { font-size: var(--ui-fs-2xs); color: var(--meta); font-variant-numeric: tabular-nums; }
.style-chip.cliche { background: color-mix(in srgb, var(--danger) 8%, var(--bg)); }
.style-chip.connective { background: color-mix(in srgb, var(--warn) 10%, var(--bg)); }
/* 工作台模块插拔（OS-44）：设置页勾选列表 */
.mod-list { display: flex; flex-direction: column; gap: var(--ui-gap-3xs); }
.mod-row { border-bottom: 1px dashed var(--hair); }
.mod-row:last-child { border-bottom: 0; }
.mod-main { display: flex; align-items: flex-start; gap: var(--ui-gap-md); padding: var(--ui-gap-sm) var(--ui-gap-2xs); cursor: pointer; }
.mod-main input { margin-top: var(--ui-gap-3xs); }
.mod-main span { display: flex; flex-direction: column; gap: calc(1px * var(--ui-scale)); }
.mod-main b { font-size: var(--ui-fs-md); font-weight: 600; }
.mod-main i { font-style: normal; font-size: var(--ui-fs-xs); color: var(--meta); }
.ai-score.good { color: var(--ok); }
.ai-score.mid { color: var(--warn); }
.ai-score.bad { color: var(--danger); }
.bar-row { display: grid; grid-template-columns: 74px minmax(0,1fr) 28px; gap: var(--ui-gap-xs); align-items: center; font-size: var(--ui-fs-xs); margin-bottom: var(--ui-gap-2xs); }
.bar-label { color: var(--muted); }
.bar-track { height: 6px; background: var(--hair); border-radius: 999px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar-score { text-align: right; color: var(--ink-2); }
.bar-detail { grid-column: 1 / -1; color: var(--meta); font-size: var(--ui-fs-2xs); margin: -2px 0 2px; }
/* 批注卡：右栏「本段批注」区随滚动换内容（OS-33）；类纸化后它自己就是一张卡（OS-47） */
.analyze-here { border: 0; border-radius: 0; padding: 0; background: transparent; }
.analyze-here h4 { margin-bottom: var(--ui-gap-sm); }
.sec-toggle { display: flex; align-items: center; gap: var(--ui-gap-xs); font-size: var(--ui-fs-md); color: var(--muted); font-weight: 600; }
.sec-toggle:hover { color: var(--ink); }
.sec-toggle .caret { font-size: var(--ui-fs-2xs); color: var(--meta); }
.issue-card { border: 0; border-radius: var(--radius); padding: var(--ui-gap-sm) var(--ui-gap-md); margin-bottom: var(--ui-gap-xs); background: color-mix(in srgb, var(--ink) 2.5%, var(--bg)); font-size: var(--ui-fs-sm); }
.ic-head { display: flex; align-items: baseline; gap: var(--ui-gap-xs); margin-bottom: var(--ui-gap-3xs); }
/* 严重度改为小圆点，不再用色条描边 */
.ic-head::before { content: ''; flex: 0 0 auto; align-self: center; width: 6px; height: 6px; border-radius: 50%; background: var(--meta); }
.issue-card.sev-high .ic-head::before { background: var(--danger); }
.issue-card.sev-medium .ic-head::before { background: var(--warn); }
.ic-tag { font-weight: 600; }
.ic-para { margin-left: auto; font-size: var(--ui-fs-2xs); color: var(--meta); font-variant-numeric: tabular-nums; }
.ic-detail { color: var(--muted); line-height: 1.6; }
.ic-ops { display: flex; gap: var(--ui-gap-xs); margin-top: var(--ui-gap-xs); flex-wrap: wrap; }
/* 批注空态（OS-50）：不再是一行灰字＋大片留白，改成「结论 + 全章概览 + 可跳转入口」 */
.ann-empty { display: flex; flex-direction: column; gap: var(--ui-gap-xs); padding: var(--ui-gap-3xs) 0 2px; }
.ann-empty-main { margin: 0; font-size: var(--ui-fs-sm); color: var(--ink-2); line-height: 1.6; }
.ann-empty-sub { margin: 0; font-size: var(--ui-fs-xs); color: var(--meta); line-height: 1.6; }
.ann-empty-ops { display: flex; flex-wrap: wrap; gap: var(--ui-gap-2xs); margin-top: calc(1px * var(--ui-scale)); }
.ann-jump { font-size: var(--ui-fs-xs); color: var(--muted); border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-md); background: color-mix(in srgb, var(--ink) 5%, var(--bg)); }
.ann-jump:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 9%, var(--bg)); }
.ann-more { font-size: var(--ui-fs-xs); color: var(--meta); align-self: center; }
.issue-act { font-size: var(--ui-fs-xs); border: 0; border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-md); color: var(--muted); background: color-mix(in srgb, var(--ink) 5%, var(--bg)); }
.issue-act:hover { color: var(--ink); background: var(--hair); }
/* 文档内标注（OS-33）：左侧可点竖条＝这一段有批注；点它跳到那段并让右栏对齐 */
.doc-line { position: relative; display: block; }
.doc-line .doc-block { margin-bottom: var(--doc-para-gap); }
.doc-line:last-child .doc-block { margin-bottom: 0; }
.doc-gutter { position: absolute; left: -22px; top: 6px; bottom: 6px; width: 14px; border: 0; background: none; cursor: default; padding: 0; display: block; }
.doc-gutter.has-issue { cursor: pointer; }
.doc-gutter.has-issue::after { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; border-radius: 2px; background: var(--meta); transition: width .12s ease, left .12s ease; }
.doc-gutter.has-issue.sev-high::after { background: var(--danger); }
.doc-gutter.has-issue.sev-medium::after { background: var(--warn); }
.doc-gutter.has-issue.sev-low::after { background: var(--meta); }
.doc-gutter.has-issue:hover::after { width: 3px; left: 5.5px; }
.doc-gutter.has-issue.on::after { width: 3px; left: 5.5px; background: var(--accent); }
.doc-block.issue-flash { animation: issueFlash 1.2s ease; }
@keyframes issueFlash { 0%,100% { background: transparent; } 30% { background: var(--accent-soft); } }

.discover-row { display: grid; gap: var(--ui-gap-2xs); padding: var(--ui-gap-md) 0; border-bottom: 1px dashed var(--hair); font-size: var(--ui-fs-md); }
.discover-row b { margin-right: var(--ui-gap-sm); }
.discover-row .hint { font-family: var(--mono); font-size: var(--ui-fs-xs); color: var(--meta); }

/* ── 推演引擎（OS-29）────────────────────────────────── */
.doc-line-row { display: flex; align-items: center; gap: var(--ui-gap-lg); }
/* 推演页（OS-60 打磨）：类纸卡片、局面卡字段化、候选翻译成人话 */
.ded-tools { display: flex; gap: var(--ui-gap-sm); align-items: center; flex-wrap: wrap; margin-bottom: var(--ui-gap-lg); }
.ded-tools .file-input { flex: 0 1 200px; }
.ded-card { background: var(--surface-card); border-radius: var(--radius-md); padding: var(--ui-gap-lg) var(--ui-gap-lg); box-shadow: var(--shadow-card); }
.ded-card-head { display: flex; align-items: baseline; gap: var(--ui-gap-sm); margin-bottom: var(--ui-gap-md); }
.ded-card-head h3 { margin: 0; font-size: var(--ui-fs-base); }
.ded-card-head .sub { font-size: var(--ui-fs-xs); color: var(--meta); }
.ded-heat { margin-left: auto; font-size: var(--ui-fs-xs); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm); }
.ded-heat.h-low { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.ded-heat.h-mid { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn-ink); }
.ded-heat.h-high { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.ded-heat.h-crit { background: var(--danger); color: var(--on-accent); }
.ded-fields { margin: 0; display: flex; flex-direction: column; gap: var(--ui-gap-xs); }
.ded-fields > div { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: var(--ui-gap-sm); align-items: baseline; }
.ded-fields dt { font-size: var(--ui-fs-xs); color: var(--meta); }
.ded-fields dd { margin: 0; font-size: var(--ui-fs-md); color: var(--ink-2); line-height: 1.6; }
.ded-none { color: var(--meta); font-style: normal; font-size: var(--ui-fs-sm); }
.ded-meta { display: flex; flex-wrap: wrap; gap: var(--ui-gap-md); margin-top: var(--ui-gap-md); padding-top: var(--ui-gap-sm); border-top: 1px dashed var(--hair); font-size: var(--ui-fs-xs); color: var(--meta); font-variant-numeric: tabular-nums; }
.ded-badge { font-size: var(--ui-fs-2xs); border-radius: var(--pill); padding: calc(1px * var(--ui-scale)) var(--ui-gap-sm); background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink-2); }
.ded-cand-note { font-size: var(--ui-fs-xs); color: var(--meta); }
.ded-cand-ops { display: flex; gap: var(--ui-gap-xs); }
.ded-front { margin-bottom: var(--ui-gap-sm); }
.ded-front-row { display: flex; justify-content: space-between; font-size: var(--ui-fs-sm); color: var(--ink-2); margin-bottom: var(--ui-gap-2xs); }
.ded-front-n { color: var(--meta); font-variant-numeric: tabular-nums; }
.ded-clock { height: 5px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; }
.ded-clock i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.ded-howto { margin-top: var(--ui-gap-md); padding-top: var(--ui-gap-md); border-top: 1px dashed var(--hair); display: flex; flex-direction: column; gap: var(--ui-gap-3xs); }
.ded-howto b { font-size: var(--ui-fs-sm); color: var(--ink-2); }
.ded-howto span { font-size: var(--ui-fs-xs); color: var(--meta); line-height: 1.65; }
.ded-pack-row { display: grid; grid-template-columns: 14px 62px minmax(0,1fr); gap: var(--ui-gap-xs); align-items: baseline; padding: 3px 0; font-size: var(--ui-fs-sm); }
.ded-pack-ic { text-align: center; font-size: var(--ui-fs-2xs); }
.ded-pack-row.ok .ded-pack-ic { color: var(--ok); }
.ded-pack-row.gap .ded-pack-ic { color: var(--meta); }
.ded-pack-label { color: var(--ink-2); }
.ded-pack-hint { color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ded-empty { max-width: 640px; }
.ded-empty h2 { font-size: var(--ui-fs-lg); margin: 0 0 8px; }
.ded-empty p { font-size: var(--ui-fs-md); color: var(--muted); line-height: 1.75; margin: 0 0 10px; }
/* 扮演/推演模式选择（OS-97） */
.ow-mode { display: flex; gap: var(--ui-gap-sm); margin: 0 0 14px; }
.ow-mode-btn { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: var(--ui-gap-3xs);
  border: 1px solid var(--hair); background: color-mix(in srgb, var(--bg) 70%, transparent);
  border-radius: var(--radius-sm); padding: var(--ui-gap-md) calc(13px * var(--ui-scale)); cursor: pointer; text-align: left; }
.ow-mode-btn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.ow-mode-btn b { font-size: 13px; color: var(--ink); }
.ow-mode-btn span { font-size: 11px; color: var(--meta); }

/* 开局向导（OS-93 照酒馆：选角色卡 → 选世界书 → 选开头） */
.ow-wizard { max-width: 640px; background: color-mix(in srgb, var(--bg) 90%, transparent);
  border: 1px solid var(--hair); border-radius: var(--radius-md); padding: var(--ui-gap-xl) var(--ui-gap-xl) var(--ui-gap-lg);
  backdrop-filter: blur(8px); }
.ow-wizard h2 { font-size: var(--ui-fs-lg); margin: 0 0 4px; color: var(--ink); }
.ow-sub { margin: 0 0 14px; font-size: var(--ui-fs-md); color: var(--muted); }
.ow-loading { margin: var(--ui-gap-xl) 0; font-size: var(--ui-fs-md); color: var(--meta); font-style: italic; }
.ow-step { margin-bottom: var(--ui-gap-lg); }
.ow-step h3 { display: flex; align-items: baseline; gap: var(--ui-gap-sm); margin: 0 0 8px; font-size: var(--ui-fs-md); color: var(--ink); }
.ow-step .no { display: inline-grid; place-items: center; width: 20px; height: 20px;
  border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: var(--ui-fs-xs); }
.ow-step .sub { font-size: var(--ui-fs-xs); color: var(--meta); font-weight: 400; }
.ow-card { display: flex; flex-wrap: wrap; gap: var(--ui-gap-sm); }
.ow-card .ow-pick { display: flex; flex-direction: column; align-items: flex-start; gap: var(--ui-gap-3xs);
  flex: 1 1 200px; min-width: 0; text-align: left; border: 1px solid var(--hair);
  background: color-mix(in srgb, var(--bg) 70%, transparent); border-radius: var(--radius-sm);
  padding: var(--ui-gap-sm) var(--ui-gap-md); cursor: pointer; }
.ow-card.on .ow-pick { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.ow-card .ow-pick b { font-size: var(--ui-fs-md); color: var(--ink); }
.ow-card .ow-pick i { font-style: normal; font-size: var(--ui-fs-2xs); color: var(--meta);
  border: 1px solid var(--hair); padding: 0 6px; border-radius: var(--pill); }
.ow-card .ow-pick span { font-size: var(--ui-fs-xs); line-height: 1.6; color: var(--meta); }
.ow-book { flex-direction: row; align-items: baseline; gap: var(--ui-gap-md); }
.ow-book-meta { font-size: var(--ui-fs-xs); }
.ow-open { flex: 1 1 100%; }
.ded-empty-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--ui-gap-sm); margin: 12px 0; }
.ded-type { background: var(--surface-card); border-radius: var(--radius); padding: var(--ui-gap-md) var(--ui-gap-md); display: flex; flex-direction: column; gap: var(--ui-gap-3xs); box-shadow: var(--shadow-card); }
.ded-type b { font-size: var(--ui-fs-md); }
.ded-type span { font-size: var(--ui-fs-xs); color: var(--meta); }
/* 推演回合层（OS-61 P2 遗留）：树视图还用 buffer-stat */
.ded-buffer-stat { font-size: var(--ui-fs-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }
/* ============================================================
   OS-81：推演＝沉浸叙事流（酒馆模型）＋流末待决回合（RPG 模型）
   结构：.ded-flow（铺满视口，页面不再滚）
     ├ .ded-flow-bg / .ded-flow-tint   场景立绘暗化背景（纸面模式关掉）
     ├ .fl-bar                          细工具栏（进度/张力/切换/浮层开关）
     ├ .fl-scroll-wrap > .fl-scroll     唯一滚动容器＝故事流
     │    └ .fl-inner                   序章 → 你的回合 → 正文 → 待决
     ├ .fl-composer                     常驻输入条（自己写）
     └ .ded-stage-info / .ded-set-panel 浮层（不占布局）
   ============================================================ */
.ded-flow { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column;
  overflow: hidden; border-radius: var(--radius-md); background: var(--scene-deep); }
.ded-flow-bg { position: absolute; inset: 0; background-size: cover; background-position: center;
  background-color: var(--scene-deep); background-image: linear-gradient(160deg, var(--scene-deep) 0%, var(--scene-mid) 45%, var(--scene-far) 100%); }
.ded-flow-tint { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(15,13,22,.42) 0%, rgba(15,13,22,.62) 55%, rgba(15,13,22,.78) 100%); }
/* 纸面模式：关掉立绘背景，回纯纸面（读文优先） */
.ded-flow[data-paper="1"] { background: var(--bg); }
.ded-flow[data-paper="1"] .ded-flow-bg, .ded-flow[data-paper="1"] .ded-flow-tint { display: none; }
.ded-scene-grain { position: absolute; inset: 0; opacity: .5;
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.14), transparent 55%),
              radial-gradient(circle at 75% 70%, rgba(255,200,220,.12), transparent 50%); }

/* 工具栏：细一行，浮在背景上；纸面模式下回墨色 */
.fl-bar { position: relative; z-index: 6; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: var(--ui-gap-md) var(--ui-gap-lg); color: rgba(255,255,255,.88); }
.ded-flow[data-paper="1"] .fl-bar { color: var(--ink-2); }
.fl-bar-progress { font-size: var(--ui-fs-sm); font-variant-numeric: tabular-nums; }
.ded-bar-sep { margin: 0 7px; opacity: .45; }
.fl-bar .ded-heat { font-size: var(--ui-fs-xs); margin-left: 0; }
.fl-bar-right { margin-left: auto; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
/* OS-86：形态三分切换——一体胶囊（segmented），永远恰好一个选中，恒显不跳动 */
.fl-seg { display: inline-flex; align-items: center; padding: 2px; gap: 2px;
  background: rgba(20,18,30,.42); border-radius: var(--pill); backdrop-filter: blur(4px); }
.fl-seg-tab { font-size: var(--ui-fs-xs); color: rgba(255,255,255,.72); border-radius: var(--pill);
  padding: var(--ui-gap-3xs) var(--ui-gap-md); white-space: nowrap; }
.fl-seg-tab:hover { color: #fff; }
.fl-seg-tab.on { background: rgba(255,255,255,.92); color: #171624; font-weight: 600; }
.ded-flow[data-paper="1"] .fl-seg { background: var(--soft); backdrop-filter: none; }
.ded-flow[data-paper="1"] .fl-seg-tab { color: var(--muted); }
.ded-flow[data-paper="1"] .fl-seg-tab.on { background: var(--ink); color: var(--bg); }
/* 分组竖线：形态切换｜内容开关｜动作｜显示偏好 */
.fl-bar-div { width: 1px; height: 14px; background: rgba(255,255,255,.22); margin: 0 3px; flex: 0 0 auto; }
.ded-flow[data-paper="1"] .fl-bar-div { background: var(--hair); }
/* 小药丸按钮：工具栏与动作行共用 */
.fl-btn { font-size: var(--ui-fs-xs); color: rgba(255,255,255,.82); background: rgba(20,18,30,.4);
  border-radius: var(--pill); padding: var(--ui-gap-3xs) var(--ui-gap-md); backdrop-filter: blur(4px); }
.fl-btn:hover { background: rgba(20,18,30,.62); color: #fff; }
/* 开关的 on 态：accent 点＋亮底，跟动作按钮一眼区分 */
.fl-btn.on { background: rgba(255,255,255,.2); color: #fff; }
.fl-btn.on::before { content: '● '; font-size: var(--ui-fs-2xs); vertical-align: 1px; color: var(--ok); }
.fl-btn[disabled] { opacity: .55; }
.ded-flow[data-paper="1"] .fl-btn { color: var(--muted); background: var(--soft); backdrop-filter: none; }
.ded-flow[data-paper="1"] .fl-btn:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink-2); }
/* 纸面模式开关 on：淡绿底＋绿点（跟暗背景同一「绿点＝开」语言） */
.ded-flow[data-paper="1"] .fl-btn.on { background: color-mix(in srgb, var(--ok) 12%, var(--soft)); color: var(--ink-2); }

/* 故事流：唯一滚动容器；正文列宽 ~720px 居中 */
.fl-scroll-wrap { position: relative; flex: 1; min-height: 0; }
.fl-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 14px 18px 18px; }
.fl-inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
/* OS-84：Agent／剧情树共用的整页磨砂底——立绘背景仍在，字在任何皮上都可读 */
.fl-scroll-page { padding: 20px 26px 30px; }
.ded-flow:not([data-paper="1"]) .fl-scroll-page {
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(14px); }
/* 消息：左侧拍号栏＋右侧内容 */
/* 登场角色署名气泡＋情境分支（OS-98） */
.fl-beat { align-self: flex-start; max-width: 88%; padding: 8px 14px 9px;
  background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(6px);
  border-left: 2px solid color-mix(in srgb, var(--ink) 30%, transparent);
  border-radius: 4px 12px 12px 12px; font-size: 13px; line-height: 1.8; color: var(--ink-2); }
.ded-flow[data-paper="1"] .fl-beat { background: var(--surface-card); border: 1px solid var(--hair); border-left: 2px solid var(--hair); backdrop-filter: none; }
.fl-beat-name { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); margin-right: 7px; }
.fl-beat-text { font-family: var(--serif); }
.fl-options { display: flex; flex-direction: column; gap: 6px; align-self: flex-start; }
.fl-opt { display: flex; align-items: baseline; gap: 8px; text-align: left; max-width: 100%;
  border: 1px solid var(--hair); background: color-mix(in srgb, var(--bg) 88%, transparent);
  border-radius: var(--radius-sm); padding: var(--ui-gap-sm) calc(13px * var(--ui-scale)); font-size: 13px; color: var(--ink); cursor: pointer; }
.fl-opt:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.fl-opt-arrow { color: var(--accent); flex-shrink: 0; }

/* AI 叙述＝左气泡（OS-91 酒馆式）：拍号是气泡内小签，不再压在纸边 */
.fl-msg { position: relative; align-self: flex-start; max-width: 100%;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
  border-radius: 4px 16px 16px 16px; box-shadow: 0 2px 14px rgba(var(--shadow-base), .28);
  padding: var(--ui-gap-md) var(--ui-gap-lg) calc(13px * var(--ui-scale)); }
.ded-flow[data-paper="1"] .fl-msg { background: var(--surface-card); backdrop-filter: none;
  border: 1px solid var(--hair); box-shadow: var(--shadow-card); }
.fl-rn { position: static; display: inline-block; font-size: var(--ui-fs-2xs); color: rgba(255,255,255,.72);
  background: rgba(20,18,30,.46); padding: var(--ui-gap-3xs) var(--ui-gap-sm); border-radius: var(--pill);
  backdrop-filter: blur(4px); font-variant-numeric: tabular-nums; white-space: nowrap; margin-bottom: var(--ui-gap-xs); }
.ded-flow[data-paper="1"] .fl-rn { color: var(--muted); background: var(--soft); backdrop-filter: none; }
/* 正文纸卡：半透明类纸——底色从 --bg 派生，浅皮近白、夜皮近黑，全皮肤自适应（OS-84） */
.fl-prose { background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
  border-radius: var(--radius); box-shadow: 0 2px 14px rgba(var(--shadow-base), .28); padding: var(--ui-gap-lg) var(--ui-gap-xl) calc(15px * var(--ui-scale)); }
/* 气泡里的纸卡打平：气泡本身就是容器（OS-91） */
.fl-msg .fl-prose { background: transparent; backdrop-filter: none; box-shadow: none; padding: 0; border-radius: 0; }
.ded-flow[data-paper="1"] .fl-msg .fl-prose { background: transparent; }
.ded-flow[data-paper="1"] .fl-prose { background: var(--surface-card); backdrop-filter: none;
  border: 1px solid var(--hair); box-shadow: var(--shadow-card); }
.fl-text-body { cursor: pointer; }
.fl-text { margin: 0; font-family: var(--serif); font-size: var(--doc-font-size); line-height: var(--doc-line-height); color: var(--ink);
  white-space: pre-wrap; overflow-wrap: anywhere; }
.fl-text.is-empty { color: var(--meta); font-style: italic; font-size: var(--ui-fs-md); }
.fl-caret { color: var(--accent); animation: blink 1s steps(1) infinite; }
/* 序章消息 */
.fl-msg-prologue .fl-prose { background: color-mix(in srgb, var(--bg) 86%, transparent); }
/* 事实待确认卡（OS-82 回填闭环）：结算产物 → 写入故事源前的最后一道闸 */
.ded-factcard { background: color-mix(in srgb, var(--accent) 8%, color-mix(in srgb, var(--bg) 92%, transparent));
  border: 1px dashed color-mix(in srgb, var(--accent) 40%, transparent); border-radius: var(--radius);
  padding: var(--ui-gap-md) var(--ui-gap-lg) calc(13px * var(--ui-scale)); backdrop-filter: blur(8px); }
.ded-factcard-head { display: flex; align-items: center; gap: var(--ui-gap-sm); margin-bottom: var(--ui-gap-xs); flex-wrap: wrap; }
.ded-factcard-badge { font-size: var(--ui-fs-xs); font-weight: 700; color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  padding: var(--ui-gap-3xs) var(--ui-gap-sm); border-radius: var(--pill); letter-spacing: .04em; }
.ded-factcard-meta { font-size: var(--ui-fs-xs); color: var(--meta); }
.ded-factcard-name { margin: 0 0 4px; font-weight: 700; font-size: var(--ui-fs-base); color: var(--ink); }
.ded-factcard-def { margin: 0 0 10px; font-size: var(--ui-fs-md); line-height: 1.8; color: var(--ink-2); }
.ded-factcard-ops { display: flex; gap: var(--ui-gap-sm); align-items: center; }
.fl-prologue-head { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--ui-fs-md);
  color: var(--ink); margin-bottom: var(--ui-gap-xs); }
.fl-prologue-mark { color: var(--accent); font-size: var(--ui-fs-xs); }
