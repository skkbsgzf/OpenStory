name: OpenStory CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests twice
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm test 2>&1 | tee test-round-1.log || status=1
          npm test 2>&1 | tee test-round-2.log || status=1
          exit "$status"

      # 失败时把失败用例名当注解发出来（公开仓也能查，不必登录取 artifact）。
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for log in test-round-*.log acceptance.log arch-check.log; do
            [ -f "$log" ] || continue
            grep -E '^not ok |^✖ |^  ✖ ' "$log" | head -n 30 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/}"
              safe="${safe//$'\n'/'%0A'}"
              echo "::error title=${log}::${safe}"
            done
          done
          echo "### 失败摘要（$GITHUB_SHA）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hE '^ℹ (tests|pass|fail|skipped)|^not ok |^✖ ' test-round-*.log 2>/dev/null | head -n 40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run acceptance gate
        shell: bash
        run: |
          set -o pipefail
          node tools/acceptance/acceptance.mjs 2>&1 | tee acceptance.log

      - name: Check architecture numbers
        shell: bash
        run: |
          set -o pipefail
          node tools/arch-stats.mjs --check 2>&1 | tee arch-check.log

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-logs
          path: |
            test-round-1.log
            test-round-2.log
            acceptance.log
            arch-check.log
          retention-days: 7
