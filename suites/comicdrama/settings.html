<!doctype html>
<!-- 漫剧套件 · 自带设置页（openstory-suite@2 page 模式）
     ──────────────────────────────────────────────────────────────
     OS-95：插件前端规范样板。插件页与主工作台共用同一套设计令牌——
     ① 第一行 link /suite-assets/_tokens.css（宿主下发，含字号/间距/配色/圆角）
     ② 本页只写**结构**：字号用 --ui-fs-*、间距用 --ui-gap-*、颜色用语义令牌
     ③ 禁止裸写 px / hex——宿主换皮或调字号档时插件页自动跟随（暗色已内置）

     配置读写仍走协议既定通道：
       GET  /api/suite/state-data?id=comicdrama
       PUT  /api/suite/state-data?id=comicdrama  body {values:{...}}
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>漫剧套件 · 设置</title>
<!-- 宿主令牌：带 theme 参数由本页脚本按 URL 补（见文末 injectTokens） -->
<link rel="stylesheet" id="os-tokens" href="/suite-assets/_tokens.css">
<style>
  /* 结构样式：只用令牌，不出现任何像素/十六进制色值 */
  body {
    margin: 0;
    padding: var(--ui-gap-lg) var(--ui-gap-xl);
    font-family: var(--sans);
    font-size: var(--ui-fs-base);
    line-height: var(--ui-lh-normal);
    color: var(--ink);
    /* 宿主 iframe 内透明即可，独立打开时需要自己的底色（否则暗色令牌 + 白底 = 看不见） */
    background: var(--bg);
  }
  h3 {
    margin: 0 0 var(--ui-gap-md);
    font-size: var(--ui-fs-base);
    font-weight: 600;
    color: var(--ink);
  }
  .field { margin-bottom: var(--ui-gap-md); }
  label {
    display: block;
    font-size: var(--ui-fs-sm);
    font-weight: 600;
    color: var(--ink-2);
    margin-bottom: var(--ui-gap-2xs);
  }
  label .hint {
    margin-left: var(--ui-gap-xs);
    font-size: var(--ui-fs-xs);
    font-weight: 400;
    color: var(--meta);
  }
  select, input {
    box-sizing: border-box;
    height: var(--ui-ctl-h);
    min-width: 200px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0 var(--ui-ctl-px);
    font-family: var(--sans);
    font-size: var(--ui-fs-md);
    color: var(--ink);
    background: var(--bg);
    outline: none;
    transition: border-color .12s ease;
  }
  select:focus, input:focus { border-color: var(--accent); }
  .row {
    display: flex;
    align-items: center;
    gap: var(--ui-gap-md);
    margin-top: var(--ui-gap-lg);
  }
  button {
    height: var(--ui-ctl-h);
    border: 1px solid var(--accent);
    border-radius: var(--pill);
    padding: 0 calc(var(--ui-ctl-px) * 1.4);
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--sans);
    font-size: var(--ui-fs-base);
    font-weight: 600;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: var(--ui-fs-sm); }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--danger); }
  .note {
    margin: var(--ui-gap-lg) 0 0;
    padding-top: var(--ui-gap-md);
    border-top: 1px dashed var(--hair);
    font-size: var(--ui-fs-xs);
    line-height: var(--ui-lh-loose);
    color: var(--meta);
  }
  code {
    font-family: var(--mono);
    font-size: var(--ui-fs-xs);
    background: var(--soft);
    padding: 0 var(--ui-gap-2xs);
    border-radius: var(--ui-gap-2xs);
  }
</style>
</head>
<body>
<h3>漫剧套件 · 设置</h3>

<div class="field">
  <label>分镜默认画幅<span class="hint">新分镜板的默认比例</span></label>
  <select id="boardRatio">
    <option value="16:9">16:9（横幅）</option>
    <option value="4:3">4:3（传统）</option>
    <option value="2.35:1">2.35:1（宽银幕）</option>
  </select>
</div>

<div class="field">
  <label>网格密度<span class="hint">每行格数，1–8</span></label>
  <input id="gridColumns" type="number" min="1" max="8" value="3">
</div>

<div class="row">
  <button id="save">保存</button>
  <span id="msg" class="msg"></span>
</div>

<p class="note">
  配置只存本机（<code>.suite-state.json</code>），不上传。停用套件时这些值保留。
</p>

<script>
  const ID = 'comicdrama'
  const msgEl = document.getElementById('msg')

  function setMsg(text, kind = '') {
    msgEl.textContent = text
    msgEl.className = `msg${kind ? ` ${kind}` : ''}`
  }

  async function load() {
    try {
      const payload = await fetch(`/api/suite/state-data?id=${ID}`).then((r) => r.json())
      if (!payload.ok) throw new Error(payload.error?.message || '读不到配置')
      const values = payload.values ?? {}
      if (values.boardRatio) document.getElementById('boardRatio').value = values.boardRatio
      if (values.gridColumns !== undefined) document.getElementById('gridColumns').value = values.gridColumns
    } catch (error) {
      setMsg(`读不到配置：${error.message}`, 'err')
    }
  }

  async function save() {
    const button = document.getElementById('save')
    const values = {
      boardRatio: document.getElementById('boardRatio').value,
      gridColumns: Math.min(8, Math.max(1, Number(document.getElementById('gridColumns').value) || 3))
    }
    button.disabled = true
    setMsg('保存中…')
    try {
      const payload = await fetch(`/api/suite/state-data?id=${ID}`, {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ values })
      }).then((r) => r.json())
      if (!payload.ok) throw new Error(payload.error?.message || '保存失败')
      setMsg('已保存（本机）', 'ok')
    } catch (error) {
      setMsg(`保存失败：${error.message}`, 'err')
    } finally {
      button.disabled = false
    }
  }

  // OS-95：按宿主透传的 ?theme= 加载对应令牌表（夜皮下发暗色基底）
  ;(function injectTokens() {
    const theme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light'
    const link = document.getElementById('os-tokens')
    if (link) link.href = `/suite-assets/_tokens.css?theme=${theme}`
    document.documentElement.dataset.theme = theme
  })()

  document.getElementById('save').addEventListener('click', save)
  load()
</script>
</body>
</html>
